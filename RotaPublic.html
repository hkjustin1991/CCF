<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCF 事奉排期 / Serving Rota</title>
    <style>
      :root{
        --purple-bg:#3f1f73;
        --purple-bg-soft:#5d34a1;
        --card:#ffffff;
        --text:#1e1b2e;
        --muted:#6a6285;
        --line:#ddd6f4;
        --vac-bg:#ede9fe;
        --vac-text:#5b21b6;
        --vac-border:#c4b5fd;
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0;width:100%;height:100%}
      body{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        background:linear-gradient(160deg,var(--purple-bg) 0%,var(--purple-bg-soft) 100%);
        color:var(--text);
      }
      .screen{min-height:100vh;width:100vw;padding:6px}
      .card{
        background:var(--card);
        border-radius:10px;
        padding:8px;
        box-shadow:0 6px 18px rgba(10,6,30,0.18);
      }
      .header{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
      .title{font-weight:900;font-size:16px;line-height:1.15;color:#2b1755}
      .versionChip{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#ede9fe;color:#4c1d95;font-weight:800;font-size:10px}
      .small{font-size:10px;color:var(--muted);line-height:1.25}
      .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
      input[type="password"]{
        min-width:180px;
        border:1px solid #c4b5fd;
        border-radius:8px;
        padding:6px 8px;
        font-size:12px;
      }
      button{
        border:0;
        border-radius:8px;
        background:#6d28d9;
        color:#fff;
        font-weight:800;
        padding:6px 9px;
        font-size:11px;
        cursor:pointer;
      }
      button:hover{filter:brightness(1.06)}
      .msg{margin-top:6px;font-size:11px}
      .msg.err{color:#b91c1c}
      .hide{display:none!important}
      .tableWrap{
        margin-top:6px;
        width:100%;
        overflow:auto;
        border:1px solid var(--line);
        border-radius:8px;
        max-height:calc(100vh - 120px);
      }
      table{
        width:max-content;
        min-width:100%;
        border-collapse:collapse;
        background:#fff;
        font-size:10px;
        line-height:1.2;
      }
      th,td{
        border:1px solid var(--line);
        padding:3px 4px;
        vertical-align:top;
        text-align:left;
        white-space:normal;
        word-break:break-word;
      }
      th{position:sticky;top:0;background:#f5f3ff;z-index:1;font-size:10px}
      th:first-child,td:first-child{position:sticky;left:0;background:#faf5ff;z-index:2;min-width:78px}
      .stack{display:flex;flex-wrap:wrap;gap:3px;max-width:180px;white-space:normal}
      .bubble{display:inline-flex;align-items:center;border-radius:999px;padding:2px 6px;border:1px solid #d1d5db;background:#fff;font-size:9px;line-height:1.15}
      .bubble.vacancy{background:var(--vac-bg);color:var(--vac-text);border-color:var(--vac-border);font-weight:800}
      .grp-worship{background:#ffe3e8!important;border-color:rgba(217,60,94,0.35)!important;color:#8a1230!important}
      .grp-media{background:#e7f0ff!important;border-color:rgba(40,90,200,0.35)!important;color:#1a3d9a!important}
      .grp-logistic{background:#f5eadb!important;border-color:rgba(139,94,60,0.35)!important;color:#7a4a22!important}
      .grp-support{background:#e7fff2!important;border-color:rgba(26,168,108,0.35)!important;color:#0b6b40!important}
      .grp-finance{background:#fff2cc!important;border-color:rgba(202,155,0,0.45)!important;color:#7a5b00!important}
      .grp-other{background:#e5e7eb!important;border-color:#cbd5e1!important;color:#374151!important}
      .dash{color:#6b7280;font-weight:700}
      .legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
      .legend .bubble{font-size:9px}
      .headRight{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
      .langToggle{border-radius:999px;padding:4px 10px}

      @media (max-width: 720px){
        .screen{padding:4px}
        .card{padding:6px;border-radius:8px}
        .title{font-size:14px}
        .versionChip{font-size:9px;padding:2px 6px}
        input[type="password"]{min-width:140px;font-size:11px;padding:5px 6px}
        button{padding:5px 8px;font-size:10px}
        table{font-size:9px}
        th,td{padding:2px 3px}
        .stack{max-width:130px;gap:2px}
        .bubble{font-size:8px;padding:1px 5px}
        .langToggle{padding:3px 8px}
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="card" id="loginCard">
        <div class="header">
          <div>
            <div class="title" id="loginTitle">🧩 CCF 事奉排期</div>
            <div class="small" id="loginSub">只供查閱：未來 8 週排期</div>
          </div>
          <div class="headRight">
            <div class="versionChip">ROTA <?= (typeof ROTA_PUBLIC_VERSION !== 'undefined') ? ROTA_PUBLIC_VERSION : 'n/a' ?></div>
            <button id="btnLangLogin" type="button" class="langToggle">EN</button>
          </div>
        </div>
        <div class="row">
          <input id="pwd" type="password" autocomplete="off" placeholder="輸入密碼 / Enter password" />
          <button id="btnOpen" type="button">進入</button>
        </div>
        <div id="msg" class="msg"></div>
      </div>

      <div class="card hide" id="rotaCard">
        <div class="header">
          <div>
            <div class="title" id="rotaTitle">🗓️ 事奉排期</div>
            <div class="small" id="meta"></div>
          </div>
          <div class="headRight">
            <div class="versionChip">ROTA <?= (typeof ROTA_PUBLIC_VERSION !== 'undefined') ? ROTA_PUBLIC_VERSION : 'n/a' ?></div>
            <button id="btnLangRota" type="button" class="langToggle">EN</button>
          </div>
        </div>
        <div class="legend">
          <span class="small" id="legendLabel">圖例</span>
          <span class="bubble vacancy" id="legendVacant">空缺</span>
          <span class="bubble" id="legendMember">同工</span>
          <span class="bubble dash">-</span>
        </div>
        <div class="tableWrap" id="tableWrap"></div>
      </div>
    </div>

    <script>
      function $(id){ return document.getElementById(id); }
      var State = { lang:'zh', data:null };
      function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

      function callApi(fn){
        var args = Array.prototype.slice.call(arguments, 1);
        if (!(window.google && google.script && google.script.run)){
          return Promise.reject(new Error('頁面通訊初始化失敗，請重新開啟連結。 / Portal bridge not ready. Please reopen this page from the Apps Script link.'));
        }
        if (fn !== 'api_public_rota_view'){
          return Promise.reject(new Error('Unsupported API: ' + String(fn || '')));
        }
        return new Promise(function(resolve, reject){
          try{
            var runner = google.script.run
              .withSuccessHandler(function(res){ resolve(res); })
              .withFailureHandler(function(err){
                reject(new Error((err && err.message) ? err.message : String(err || 'API failed')));
              });
            runner.api_public_rota_view(String(args[0] || ''));
          }catch(e){
            reject(e);
          }
        });
      }

      function t(zh, en){ return State.lang === 'zh' ? zh : en; }

      function applyLang_(){
        if ($('btnLangLogin')) $('btnLangLogin').textContent = State.lang === 'zh' ? 'EN' : '中文';
        if ($('btnLangRota')) $('btnLangRota').textContent = State.lang === 'zh' ? 'EN' : '中文';
        if ($('loginTitle')) $('loginTitle').textContent = State.lang === 'zh' ? '🧩 CCF 事奉排期' : '🧩 CCF Serving Rota';
        if ($('loginSub')) $('loginSub').textContent = State.lang === 'zh' ? '只供查閱：未來 8 週排期' : 'Read-only: next 8 weeks rota';
        if ($('pwd')) $('pwd').placeholder = State.lang === 'zh' ? '輸入密碼' : 'Enter password';
        if ($('btnOpen')) $('btnOpen').textContent = State.lang === 'zh' ? '進入' : 'Open';
        if ($('rotaTitle')) $('rotaTitle').textContent = State.lang === 'zh' ? '🗓️ 事奉排期' : '🗓️ Serving Rota';
        if ($('legendLabel')) $('legendLabel').textContent = State.lang === 'zh' ? '圖例' : 'Legend';
        if ($('legendVacant')) $('legendVacant').textContent = State.lang === 'zh' ? '空缺' : 'Vacant';
        if ($('legendMember')) $('legendMember').textContent = State.lang === 'zh' ? '同工' : 'Member';
        if (State.data && $('tableWrap')) $('tableWrap').innerHTML = renderTable(State.data);
      }

      function renderTable(data){
        var positions = Array.isArray(data.positions) ? data.positions : [];
        var rows = Array.isArray(data.rows) ? data.rows : [];
        function groupClass_(g){
          var key = String(g || '').trim().toLowerCase();
          if (!key) return 'grp-other';
          return 'grp-' + key;
        }
        var header = [
          '<th>'+esc(t('日期','Date'))+'</th>',
          '<th>'+esc(t('講題','Sermon title'))+'</th>',
          '<th>'+esc(t('講員','Speaker'))+'</th>',
          '<th>'+esc(t('講道經文','Sermon passage'))+'</th>',
          '<th>'+esc(t('回應經文','Response passage'))+'</th>'
        ];
        positions.forEach(function(p){
          var gcls = groupClass_(p.group);
          header.push('<th class="'+gcls+'">'+esc(State.lang === 'zh' ? (p.labelZh || p.key || '') : (p.labelEn || p.key || ''))+'</th>');
        });

        var body = rows.map(function(r){
          var cells = [
            '<td><b>'+esc(r.dateYmd || '')+'</b></td>',
            '<td>'+esc(r.sermonTitle || '-')+'</td>',
            '<td>'+esc(r.speaker || '-')+'</td>',
            '<td>'+esc(State.lang==='zh' ? (r.sermonPassageZh || '-') : (r.sermonPassageEn || r.sermonPassageZh || '-'))+'</td>',
            '<td>'+esc(State.lang==='zh' ? (r.responsePassageZh || '-') : (r.responsePassageEn || r.responsePassageZh || '-'))+'</td>'
          ];

          positions.forEach(function(p){
            var list = ((r.positions || {})[p.key]) || [{ textZh:'-', textEn:'-', isVacancy:false }];
            var html;
            if (!list.length || (list.length===1 && String((State.lang==='zh'?list[0].textZh:list[0].textEn)||'').trim()==='-')){
              html = '<span class="dash">-</span>';
            } else {
              html = '<div class="stack">' + list.map(function(it){
                var cls = 'bubble';
                if (it && it.isVacancy) cls += ' vacancy';
                else cls += ' ' + groupClass_(p.group);
                var text = (State.lang === 'zh') ? (it && it.textZh) : (it && it.textEn);
                return '<span class="'+cls+'">'+esc(text || '-')+'</span>';
              }).join('') + '</div>';
            }
            cells.push('<td>'+html+'</td>');
          });

          return '<tr>' + cells.join('') + '</tr>';
        }).join('');

        return '<table><thead><tr>'+header.join('')+'</tr></thead><tbody>'+body+'</tbody></table>';
      }

      $('btnOpen').onclick = function(){
        var pwd = String(($('pwd').value || '')).trim();
        $('msg').className = 'msg';
        $('msg').textContent = '載入中... / Loading...';
        callApi('api_public_rota_view', pwd).then(function(res){
          if (!res || !res.ok){
            $('msg').className = 'msg err';
            $('msg').textContent = (res && (res.zh || res.en || res.code)) || '無法載入排期 / Unable to load rota.';
            return;
          }
          $('meta').textContent = (State.lang === 'zh')
            ? ('生成時間：' + String(res.generatedAt || '') + ' · 未來 8 週')
            : ('Generated: ' + String(res.generatedAt || '') + ' · Next 8 weeks');
          State.data = res;
          $('tableWrap').innerHTML = renderTable(res);
          $('loginCard').classList.add('hide');
          $('rotaCard').classList.remove('hide');
        }).catch(function(err){
          $('msg').className = 'msg err';
          $('msg').textContent = (err && err.message) ? err.message : '系統錯誤 / System error';
        });
      };

      $('pwd').addEventListener('keydown', function(e){
        if (e.key === 'Enter') $('btnOpen').click();
      });

      function toggleLang_(){
        State.lang = (State.lang === 'zh') ? 'en' : 'zh';
        if (State.data && $('meta')){
          $('meta').textContent = (State.lang === 'zh')
            ? ('生成時間：' + String(State.data.generatedAt || '') + ' · 未來 8 週')
            : ('Generated: ' + String(State.data.generatedAt || '') + ' · Next 8 weeks');
        }
        applyLang_();
      }
      if ($('btnLangLogin')) $('btnLangLogin').onclick = toggleLang_;
      if ($('btnLangRota')) $('btnLangRota').onclick = toggleLang_;
      applyLang_();
    </script>
  </body>
</html>
