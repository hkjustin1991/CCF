<!-- START: RotaPublic public serving rota screen -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCF 事奉排期 / Serving Rota</title>
    <style>
      :root{
        --purple-bg:#3f1f73;
        --purple-bg-soft:#5d34a1;
        --card:#ffffff;
        --text:#1e1b2e;
        --muted:#6a6285;
        --line:#ddd6f4;
        --vac-bg:#ede9fe;
        --vac-text:#5b21b6;
        --vac-border:#c4b5fd;
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0;width:100%;height:100%}
      body{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        background:linear-gradient(160deg,var(--purple-bg) 0%,var(--purple-bg-soft) 100%);
        color:var(--text);
      }
      .screen{min-height:100vh;width:100vw;padding:6px}
      .card{
        background:var(--card);
        border-radius:10px;
        padding:8px;
        box-shadow:0 6px 18px rgba(10,6,30,0.18);
      }
      .header{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
      .title{font-weight:900;font-size:16px;line-height:1.15;color:#2b1755}
      .versionChip{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#ede9fe;color:#4c1d95;font-weight:800;font-size:10px}
      .small{font-size:10px;color:var(--muted);line-height:1.25}
      .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
      input[type="password"]{
        min-width:180px;
        border:1px solid #c4b5fd;
        border-radius:8px;
        padding:6px 8px;
        font-size:12px;
      }
      button{
        border:0;
        border-radius:8px;
        background:#6d28d9;
        color:#fff;
        font-weight:800;
        padding:6px 9px;
        font-size:11px;
        cursor:pointer;
      }
      button:hover{filter:brightness(1.06)}
      .msg{margin-top:6px;font-size:11px}
      .msg.err{color:#b91c1c}
      .hide{display:none!important}
      .tableWrap{
        margin-top:6px;
        width:100%;
        overflow:auto;
        border:1px solid var(--line);
        border-radius:8px;
        max-height:calc(100vh - 120px);
      }
      table{
        width:max-content;
        min-width:100%;
        border-collapse:collapse;
        background:#fff;
        font-size:10px;
        line-height:1.2;
      }
      th,td{
        border:1px solid var(--line);
        padding:3px 4px;
        vertical-align:top;
        text-align:left;
        white-space:normal;
        word-break:break-word;
      }
      th{position:sticky;top:0;background:#f5f3ff;z-index:1;font-size:10px}
      th:first-child,td:first-child{position:sticky;left:0;background:#faf5ff;z-index:2;min-width:78px}
      .stack{display:flex;flex-wrap:wrap;gap:3px;max-width:180px;white-space:normal}
      .bubble{display:inline-flex;align-items:center;border-radius:999px;padding:2px 6px;border:1px solid #d1d5db;background:#fff;font-size:9px;line-height:1.15}
      .bubble.vacancy{background:var(--vac-bg);color:var(--vac-text);border-color:var(--vac-border);font-weight:800}
      .grp-worship{background:#ffe3e8!important;border-color:rgba(217,60,94,0.35)!important;color:#8a1230!important}
      .grp-media{background:#e7f0ff!important;border-color:rgba(40,90,200,0.35)!important;color:#1a3d9a!important}
      .grp-logistic{background:#f5eadb!important;border-color:rgba(139,94,60,0.35)!important;color:#7a4a22!important}
      .grp-support{background:#e7fff2!important;border-color:rgba(26,168,108,0.35)!important;color:#0b6b40!important}
      .grp-finance{background:#fff2cc!important;border-color:rgba(202,155,0,0.45)!important;color:#7a5b00!important}
      .grp-other{background:#e5e7eb!important;border-color:#cbd5e1!important;color:#374151!important}
      .dash{color:#6b7280;font-weight:700}
      .controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
      .groupToggle{display:inline-flex;gap:4px;align-items:center;font-size:10px;border:1px solid #ddd6f4;border-radius:999px;padding:3px 8px;background:#faf5ff}
      .groupToggle input{margin:0}
      .groupToggle.grp-worship{background:#ffe3e8;border-color:rgba(217,60,94,0.35);color:#8a1230}
      .groupToggle.grp-media{background:#e7f0ff;border-color:rgba(40,90,200,0.35);color:#1a3d9a}
      .groupToggle.grp-logistic{background:#f5eadb;border-color:rgba(139,94,60,0.35);color:#7a4a22}
      .groupToggle.grp-support{background:#e7fff2;border-color:rgba(26,168,108,0.35);color:#0b6b40}
      .groupToggle.grp-finance{background:#fff2cc;border-color:rgba(202,155,0,0.45);color:#7a5b00}
      .groupToggle.grp-other{background:#e5e7eb;border-color:#cbd5e1;color:#374151}
      .sermonToggle{display:inline-flex;gap:4px;align-items:center;font-size:10px;border:1px solid #ddd6f4;border-radius:999px;padding:3px 8px;background:#eef2ff}
      .sermonToggle input{margin:0}
      .nameSelect{border:1px solid #c4b5fd;border-radius:8px;padding:5px 8px;font-size:11px;background:#fff;color:#2b1755}
      .warnText{display:none;margin-top:6px;font-size:10px;color:#7c2d12;background:#ffedd5;border:1px solid #fdba74;border-radius:6px;padding:5px 7px}
      .printTitle{display:none}
      .headRight{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
      .langToggle{border-radius:999px;padding:4px 10px}
      .btnSecondary{background:#4c1d95}

      @media (max-width: 720px){
        .screen{padding:4px}
        .card{padding:6px;border-radius:8px}
        .title{font-size:14px}
        .versionChip{font-size:9px;padding:2px 6px}
        input[type="password"]{min-width:140px;font-size:11px;padding:5px 6px}
        button{padding:5px 8px;font-size:10px}
        table{font-size:9px}
        th,td{padding:2px 3px}
        .stack{max-width:130px;gap:2px}
        .bubble{font-size:8px;padding:1px 5px}
        .langToggle{padding:3px 8px}
      }

      @media print{
        @page{size:A4 landscape;margin:10mm}
        body{background:#fff;color:#111}
        .screen,.card{padding:0;box-shadow:none;border-radius:0}
        .header,.controls{display:none!important}
        .printTitle{display:block;font-size:14px;font-weight:900;margin:0 0 8px 0;color:#111}
        .tableWrap{max-height:none;overflow:visible;border:0}
        .tableWrap table{
          transform-origin:top left;
          transform:scale(var(--print-scale, 1));
        }
        table{font-size:9px}
        .warnText{display:block;margin:0 0 8px 0}
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="card" id="loginCard">
        <div class="header">
          <div>
            <div class="title" id="loginTitle">🧩 CCF 事奉排期</div>
            <div class="small" id="loginSub">只供查閱：未來 8 週排期</div>
          </div>
          <div class="headRight">
            <div class="versionChip">ROTA <?= (typeof ROTA_PUBLIC_VERSION !== 'undefined') ? ROTA_PUBLIC_VERSION : 'n/a' ?></div>
            <button id="btnLangLogin" type="button" class="langToggle">EN</button>
          </div>
        </div>
        <div class="row">
          <input id="pwd" type="password" autocomplete="off" placeholder="輸入密碼 / Enter password" />
          <button id="btnOpen" type="button">進入</button>
        </div>
        <div id="msg" class="msg"></div>
      </div>

      <div class="card hide" id="rotaCard">
        <div class="header">
          <div>
            <div class="title" id="rotaTitle">🗓️ 事奉排期</div>
            <div class="small" id="meta"></div>
          </div>
          <div class="headRight">
            <div class="versionChip">ROTA <?= (typeof ROTA_PUBLIC_VERSION !== 'undefined') ? ROTA_PUBLIC_VERSION : 'n/a' ?></div>
            <button id="btnLangRota" type="button" class="langToggle">EN</button>
          </div>
        </div>
        <div class="controls">
          <button id="btnPdf" type="button" class="btnSecondary">Export PDF</button>
          <label class="sermonToggle"><input type="checkbox" id="toggleSermon" checked /><span id="toggleSermonLabel">講道</span></label>
          <label class="sermonToggle"><input type="checkbox" id="toggleVacancy" checked /><span id="toggleVacancyLabel">空缺</span></label>
          <select id="nameMode" class="nameSelect"></select>
          <div id="groupToggles"></div>
        </div>
        <div class="warnText" id="printWarn"></div>
        <div class="printTitle" id="printTitle"></div>
        <div class="tableWrap" id="tableWrap"></div>
        <div class="controls"><button id="btnWeeks" type="button" class="btnSecondary">Expand to 12 weeks</button></div>
      </div>
    </div>

    <script>
      function $(id){ return document.getElementById(id); }
      var State = { lang:'zh', data:null, groupEnabled:{}, nameMode:'preferred', showSermon:true, showVacancy:true, weeks:8, password:'' };
      function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

      function callApi(fn){
        var args = Array.prototype.slice.call(arguments, 1);
        if (!(window.google && google.script && google.script.run)){
          return Promise.reject(new Error('頁面通訊初始化失敗，請重新開啟連結。 / Portal bridge not ready. Please reopen this page from the Apps Script link.'));
        }
        if (fn !== 'api_public_rota_view'){
          return Promise.reject(new Error('Unsupported API: ' + String(fn || '')));
        }
        return new Promise(function(resolve, reject){
          try{
            var runner = google.script.run
              .withSuccessHandler(function(res){ resolve(res); })
              .withFailureHandler(function(err){
                reject(new Error((err && err.message) ? err.message : String(err || 'API failed')));
              });
            runner.api_public_rota_view(String(args[0] || ''), Number(args[1] || 8));
          }catch(e){
            reject(e);
          }
        });
      }

      function t(zh, en){ return State.lang === 'zh' ? zh : en; }

      function applyLang_(){
        if ($('btnLangLogin')) $('btnLangLogin').textContent = State.lang === 'zh' ? 'EN' : '中文';
        if ($('btnLangRota')) $('btnLangRota').textContent = State.lang === 'zh' ? 'EN' : '中文';
        if ($('loginTitle')) $('loginTitle').textContent = State.lang === 'zh' ? '🧩 CCF 事奉排期' : '🧩 CCF Serving Rota';
        if ($('loginSub')) $('loginSub').textContent = State.lang === 'zh' ? ('只供查閱：未來 ' + State.weeks + ' 週排期') : ('Read-only: next ' + State.weeks + ' weeks rota');
        if ($('pwd')) $('pwd').placeholder = State.lang === 'zh' ? '輸入密碼' : 'Enter password';
        if ($('btnOpen')) $('btnOpen').textContent = State.lang === 'zh' ? '進入' : 'Open';
        if ($('rotaTitle')) $('rotaTitle').textContent = State.lang === 'zh' ? '🗓️ 事奉排期' : '🗓️ Serving Rota';
        if ($('btnPdf')) $('btnPdf').textContent = State.lang === 'zh' ? 'Export PDF' : 'Export PDF';
        if ($('btnWeeks')) $('btnWeeks').textContent = State.weeks === 8
          ? t('展開至 12 週', 'Expand to 12 weeks')
          : t('收合至 8 週', 'Collapse to 8 weeks');
        if ($('toggleSermonLabel')) $('toggleSermonLabel').textContent = State.lang === 'zh' ? '講道' : 'Sermon';
        if ($('toggleVacancyLabel')) $('toggleVacancyLabel').textContent = State.lang === 'zh' ? '空缺' : 'Vacancies';
        if ($('nameMode')){
          var opt = [];
          opt.push('<option value="preferred">'+esc(t('稱呼：常用', 'Names: Preferred'))+'</option>');
          opt.push('<option value="zh">'+esc(t('稱呼：中文', 'Names: Chinese'))+'</option>');
          opt.push('<option value="en">'+esc(t('稱呼：英文', 'Names: English'))+'</option>');
          $('nameMode').innerHTML = opt.join('');
          $('nameMode').value = State.nameMode;
        }
        if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
        if ($('printTitle')) $('printTitle').textContent = buildPrintTitle_();
        if (State.data){
          if ($('groupToggles')) $('groupToggles').innerHTML = renderGroupToggles(State.data.positions || []);
          if ($('tableWrap')) $('tableWrap').innerHTML = renderTable(State.data);
        }
      }

      function buildPrintWarning_(){
        var stamp = displayGeneratedAt_(State.data || null);
        if (!stamp) return '';
        return t(
          '生成時間：' + stamp + '。⚠️ 此文件一經匯出即屬非受控版本，可能不是最新版本，只反映匯出當刻。請以最新線上版本為準。',
          'Generated at: ' + stamp + '. ⚠️ This export is an uncontrolled copy and may not be up to date. It is accurate only at generation time. Always refer to the latest online/live version.'
        );
      }
      function buildPrintTitle_(){
        var stamp = displayGeneratedAt_(State.data || null);
        var suffix = State.lang === 'zh' ? (' · 未來 ' + State.weeks + ' 週') : (' · Next ' + State.weeks + ' weeks');
        if (!stamp) return t('🗓️ 事奉排期', '🗓️ Serving Rota') + suffix;
        return t('🗓️ 事奉排期', '🗓️ Serving Rota') + ' · ' + stamp + suffix;
      }

      function displayGeneratedAt_(data){
        if (!data) return '';
        var raw = String(data.generatedAtDisplay || data.generatedAt || '').trim();
        if (!raw) return '';
        if (data.generatedAtDisplay) return raw;
        var d = new Date(raw);
        if (isNaN(d.getTime())) return raw;
        try{
          return new Intl.DateTimeFormat(undefined, {
            year:'numeric', month:'2-digit', day:'2-digit',
            hour:'2-digit', minute:'2-digit', second:'2-digit',
            hour12:false
          }).format(d);
        }catch(e){
          return raw;
        }
      }

      function renderGroupToggles(positions){
        var seen = {};
        var groups = [];
        var groupLabelMap = {
          worship: { zh:'敬拜聯盟', en:'Worship' },
          media: { zh:'影像大師', en:'Media' },
          logistic: { zh:'後勤特工', en:'Logistics' },
          support: { zh:'聖工支援隊', en:'Support' },
          finance: { zh:'財務公司', en:'Finance' },
          other: { zh:'其他', en:'Other' }
        };
        (positions || []).forEach(function(p){
          var g = String((p && p.group) || '').trim();
          if (!g || seen[g]) return;
          seen[g] = true;
          groups.push(g);
        });
        return groups.map(function(g){
          var key = String(g || '');
          var mapKey = key.toLowerCase();
          var localized = groupLabelMap[mapKey] || { zh:key, en:key };
          var checked = State.groupEnabled[key] !== false;
          var label = esc(State.lang === 'zh' ? localized.zh : localized.en);
          return '<label class="groupToggle grp-'+esc(mapKey || 'other')+'"><input type="checkbox" data-group="'+esc(key)+'" '+(checked?'checked':'')+' />'+label+'</label>';
        }).join('');
      }

      function preparePrintLayout_(){
        var wrap = $('tableWrap');
        if (!wrap) return;
        var table = wrap.querySelector('table');
        if (!table) return;
        var baseWidth = Math.max(320, document.documentElement.clientWidth - 24);
        var tableWidth = Math.max(1, table.scrollWidth || table.offsetWidth || 1);
        var scale = Math.min(1, baseWidth / tableWidth);
        document.documentElement.style.setProperty('--print-scale', String(scale));
      }

      function renderTable(data){
        var positions = Array.isArray(data.positions) ? data.positions : [];
        var activePositions = positions.filter(function(p){
          var g = String((p && p.group) || '').trim();
          return State.groupEnabled[g] !== false;
        });
        var rows = Array.isArray(data.rows) ? data.rows : [];
        function itemText_(it){
          if (!it) return '-';
          if (it.isVacancy) return State.lang === 'zh' ? (it.textZh || '空缺') : (it.textEn || 'Vacant');
          if (State.nameMode === 'zh') return it.textZh || it.textPreferred || it.textEn || '-';
          if (State.nameMode === 'en') return it.textEn || it.textPreferred || it.textZh || '-';
          return it.textPreferred || it.textEn || it.textZh || '-';
        }
        function groupClass_(g){
          var key = String(g || '').trim().toLowerCase();
          if (!key) return 'grp-other';
          return 'grp-' + key;
        }
        var header = [
          '<th>'+esc(t('日期','Date'))+'</th>'
        ];
        if (State.showSermon){
          header.push('<th>'+esc(t('講題','Sermon title'))+'</th>');
          header.push('<th>'+esc(t('講員','Speaker'))+'</th>');
          header.push('<th>'+esc(t('講道經文','Sermon passage'))+'</th>');
          header.push('<th>'+esc(t('回應經文','Response passage'))+'</th>');
        }
        activePositions.forEach(function(p){
          var gcls = groupClass_(p.group);
          header.push('<th class="'+gcls+'">'+esc(State.lang === 'zh' ? (p.labelZh || p.key || '') : (p.labelEn || p.key || ''))+'</th>');
        });

        var body = rows.map(function(r){
          var cells = [
            '<td><b>'+esc(r.dateYmd || '')+'</b></td>'
          ];
          if (State.showSermon){
            cells.push('<td>'+esc(r.sermonTitle || '-')+'</td>');
            cells.push('<td>'+esc(r.speaker || '-')+'</td>');
            cells.push('<td>'+esc(State.lang==='zh' ? (r.sermonPassageZh || '-') : (r.sermonPassageEn || r.sermonPassageZh || '-'))+'</td>');
            cells.push('<td>'+esc(State.lang==='zh' ? (r.responsePassageZh || '-') : (r.responsePassageEn || r.responsePassageZh || '-'))+'</td>');
          }

          activePositions.forEach(function(p){
            var list = ((r.positions || {})[p.key]) || [{ textZh:'-', textEn:'-', textPreferred:'-', isVacancy:false }];
            var cellMeta = (((r || {}).positionMeta || {})[p.key]) || {};
            var html;
            if (!list.length || (list.length===1 && String(itemText_(list[0]) || '').trim()==='-')){
              html = '<span class="dash">-</span>';
            } else {
              var assigned = [];
              var vacancyCount = 0;
              list.forEach(function(it){
                if (it && it.isVacancy) vacancyCount += 1;
                else assigned.push(it);
              });
              var bubbleHtml = assigned.map(function(it){
                return '<span class="bubble '+groupClass_(p.group)+'">'+esc(itemText_(it) || '-')+'</span>';
              });
              if (State.showVacancy && vacancyCount > 0){
                var vacText = vacancyCount >= 2
                  ? (State.lang === 'zh' ? ('空缺 x' + vacancyCount) : ('Vacant x' + vacancyCount))
                  : itemText_({ textZh:'空缺', textEn:'Vacant', textPreferred:'Vacant', isVacancy:true });
                bubbleHtml.push('<span class="bubble vacancy">'+esc(vacText)+'</span>');
              }
              if (!State.showVacancy && !assigned.length){
                html = cellMeta && cellMeta.isClosed ? '<span class="dash">-</span>' : '';
              } else {
                html = bubbleHtml.length ? ('<div class="stack">' + bubbleHtml.join('') + '</div>') : '<span class="dash">-</span>';
              }
            }
            cells.push('<td>'+html+'</td>');
          });

          return '<tr>' + cells.join('') + '</tr>';
        }).join('');

        return '<table><thead><tr>'+header.join('')+'</tr></thead><tbody>'+body+'</tbody></table>';
      }

      $('btnOpen').onclick = function(){
        var pwd = String(($('pwd').value || '')).trim();
        $('msg').className = 'msg';
        $('msg').textContent = '載入中... / Loading...';
        callApi('api_public_rota_view', pwd, State.weeks).then(function(res){
          if (!res || !res.ok){
            $('msg').className = 'msg err';
            $('msg').textContent = (res && (res.zh || res.en || res.code)) || '無法載入排期 / Unable to load rota.';
            return;
          }
          (res.positions || []).forEach(function(p){
            var g = String((p && p.group) || '').trim();
            if (g && typeof State.groupEnabled[g] === 'undefined') State.groupEnabled[g] = true;
          });
          State.weeks = (Number(res.weeks) === 12) ? 12 : 8;
          var stamp = displayGeneratedAt_(res);
          $('meta').textContent = (State.lang === 'zh')
            ? ('生成時間：' + stamp + ' · 未來 ' + State.weeks + ' 週')
            : ('Generated: ' + stamp + ' · Next ' + State.weeks + ' weeks');
          State.data = res;
          State.password = pwd;
          $('groupToggles').innerHTML = renderGroupToggles(res.positions || []);
          $('tableWrap').innerHTML = renderTable(res);
          if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
          if ($('printTitle')) $('printTitle').textContent = buildPrintTitle_();
          $('loginCard').classList.add('hide');
          $('rotaCard').classList.remove('hide');
        }).catch(function(err){
          $('msg').className = 'msg err';
          $('msg').textContent = (err && err.message) ? err.message : '系統錯誤 / System error';
        });
      };

      $('pwd').addEventListener('keydown', function(e){
        if (e.key === 'Enter') $('btnOpen').click();
      });

      function toggleLang_(){
        State.lang = (State.lang === 'zh') ? 'en' : 'zh';
        if (State.data && $('meta')){
          var stamp = displayGeneratedAt_(State.data);
          $('meta').textContent = (State.lang === 'zh')
            ? ('生成時間：' + stamp + ' · 未來 ' + State.weeks + ' 週')
            : ('Generated: ' + stamp + ' · Next ' + State.weeks + ' weeks');
        }
        applyLang_();
      }
      if ($('groupToggles')) $('groupToggles').addEventListener('change', function(e){
        var target = e && e.target;
        if (!target || target.type !== 'checkbox') return;
        var g = String(target.getAttribute('data-group') || '').trim();
        if (!g) return;
        State.groupEnabled[g] = !!target.checked;
        if (State.data && $('tableWrap')){
          $('tableWrap').innerHTML = renderTable(State.data);
          if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
        }
      });
      if ($('btnPdf')) $('btnPdf').onclick = function(){
        if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
        if ($('printTitle')) $('printTitle').textContent = buildPrintTitle_();
        preparePrintLayout_();
        window.print();
      };
      if ($('btnWeeks')) $('btnWeeks').onclick = function(){
        if (!State.password) return;
        State.weeks = (State.weeks === 8) ? 12 : 8;
        applyLang_();
        callApi('api_public_rota_view', State.password, State.weeks).then(function(res){
          if (!res || !res.ok) return;
          State.weeks = (Number(res.weeks) === 12) ? 12 : 8;
          State.data = res;
          var stamp = displayGeneratedAt_(res);
          if ($('meta')){
            $('meta').textContent = (State.lang === 'zh')
              ? ('生成時間：' + stamp + ' · 未來 ' + State.weeks + ' 週')
              : ('Generated: ' + stamp + ' · Next ' + State.weeks + ' weeks');
          }
          if ($('tableWrap')) $('tableWrap').innerHTML = renderTable(res);
          if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
          if ($('printTitle')) $('printTitle').textContent = buildPrintTitle_();
        }).catch(function(){});
      };
      if ($('nameMode')) $('nameMode').addEventListener('change', function(e){
        var next = String((e && e.target && e.target.value) || '').trim().toLowerCase();
        if (next !== 'zh' && next !== 'en' && next !== 'preferred') next = 'preferred';
        State.nameMode = next;
        if (State.data && $('tableWrap')){
          $('tableWrap').innerHTML = renderTable(State.data);
          if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
        }
      });
      if ($('toggleSermon')) $('toggleSermon').addEventListener('change', function(e){
        State.showSermon = !!(e && e.target && e.target.checked);
        if (State.data && $('tableWrap')){
          $('tableWrap').innerHTML = renderTable(State.data);
          if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
        }
      });
      if ($('toggleVacancy')) $('toggleVacancy').addEventListener('change', function(e){
        State.showVacancy = !!(e && e.target && e.target.checked);
        if (State.data && $('tableWrap')){
          $('tableWrap').innerHTML = renderTable(State.data);
          if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
        }
      });
      if ($('btnLangLogin')) $('btnLangLogin').onclick = toggleLang_;
      if ($('btnLangRota')) $('btnLangRota').onclick = toggleLang_;
      window.addEventListener('beforeprint', function(){
        if ($('printWarn')) $('printWarn').textContent = buildPrintWarning_();
        if ($('printTitle')) $('printTitle').textContent = buildPrintTitle_();
        preparePrintLayout_();
      });
      applyLang_();
    </script>
  </body>
</html>
