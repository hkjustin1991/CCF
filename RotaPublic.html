<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCF Serving Rota</title>
    <style>
      :root{
        --purple-bg:#3f1f73;
        --purple-bg-soft:#5d34a1;
        --card:#ffffff;
        --text:#1e1b2e;
        --muted:#6a6285;
        --line:#ddd6f4;
        --vac-bg:#fee2e2;
        --vac-text:#991b1b;
        --vac-border:#fca5a5;
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0;width:100%;height:100%}
      body{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        background:linear-gradient(160deg,var(--purple-bg) 0%,var(--purple-bg-soft) 100%);
        color:var(--text);
      }
      .screen{min-height:100vh;width:100vw;padding:6px}
      .card{
        background:var(--card);
        border-radius:10px;
        padding:8px;
        box-shadow:0 6px 18px rgba(10,6,30,0.18);
      }
      .header{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
      .title{font-weight:900;font-size:16px;line-height:1.15;color:#2b1755}
      .versionChip{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#ede9fe;color:#4c1d95;font-weight:800;font-size:10px}
      .small{font-size:10px;color:var(--muted);line-height:1.25}
      .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
      input[type="password"]{
        min-width:180px;
        border:1px solid #c4b5fd;
        border-radius:8px;
        padding:6px 8px;
        font-size:12px;
      }
      button{
        border:0;
        border-radius:8px;
        background:#6d28d9;
        color:#fff;
        font-weight:800;
        padding:6px 9px;
        font-size:11px;
        cursor:pointer;
      }
      button:hover{filter:brightness(1.06)}
      .msg{margin-top:6px;font-size:11px}
      .msg.err{color:#b91c1c}
      .hide{display:none!important}
      .tableWrap{
        margin-top:6px;
        width:100%;
        overflow:auto;
        border:1px solid var(--line);
        border-radius:8px;
        max-height:calc(100vh - 120px);
      }
      table{
        width:max-content;
        min-width:100%;
        border-collapse:collapse;
        background:#fff;
        font-size:10px;
        line-height:1.2;
      }
      th,td{
        border:1px solid var(--line);
        padding:3px 4px;
        vertical-align:top;
        text-align:left;
        white-space:normal;
        word-break:break-word;
      }
      th{position:sticky;top:0;background:#f5f3ff;z-index:1;font-size:10px}
      th:first-child,td:first-child{position:sticky;left:0;background:#faf5ff;z-index:2;min-width:78px}
      .stack{display:flex;flex-wrap:wrap;gap:3px;max-width:180px;white-space:normal}
      .bubble{display:inline-flex;align-items:center;border-radius:999px;padding:2px 6px;border:1px solid #d1d5db;background:#fff;font-size:9px;line-height:1.15}
      .bubble.vacancy{background:var(--vac-bg);color:var(--vac-text);border-color:var(--vac-border);font-weight:800}
      .dash{color:#6b7280;font-weight:700}
      .legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
      .legend .bubble{font-size:9px}

      @media (max-width: 720px){
        .screen{padding:4px}
        .card{padding:6px;border-radius:8px}
        .title{font-size:14px}
        .versionChip{font-size:9px;padding:2px 6px}
        input[type="password"]{min-width:140px;font-size:11px;padding:5px 6px}
        button{padding:5px 8px;font-size:10px}
        table{font-size:9px}
        th,td{padding:2px 3px}
        .stack{max-width:130px;gap:2px}
        .bubble{font-size:8px;padding:1px 5px}
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="card" id="loginCard">
        <div class="header">
          <div>
            <div class="title">🧩 CCF Serving Rota</div>
            <div class="small">Read-only rota for current and next month.</div>
          </div>
          <div class="versionChip">ROTA <?= ROTA_PUBLIC_VERSION ?></div>
        </div>
        <div class="row">
          <input id="pwd" type="password" autocomplete="off" placeholder="Enter rota password" />
          <button id="btnOpen" type="button">Open rota</button>
        </div>
        <div id="msg" class="msg"></div>
      </div>

      <div class="card hide" id="rotaCard">
        <div class="header">
          <div>
            <div class="title">🗓️ Serving Rota</div>
            <div class="small" id="meta"></div>
          </div>
          <div class="versionChip">ROTA <?= ROTA_PUBLIC_VERSION ?></div>
        </div>
        <div class="legend">
          <span class="small">Legend:</span>
          <span class="bubble vacancy">Vacant</span>
          <span class="bubble">Member</span>
          <span class="bubble dash">-</span>
        </div>
        <div class="tableWrap" id="tableWrap"></div>
      </div>
    </div>

    <script>
      function $(id){ return document.getElementById(id); }
      function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

      function callApi(fn){
        var args = Array.prototype.slice.call(arguments, 1);
        return fetch(location.href, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ fn:fn, args:args })
        }).then(function(r){ return r.json(); })
        .then(function(payload){
          if(!payload || !payload.ok) throw new Error((payload && payload.error && payload.error.message) || 'API failed');
          return payload.result;
        });
      }

      function renderTable(data){
        var positions = Array.isArray(data.positions) ? data.positions : [];
        var rows = Array.isArray(data.rows) ? data.rows : [];
        var header = [
          '<th>Date</th>',
          '<th>Sermon title</th>',
          '<th>Speaker</th>',
          '<th>Sermon passage</th>',
          '<th>Response passage</th>'
        ];
        positions.forEach(function(p){ header.push('<th>'+esc(p.label || p.key || '')+'</th>'); });

        var body = rows.map(function(r){
          var cells = [
            '<td><b>'+esc(r.dateYmd || '')+'</b></td>',
            '<td>'+esc(r.sermonTitle || '-')+'</td>',
            '<td>'+esc(r.speaker || '-')+'</td>',
            '<td>'+esc(r.sermonPassage || '-')+'</td>',
            '<td>'+esc(r.responsePassage || '-')+'</td>'
          ];

          positions.forEach(function(p){
            var list = ((r.positions || {})[p.key]) || [{ text:'-', isVacancy:false }];
            var html;
            if (!list.length || (list.length===1 && String(list[0].text||'').trim()==='-')){
              html = '<span class="dash">-</span>';
            } else {
              html = '<div class="stack">' + list.map(function(it){
                var cls = 'bubble' + (it && it.isVacancy ? ' vacancy' : '');
                return '<span class="'+cls+'">'+esc((it && it.text) || '-')+'</span>';
              }).join('') + '</div>';
            }
            cells.push('<td>'+html+'</td>');
          });

          return '<tr>' + cells.join('') + '</tr>';
        }).join('');

        return '<table><thead><tr>'+header.join('')+'</tr></thead><tbody>'+body+'</tbody></table>';
      }

      $('btnOpen').onclick = function(){
        var pwd = String(($('pwd').value || '')).trim();
        $('msg').className = 'msg';
        $('msg').textContent = 'Loading...';
        callApi('api_public_rota_view', pwd).then(function(res){
          if (!res || !res.ok){
            $('msg').className = 'msg err';
            $('msg').textContent = (res && (res.en || res.code)) || 'Unable to load rota.';
            return;
          }
          $('meta').textContent = 'Generated: ' + String(res.generatedAt || '') + ' · Showing current and next month';
          $('tableWrap').innerHTML = renderTable(res);
          $('loginCard').classList.add('hide');
          $('rotaCard').classList.remove('hide');
        }).catch(function(err){
          $('msg').className = 'msg err';
          $('msg').textContent = (err && err.message) ? err.message : 'System error';
        });
      };

      $('pwd').addEventListener('keydown', function(e){
        if (e.key === 'Enter') $('btnOpen').click();
      });
    </script>
  </body>
</html>
