<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CCF Staff Portal</title>

  <!-- ============================================================
   * FILE: index.html (Staff Portal UI)
   * UI VERSION: staff7-ui2-fixed
   * For Code.gs: v2026-01-24.staff7
   *
   * IMPORTANT: No "Under18" variables anywhere.
   * Uses only:
   *   - member.isMinor
   *   - live item n.isMinor
   * ============================================================ -->

  <style>
    :root{
      --bg:#f5f7ff; --card:#ffffff; --text:#0d1b3d; --muted:#5a6b90;
      --border:rgba(10,30,80,0.12); --good:#1aa86c; --bad:#d93c5e; --warn:#c88400;
      --shadow: 0 10px 24px rgba(10,30,80,0.10);

      --pad: clamp(10px, 3.2vw, 18px);
      --radius: clamp(14px, 3.2vw, 18px);
      --fs-title: clamp(20px, 5.2vw, 28px);
      --fs-big: clamp(18px, 4.8vw, 24px);
      --fs-body: clamp(14px, 3.8vw, 18px);
      --fs-input: clamp(16px, 4.2vw, 20px);
      --fs-small: clamp(12px, 3.2vw, 15px);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:0 auto;padding:var(--pad)}
    .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:8px 2px 8px}
    .title{font-size:var(--fs-title);font-weight:900}
    .sub{font-size:var(--fs-body);color:var(--muted);margin-top:2px}
    .hint{font-size:var(--fs-body);color:var(--muted);margin-top:8px;line-height:1.45}
    .pill{font-size:var(--fs-small);color:var(--muted);border:1px solid var(--border);padding:4px 10px;border-radius:999px;background:#fff}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:calc(var(--pad) + 2px);margin:10px 0;box-shadow:var(--shadow)}
    .big{font-size:var(--fs-big);font-weight:950;letter-spacing:0.2px;line-height:1.25}
    .small{font-size:var(--fs-body);color:var(--muted);margin-top:6px;line-height:1.45}
    .label{font-size:var(--fs-body);color:var(--muted);margin-bottom:6px}

    input,button{
      width:100%;
      border-radius:var(--radius);
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      padding:calc(var(--pad) + 2px);
      font-size:var(--fs-input)
    }
    button{cursor:pointer;font-weight:900;box-shadow:0 6px 14px rgba(10,30,80,0.06)}
    button.primary{background:#e9fff4;border-color:rgba(26,168,108,0.25)}
    button.alt{background:#eef4ff;border-color:rgba(40,90,200,0.18)}
    button.danger{background:#ffeef2;border-color:rgba(217,60,94,0.25)}
    button.blue{ background:#eef4ff; border-color:rgba(40,90,200,0.18); }
    button.orange{ background:#fff6e6; border-color:rgba(200,132,0,0.35); }

    .menuGrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    .menuGrid button{ min-height: 62px; }

    .miniBtnRow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
    .miniBtnRow button{flex:1 1 180px}

    .divider{height:1px;background:var(--border);margin:12px 0}
    .msgBox{border-radius:var(--radius);padding:12px;border:1px solid var(--border);margin-top:10px}
    .msgBox.ok{border-color:rgba(26,168,108,0.35);background:#edfff6}
    .msgBox.err{border-color:rgba(217,60,94,0.35);background:#fff1f4}
    .msgBox.warn{border-color:rgba(200,132,0,0.35);background:#fff6e6}
    .ok{color:var(--good)} .err{color:var(--bad)} .warn{color:var(--warn)}
    .hide{display:none!important}

    .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;margin-top:10px}
    .kv div:nth-child(odd){color:var(--muted)}
    .msgEn{margin-top:4px;font-size:var(--fs-body);}

    .videoWrap{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#f7f9ff}
    video{width:100%;display:block}

    .footer{margin-top:14px;padding:6px 4px;font-size:var(--fs-small);color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.45);
      z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;
    }
    .modal{
      width:min(720px, 100%);
      background:#fff;border-radius:18px;border:1px solid var(--border);
      box-shadow:0 24px 60px rgba(0,0,0,0.25);
      padding:14px;max-height:85vh;overflow:auto;
    }

    .listWrap{max-height:55vh;overflow:auto;border:1px solid var(--border);border-radius:14px;padding:10px;background:#fff}
    .nameItem{
      padding:10px;border:1px solid var(--border);border-radius:12px;margin-top:8px;
      white-space:normal;overflow-wrap:anywhere;word-break:break-word;
    }
    .nameItem.tap{cursor:pointer}
    .nameItem .zh{font-weight:950;}
    .nameItem .en{color:var(--muted);font-size:var(--fs-body);margin-top:4px;font-weight:700;}

    @media (pointer: coarse){
      button{ min-height: 56px; }
    }
    @media (max-width: 420px){
      .kv{ grid-template-columns: 120px 1fr; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <div class="title">CCF Staff Portal</div>
        <div class="sub">同工專用 / Staff only</div>
        <div class="hint">
          請啟用 Cookies、確保網絡連線良好，並允許裝置提示的所有權限。<br/>
          Please enable cookies, ensure good internet connection, and allow all permission prompts while using the portal.
        </div>
      </div>
      <div><span class="pill">v<?= APP_VERSION ?> · ui staff7-ui2-fixed</span></div>
    </header>

    <main id="app"></main>

    <footer class="footer">
      <div>© Cantonese Christian Fellowship</div>
      <div>如問題持續，請聯絡影音同工 / Contact Media team if issue persists</div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    var App = {
      token:null, staff:null,
      view:'login',
      stream:null, raf:null, scanning:false, detector:null,
      debounceT:null, intervalId:null, clockTimer:null,
      liveNamesOpen:false,
      liveData:null,
      stable:{ value:null, count:0, firstTs:0 },

      authApprover:null,
      authTarget:null,
      authRole:null,
      authFlash:null
    };

    var STABLE_REQUIRED_COUNT = 2;
    var STABLE_REQUIRED_MS = 250;

    function $(id){ return document.getElementById(id); }

    function callApi(fn){
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject){
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fn].apply(runner, args);
      });
    }

    function escapeHtml(s){
      s = String(s || '');
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showBox(targetId, kind, titleZh, titleEn, detailHtml){
      detailHtml = detailHtml || '';
      var el = $(targetId); if(!el) return;
      el.innerHTML =
        '<div class="msgBox '+kind+'">' +
          '<div class="big '+(kind==='ok'?'ok':(kind==='err'?'err':'warn'))+'">'+titleZh+'</div>' +
          '<div class="msgEn">'+titleEn+'</div>' +
          (detailHtml ? ('<div style="margin-top:10px;">'+detailHtml+'</div>') : '') +
        '</div>';
    }

    function showErr(targetId, res){
      var code = res && res.code ? (' <span class="pill">'+escapeHtml(res.code)+'</span>') : '';
      var detail = res && res.detail ? ('<div class="small">'+escapeHtml(res.detail)+'</div>') : '';
      showBox(
        targetId,
        'err',
        escapeHtml((res && res.zh) || '發生錯誤') + code,
        escapeHtml((res && res.en) || 'Error'),
        detail
      );
    }

    function openModal(html){
      var o = document.createElement('div');
      o.className = 'overlay';
      o.innerHTML = '<div class="modal">'+html+'</div>';
      document.body.appendChild(o);
      return o;
    }
    function closeModal(o){ try{ document.body.removeChild(o); }catch(e){} }
    function clear(targetId){ var el=$(targetId); if(el) el.innerHTML=''; }

    function kvHtml(pairs){
      var rows = (pairs||[]).filter(function(x){ return x && String(x.v||'').trim() !== ''; });
      if(!rows.length) return '';
      return '<div class="kv">' + rows.map(function(x){
        return '<div>'+escapeHtml(x.k)+'</div><div>'+escapeHtml(x.v)+'</div>';
      }).join('') + '</div>';
    }

    function staffDisplayName(){
      if(!App.staff) return '';
      if(App.staff.id === 'SUPERUSER') return 'SUPERUSER';
      var zh = App.staff.nameZh || '';
      var en = App.staff.nameEn || '';
      return (zh + ' ' + en).trim() || App.staff.id;
    }

    function canTapLiveNames(){
      if(!App.staff) return false;
      if(App.staff.id === 'SUPERUSER') return true;
      var st = String(App.staff.status||'').toUpperCase();
      return (st === 'STAFF' || st === 'ADMIN');
    }

    function canUseAuth(){
      if(!App.staff) return false;
      if(App.staff.id === 'SUPERUSER') return true;
      var st = String(App.staff.status||'').toUpperCase();
      return (st === 'STAFF' || st === 'ADMIN');
    }

    function getDeviceId(){
      try{
        var id = localStorage.getItem('ccf_deviceId');
        if(!id){
          id = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
          localStorage.setItem('ccf_deviceId', id);
        }
        return id;
      }catch(e){
        return 'D' + Date.now().toString(36);
      }
    }
    function getUA(){ try{ return navigator.userAgent || ''; }catch(e){ return ''; } }

    function hiPref(p){
      var s = String(p||'').trim();
      if(!s) return '';
      return '<span style="background:#fff3c4;padding:2px 8px;border-radius:10px;border:1px solid rgba(200,132,0,0.28);">'+escapeHtml(s)+'</span>';
    }

    function isMinorNoticeHtml(isMinor){
      if(!isMinor) return '';
      return ''+
        '<div class="msgBox warn" style="margin-top:10px;">'+
          '<div class="big warn">⚠️ 未滿 18 歲提示</div>'+
          '<div class="msgEn">⚠️ Minor (under 18) notice</div>'+
          '<div class="small" style="margin-top:8px;">'+
            '請留意同行安排及監護需要。<br/>'+
            '如屬未滿 16 歲，請按教會/同工指引採取相應行動（例如確保監護人同在、必要時通知負責同工）。'+
            '<div class="divider"></div>'+
            'Please be mindful of supervision/guardian arrangements.<br/>'+
            'If they are under 16, take appropriate actions per safeguarding guidance (e.g., ensure a guardian is present; escalate if needed).'+
          '</div>'+
        '</div>';
    }

    function emailUiFromStatus(status){
      status = String(status||'').trim().toUpperCase();
      if(status === 'SENT') return { zh:'📧 已發送電郵簽到證明。', en:'📧 Email proof sent.' };
      if(status === 'OPTOUT') return { zh:'📧 已選擇不接收電郵。', en:'📧 Opted out of email.' };
      if(status === 'NO_EMAIL') return { zh:'📧 未有電郵資料。', en:'📧 No email on file.' };
      if(status === 'QUOTA') return { zh:'📧 今日電郵額度已用完。', en:'📧 Daily quota exceeded.' };
      if(status === 'ERROR') return { zh:'📧 電郵發送失敗。', en:'📧 Failed to send email.' };
      if(!status) return { zh:'📧 未有電郵狀態。', en:'📧 No email status.' };
      return { zh:'📧 電郵狀態：' + status, en:'📧 Email status: ' + status };
    }

    function newFriendWelcomeHtml(member){
      if(!member || !member.isNewFriend) return '';
      var pref = (member.preferredName||'').trim();
      var extra = pref ? ('<div class="small" style="margin-top:8px;">Preferred / 常用稱呼：'+hiPref(pref)+'</div>') : '';
      return ''+
        '<div class="msgBox warn" style="margin-top:10px;">'+
          '<div class="big warn">🆕 新朋友 / New friend</div>'+
          '<div class="msgEn">🎉 歡迎第一次到訪 / Welcome</div>'+
          '<div class="small" style="margin-top:8px;">'+
            '歡迎你！如需要加入社群或有任何問題，請聯絡接待/影音同工。<br/>'+
            'Welcome! If you need help or want to join the community, please speak to the Welcome/Media team.'+
          '</div>'+
          extra+
        '</div>';
    }

    function fmtIsoToUkYmdHm(iso){
      if(!iso) return '';
      var d = new Date(iso);
      if(isNaN(d.getTime())) return String(iso);
      try{
        var parts = new Intl.DateTimeFormat('en-GB', {
          timeZone:'Europe/London',
          year:'numeric', month:'2-digit', day:'2-digit',
          hour:'2-digit', minute:'2-digit',
          hour12:false
        }).formatToParts(d);
        var m = {};
        parts.forEach(function(p){ m[p.type]=p.value; });
        return (m.year||'') + '/' + (m.month||'') + '/' + (m.day||'') + ' ' + (m.hour||'') + ':' + (m.minute||'');
      }catch(e){
        var yy = d.getFullYear();
        var mm = ('0'+(d.getMonth()+1)).slice(-2);
        var dd = ('0'+d.getDate()).slice(-2);
        var hh = ('0'+d.getHours()).slice(-2);
        var mi = ('0'+d.getMinutes()).slice(-2);
        return yy + '/' + mm + '/' + dd + ' ' + hh + ':' + mi;
      }
    }

    // Camera switch + scan
    function camGetSelectedId_(){ try{ return localStorage.getItem('ccf_cam_deviceId') || ''; }catch(e){ return ''; } }
    function camSetSelectedId_(id){
      try{ if(id) localStorage.setItem('ccf_cam_deviceId', id); else localStorage.removeItem('ccf_cam_deviceId'); }catch(e){}
    }
    function camListVideoInputs_(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve([]);
      return navigator.mediaDevices.enumerateDevices().then(function(devs){
        var cams = (devs||[]).filter(function(d){ return d && d.kind === 'videoinput'; });
        cams.sort(function(a,b){ return String(a.deviceId||'').localeCompare(String(b.deviceId||'')); });
        return cams;
      }).catch(function(){ return []; });
    }
    function camBindSwitchButton_(btnId, restartFn){
      var btn = $(btnId);
      if(!btn) return;
      camListVideoInputs_().then(function(cams){
        if(!cams || cams.length < 2){ btn.classList.add('hide'); return; }
        btn.classList.remove('hide');
        btn.onclick = function(){
          camListVideoInputs_().then(function(cams2){
            if(!cams2 || cams2.length < 2) return;
            var cur = camGetSelectedId_();
            var idx = cams2.findIndex(function(x){ return x.deviceId === cur; });
            var next = cams2[(idx >= 0 ? idx+1 : 0) % cams2.length];
            camSetSelectedId_(next.deviceId || '');
            if(typeof restartFn === 'function') restartFn();
          });
        };
      });
    }
    function camBuildPreferredConstraints_(){
      var sel = camGetSelectedId_();
      if(sel) return { video: { deviceId: { exact: sel } }, audio:false };
      return { video: { facingMode: { ideal:'environment' } }, audio:false };
    }

    function resetStability(){
      App.stable.value = null;
      App.stable.count = 0;
      App.stable.firstTs = 0;
    }
    function acceptWhenStable(candidate){
      var now = Date.now();
      if(!candidate){ resetStability(); return null; }
      if(App.stable.value === candidate){ App.stable.count += 1; }
      else { App.stable.value = candidate; App.stable.count = 1; App.stable.firstTs = now; }
      var elapsed = now - (App.stable.firstTs || now);
      if(App.stable.count >= STABLE_REQUIRED_COUNT && elapsed >= STABLE_REQUIRED_MS){
        var v = App.stable.value; resetStability(); return v;
      }
      return null;
    }

    function stopScan(){
      App.scanning=false;
      if(App.raf) cancelAnimationFrame(App.raf);
      App.raf=null;
      if(App.stream){
        App.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
        App.stream=null;
      }
      resetStability();
    }

    function startScan(videoId, onCaptured, msgTarget){
      stopScan();
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        showErr(msgTarget, { code:'E420', zh:'此裝置不支援相機', en:'Camera not supported' });
        return;
      }

      var constraintsPreferred = camBuildPreferredConstraints_();
      var constraintsFacingFallback = { video: { facingMode: { ideal:'environment' } }, audio:false };
      var constraintsFallback  = { video: true, audio:false };

      function tryStart(constraints, allowFallback){
        navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
          App.stream = stream;
          var v = $(videoId);
          v.srcObject = stream;
          return v.play().then(function(){
            App.scanning=true;
            scanLoop(v, onCaptured, msgTarget);
          });
        }).catch(function(err){
          var sel = camGetSelectedId_();
          var usingExact = !!(sel && constraints && constraints.video && constraints.video.deviceId && constraints.video.deviceId.exact);
          if(usingExact){
            camSetSelectedId_('');
            tryStart(constraintsFacingFallback, true);
            return;
          }
          if(allowFallback){
            tryStart(constraintsFallback, false);
            return;
          }
          stopScan();
          showErr(msgTarget, { code:'E420', zh:'相機無法啟動', en:'Camera cannot start', detail: err && err.name ? err.name : '' });
        });
      }
      tryStart(constraintsPreferred, true);
    }

    function scanLoop(video, onCaptured, msgTarget){
      if(!App.scanning) return;

      if(!video || video.readyState < 2){
        App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
        return;
      }

      try{
        if('BarcodeDetector' in window){
          App.detector = App.detector || new BarcodeDetector({ formats:['qr_code'] });
          App.detector.detect(video).then(function(codes){
            var candidate = (codes && codes.length && codes[0].rawValue) ? codes[0].rawValue : null;
            var stable = acceptWhenStable(candidate);
            if(stable){ stopScan(); onCaptured(stable); return; }
            App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
          }).catch(function(){
            App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
          });
          return;
        }
      }catch(e){}

      var text = null;
      try{
        if(window.jsQR){
          var canvas = App._canvas || (App._canvas=document.createElement('canvas'));
          var ctx = App._ctx || (App._ctx=canvas.getContext('2d',{ willReadFrequently:true }));
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          var img = ctx.getImageData(0,0,canvas.width,canvas.height);
          var qr = window.jsQR(img.data, canvas.width, canvas.height);
          if(qr && qr.data) text = qr.data;
        }
      }catch(e){}

      var stable2 = acceptWhenStable(text);
      if(stable2){ stopScan(); onCaptured(stable2); return; }
      App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
    }

    function restoreSession(){
      var token = null;
      try { token = sessionStorage.getItem('ccf_token'); } catch(e){}
      if(!token) return;

      callApi('api_ping', token).then(function(res){
        if(res && res.ok){
          App.token = token;
          App.staff = res.staff;
          App.view = 'menu';
          render();
        } else {
          try { sessionStorage.removeItem('ccf_token'); } catch(e){}
        }
      }).catch(function(){
        try { sessionStorage.removeItem('ccf_token'); } catch(e){}
      });
    }

    function startClock(){
      var el = $('liveClock');
      if(!el) return;
      function tick(){
        try{
          var fmt = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/London', hour:'2-digit', minute:'2-digit', second:'2-digit' });
          el.textContent = fmt.format(new Date());
        }catch(e){
          var d = new Date();
          el.textContent = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
        }
      }
      tick();
      App.clockTimer = setInterval(tick, 1000);
    }

    function logout(){
      stopScan();
      if(App.intervalId){ clearInterval(App.intervalId); App.intervalId=null; }
      if(App.clockTimer){ clearInterval(App.clockTimer); App.clockTimer=null; }
      try { callApi('api_logout', App.token); } catch(e){}
      try { sessionStorage.removeItem('ccf_token'); } catch(e){}
      App.token=null; App.staff=null;
      App.view='login';
      render();
    }

    function render(){
      stopScan();
      if(App.intervalId){ clearInterval(App.intervalId); App.intervalId=null; }
      if(App.clockTimer){ clearInterval(App.clockTimer); App.clockTimer=null; }
      clearTimeout(App.debounceT);

      if(App.view !== 'auth'){
        App.authApprover=null;
        App.authTarget=null;
        App.authRole=null;
        App.authFlash=null;
      }

      var root = $('app');
      if(App.view==='login'){ root.innerHTML = viewLogin(); bindLogin(); restoreSession(); return; }
      if(App.view==='menu'){ root.innerHTML = viewMenu(); bindMenu(); return; }
      if(App.view==='checkinMenu'){ root.innerHTML = viewCheckinMenu(); bindCheckinMenu(); return; }
      if(App.view==='scanCheckin'){ root.innerHTML = viewScanCheckin(); bindScanCheckin(); return; }
      if(App.view==='manualCheckin'){ root.innerHTML = viewManualCheckin(); bindManualCheckin(); return; }
      if(App.view==='realtime'){ root.innerHTML = viewRealtime(); bindRealtime(); return; }
      if(App.view==='vrm'){ root.innerHTML = viewVrm(); bindVrm(); return; }
      if(App.view==='auth'){ root.innerHTML = viewAuth(); bindAuth(); return; }
    }

    // ===== Views =====
    function viewLogin(){
      return ''+
        '<div class="card">'+
          '<div class="big">🔐 LOG IN / 登入</div>'+

    function bindScanCheckin(){
      var cam = $('scanCam');

      clear(msg);

      $('backCheckinMenu').onclick = function(){ App.view='checkinMenu'; render(); };
      $('btnRestartScan').onclick = function(){ startCheckinScan(); };

      function renderEmailLine(res, isAlready){
        if(isAlready && res && res.already){
          var stA = String(res.already.emailStatus||'').toUpperCase();
          if(stA === 'SENT'){
            return '<div class="msgBox warn" style="margin-top:10px;">'+
                     '<div class="big warn">📧 上次簽到已發送電郵簽到證明。</div>'+
                     '<div class="msgEn">📧 Email proof was sent at the last sign-in.</div>'+
                   '</div>';
          }
          if(res.already.emailUi && (res.already.emailUi.zh || res.already.emailUi.en)){
            return '<div class="msgBox warn" style="margin-top:10px;">'+
                     '<div class="big warn">'+escapeHtml(res.already.emailUi.zh || '')+'</div>'+
                     '<div class="msgEn">'+escapeHtml(res.already.emailUi.en || '')+'</div>'+
                   '</div>';
          }
          var uiA = emailUiFromStatus(stA);
          return '<div class="msgBox warn" style="margin-top:10px;">'+
                   '<div class="big warn">'+escapeHtml(uiA.zh)+'</div>'+
                   '<div class="msgEn">'+escapeHtml(uiA.en)+'</div>'+
                 '</div>';
        }

        if(res && res.emailUi && (res.emailUi.zh || res.emailUi.en)){
          return '<div class="msgBox warn" style="margin-top:10px;">'+
                   '<div class="big warn">'+escapeHtml(res.emailUi.zh || '')+'</div>'+
                   '<div class="msgEn">'+escapeHtml(res.emailUi.en || '')+'</div>'+
                 '</div>';
        }

        var st = String((res && res.emailStatus) || '').toUpperCase();
        var ui = emailUiFromStatus(st);
        return '<div class="msgBox warn" style="margin-top:10px;">'+
                 '<div class="big warn">'+escapeHtml(ui.zh)+'</div>'+
                 '<div class="msgEn">'+escapeHtml(ui.en)+'</div>'+
               '</div>';
      }

      function startCheckinScan(){
        clear(msg);
        cam.classList.remove('hide');
        startScan('videoCheckin', function(text){
          stopScan();
          cam.classList.add('hide');
          showBox(msg,'warn','處理中…','Working…');
          doCheckin(text);
        }, msg);
      }

      function doCheckin(payload){
        var deviceId = getDeviceId();
        var ua = getUA();

        callApi('api_checkin_scan', App.token, payload, null, deviceId, ua).then(function(res){
          if(!res || !res.ok){
            showErr(msg, res || {code:'E500', zh:'系統錯誤', en:'Error'});
            return;
          }

          var isMinor = !!(res.member && res.member.isMinor);

          if(res.result === 'ALREADY'){
            var hb = res.already && res.already.handledBy
              ? ((res.already.handledBy.nameZh||'')+' '+(res.already.handledBy.nameEn||'')).trim() || (res.already.handledBy.staffId||'')
              : '';

            showBox(msg,'ok','✅ 經已簽到','✅ Already checked in',
              kvHtml([
                {k:'CCF ID', v:res.member.id||''},
                {k:'中文名 / Chinese', v:res.member.nameZh||''},
                {k:'英文名 / English', v:res.member.nameEn||''},
                {k:'上次時間 / Last', v:(res.already&&res.already.timeUk)||''},
                {k:'經手 / By', v:hb},
                {k:'Receipt', v:(res.already&&res.already.receiptId)||''}
              ]) +
              newFriendWelcomeHtml(res.member) +
              isMinorNoticeHtml(isMinor) +
              renderEmailLine(res, true)
            );
            return;
          }

          var handledBy = res.staff ? ((res.staff.nameZh||'')+' '+(res.staff.nameEn||'')).trim() : '';

          showBox(msg,'ok','✅ 簽到成功','✅ Check-in successful',
            kvHtml([
              {k:'CCF ID', v:res.member.id||''},
              {k:'中文名 / Chinese', v:res.member.nameZh||''},
              {k:'英文名 / English', v:res.member.nameEn||''},
              {k:'時間 / Time (UK)', v:res.timeUk||''},
              {k:'經手 / By', v:handledBy},
              {k:'Receipt', v:res.receiptId||''}
            ]) +
            newFriendWelcomeHtml(res.member) +
            isMinorNoticeHtml(isMinor) +
            renderEmailLine(res, false)
          );
        }).catch(function(){
          showErr(msg, { code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.' });
        });
      }
    }

    function bindManualCheckin(){
      var q = $('q');
      var results = $('results');
      var manualMsg = 'manualMsg';
      var manualPanel = $('manualPanel');
      var confirmPanel = $('confirmPanel');

      $('backCheckinMenu2').onclick = function(){ App.view='checkinMenu'; render(); };

      q.addEventListener('input', function(){
        clearTimeout(App.debounceT);
        App.debounceT = setTimeout(function(){
          var text = q.value.trim();
          if(!text){ results.innerHTML=''; clear(manualMsg); return; }

          var t = text.toUpperCase();
          var looksCcf = /^CCF\d+$/i.test(t);
          var fullCcf = /^CCF\d{4,}$/i.test(t);
          if(looksCcf && !fullCcf){
            results.innerHTML = '';
            showBox(manualMsg,'warn',
              '請輸入完整 CCF ID（例如 CCF0123）',
              'Please enter full CCF ID (e.g. CCF0123)',
              '<div class="small">部分 CCF ID 不會搜尋，以免誤選。<br/>Partial CCF IDs are blocked to avoid mistakes.</div>'
            );
            return;
          }

          doSearch(text);
        }, 220);
      });

      function doSearch(text){
        clear(manualMsg);
        callApi('api_search_members', App.token, text).then(function(res){
          if(!res || !res.ok){ showErr(manualMsg, res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }

          if(!res.results || !res.results.length){
            results.innerHTML = '<div class="msgBox warn"><div class="big warn">沒有結果 / No results</div></div>';
            return;
          }

          results.innerHTML = res.results.map(function(r){
            return ''+
              '<div class="msgBox warn" style="margin-bottom:10px;">'+
                kvHtml([
                  {k:'CCF ID', v:r.id||''},
                  {k:'中文名 / Chinese', v:r.nameZh||''},
                  {k:'英文名 / English', v:r.nameEn||''}
                ])+
                '<div class="miniBtnRow">'+
                  '<button class="primary" data-id="'+escapeHtml(r.id)+'">✅ 選擇 / Select</button>'+
                '</div>'+
              '</div>';
          }).join('');

          Array.prototype.slice.call(results.querySelectorAll('button[data-id]')).forEach(function(btn){
            btn.onclick = function(){
              var id = btn.getAttribute('data-id');
              showConfirmOnly(id);
            };
          });

        }).catch(function(){
          showErr(manualMsg, { code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.' });
        });
      }

      function showConfirmOnly(id){
        manualPanel.classList.add('hide');
        confirmPanel.classList.remove('hide');

        confirmPanel.innerHTML = ''+
          '<div class="big">確認簽到？ / Confirm check-in?</div>'+
          kvHtml([{k:'CCF ID', v:id}])+
          '<div class="miniBtnRow">'+
            '<button id="btnConfirm" class="primary">✅ 確認 / Confirm</button>'+
            '<button id="btnCancel" class="danger">取消 / Cancel</button>'+
          '</div>';

        $('btnCancel').onclick = function(){
          confirmPanel.classList.add('hide');
          manualPanel.classList.remove('hide');
        };

        $('btnConfirm').onclick = function(){ doManualCheckin(id); };
      }

      function renderEmailLineFromRes(res){
        if(res && res.result === 'ALREADY'){
          var stA = (res.already && res.already.emailStatus) ? String(res.already.emailStatus).toUpperCase() : '';
          if(stA === 'SENT'){
            return '<div class="msgBox warn" style="margin-top:10px;">'+
                     '<div class="big warn">📧 上次簽到已發送電郵簽到證明。</div>'+
                     '<div class="msgEn">📧 Email proof was sent at the last sign-in.</div>'+
                   '</div>';
          }
          if(res.already && res.already.emailUi && (res.already.emailUi.zh || res.already.emailUi.en)){
            return '<div class="msgBox warn" style="margin-top:10px;">'+
                     '<div class="big warn">'+escapeHtml(res.already.emailUi.zh || '')+'</div>'+
                     '<div class="msgEn">'+escapeHtml(res.already.emailUi.en || '')+'</div>'+
                   '</div>';
          }
          var uiA = emailUiFromStatus(stA);
          return '<div class="msgBox warn" style="margin-top:10px;">'+
                   '<div class="big warn">'+escapeHtml(uiA.zh)+'</div>'+
                   '<div class="msgEn">'+escapeHtml(uiA.en)+'</div>'+
                 '</div>';

        clearTimeout(App.debounceT);

        clear('vrmMsg');

    // Auth + detail + delete + suppress
function bindAuth(){
  if(!canUseAuth()){
    showBox('authMsg','err','沒有權限','No permission');
    return;
  }

  var step = !App.authApprover ? 1 : (!App.authTarget ? 2 : (!App.authRole ? 3 : 4));

  function resetAuthAll(){
    App.authApprover=null;
    App.authTarget=null;
    App.authRole=null;
  }

  if(step === 1){
    $('btnAuthCancel').onclick = function(){ App.view='menu'; render(); };
    $('btnAuthBackMenu').onclick = function(){ App.view='menu'; render(); };
    $('btnAuthRescan1').onclick = function(){ App.authFlash=null; render(); };

    camBindSwitchButton_('btnSwitchCamAuth1', function(){ App.authFlash=null; render(); });

    // Only start scanning if camera panel is visible (flash state collapses camera)
    if (!$('authCam1').classList.contains('hide')) {
      startScan('videoAuth1', function(payload){
        stopScan();
        $('authCam1').classList.add('hide');
        $('authActions').classList.remove('hide');
        showBox('authMsg','warn','處理中…','Working…');

        callApi('api_auth_validate_approver', App.token, payload).then(function(res){
          if(!res || !res.ok){
            showErr('authMsg', res || {code:'E500', zh:'系統錯誤', en:'Error'});
            return;
          }

          var a = res.approver;
          var modal = openModal(
            '<div class="big">確認授權者？ / Confirm approver?</div>'+
            kvHtml([
              {k:'CCF ID', v:a.id||''},
              {k:'姓名 / Name', v:(a.nameZh+" "+a.nameEn).trim()},
              {k:'身份 / Role', v:a.status||''}
            ])+
            '<div class="miniBtnRow" style="margin-top:12px;">'+
              '<button id="btnYes" class="primary">✅ 是我 / Yes</button>'+
              '<button id="btnNo" class="danger">🔁 重新掃描 / Rescan</button>'+
            '</div>'
          );

          modal.querySelector('#btnYes').onclick = function(){
            closeModal(modal);
            App.authApprover = a;
            App.authFlash=null;
            render();
          };
          modal.querySelector('#btnNo').onclick = function(){
            closeModal(modal);
            App.authFlash=null;
            render();
          };
        }).catch(function(){
          showErr('authMsg', { code:'E500', zh:'系統錯誤', en:'Error' });
        });

      }, 'authMsg');
    }
    return;
  }

  if(step === 2){
    $('btnAuthBack1').onclick = function(){ App.authApprover=null; App.authFlash=null; render(); };
    $('btnAuthBackMenu').onclick = function(){ App.view='menu'; render(); };
    $('btnAuthRescan2').onclick = function(){ App.authFlash=null; render(); };

    camBindSwitchButton_('btnSwitchCamAuth2', function(){ App.authFlash=null; render(); });

    startScan('videoAuth2', function(payload){
      stopScan();
      $('authCam2').classList.add('hide');
      $('authActions').classList.remove('hide');
      showBox('authMsg','warn','處理中…','Working…');

      callApi('api_auth_validate_target', App.token, payload).then(function(res){
        if(!res || !res.ok){
          showErr('authMsg', res || {code:'E500', zh:'系統錯誤', en:'Error'});
          return;
        }
        App.authTarget = res.target;
        App.authFlash=null;
        render();
      }).catch(function(){
        showErr('authMsg', { code:'E500', zh:'系統錯誤', en:'Error' });
      });
    }, 'authMsg');

    return;
  }

  if(step === 3){
    $('btnAuthRestartAll').onclick = function(){ resetAuthAll(); App.authFlash=null; render(); };
    $('btnRoleTemp').onclick = function(){ App.authRole='TEMP'; App.authFlash=null; render(); };
    $('btnRoleHelper').onclick = function(){ App.authRole='HELPER'; App.authFlash=null; render(); };
    return;
  }

  if(step === 4){
    $('btnAuthRestartAll').onclick = function(){ resetAuthAll(); App.authFlash=null; render(); };

    $('btnAuthCommit').onclick = function(){
      clear('authMsg');
      showBox('authMsg','warn','處理中…','Working…');

      callApi('api_auth_commit', App.token, App.authApprover.id, App.authTarget.id, App.authRole).then(function(res){
        if(!res || !res.ok){
          showErr('authMsg', res || {code:'E500', zh:'系統錯誤', en:'Error'});
          return;
        }

        var exp = res.target && (res.target.roleExpiresIso || res.target.roleExpires)
          ? fmtIsoToUkYmdHm(res.target.roleExpiresIso || res.target.roleExpires)
          : '';

        App.authFlash = {
          kind:'ok',
          zh:'✅ 已完成授權（已重置）',
          en:'✅ Authorised (reset)',
          detailHtml:
            kvHtml([
              {k:'目標 / Target', v:res.target.id||''},
              {k:'新身份 / New', v:res.target.newStatus||''},
              {k:'到期 / Expiry', v:exp}
            ]) +
            '<div class="small" style="margin-top:10px;">'+
              '已重置流程：需要重新掃描授權者及目標 QR 才可進行下一次授權。<br/>'+
              'Flow reset: you must re-scan approver and target QR for the next authorisation.'+
            '</div>'
        };

        resetAuthAll();
        render(); // Step 1, camera collapsed due to flash
      }).catch(function(){
        showErr('authMsg', { code:'E500', zh:'系統錯誤', en:'Error' });
      });
    };
    return;
  }
}

    function openReauthScan(memberId, parentModal, isSuper){
      var title = isSuper
        ? '請掃描管理員（ADMIN）QR 以作記錄 / Scan ADMIN QR for audit'
        : '請掃描你本人同工 QR 以確認 / Scan your own staff QR to confirm';

      var msgTarget = 'reauthMsg_' + Date.now().toString(36);

      var modal = openModal(
        '<div class="big">'+escapeHtml(title)+'</div>'+
        '<div id="reauthCam" class="card" style="margin-top:10px;">'+
          '<div class="videoWrap"><video id="videoReauth" playsinline></video></div>'+
          '<div class="miniBtnRow">'+
            '<button id="btnSwitchCamReauth" class="alt">🔄 切換相機 / Switch camera</button>'+
            '<button id="btnCancelReauth" class="danger">取消 / Cancel</button>'+
          '</div>'+
        '</div>'+
        '<div id="'+msgTarget+'"></div>'+
        '<div id="reauthActions" class="miniBtnRow hide" style="margin-top:12px;">'+
          '<button id="btnRescanReauth" class="primary">🔁 重新掃描 / Rescan</button>'+
          '<button id="btnBackReauth" class="alt">⬅️ 返回 / Back</button>'+
        '</div>'
      );

      function restart(){
        clear(msgTarget);
        $('reauthCam').classList.remove('hide');
        $('reauthActions').classList.add('hide');
        startScan('videoReauth', onCapturedReauth, msgTarget);
      }

      modal.querySelector('#btnCancelReauth').onclick = function(){ stopScan(); closeModal(modal); };
      modal.querySelector('#btnBackReauth').onclick = function(){ stopScan(); closeModal(modal); };
      modal.querySelector('#btnRescanReauth').onclick = function(){ stopScan(); restart(); };

      camBindSwitchButton_('btnSwitchCamReauth', function(){ stopScan(); restart(); });

      function onCapturedReauth(payload){
        stopScan();
        $('reauthCam').classList.add('hide');
        $('reauthActions').classList.remove('hide');
        showBox(msgTarget,'warn','處理中…','Working…');

        var reauthPayload = isSuper ? '' : payload;
        var adminPayload = isSuper ? payload : '';

        callApi('api_live_delete_today_checkin', App.token, memberId, reauthPayload, adminPayload).then(function(res){
          if(!res || !res.ok){ showErr(msgTarget, res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }

          var del = res.deleted || {};
          var memName = (del.memberNameZh||'').trim() || (del.memberNameEn||'').trim() || '';
          var byName = ((del.byNameZh||'') + ' ' + (del.byNameEn||'')).trim();

          var memberDisplay = (del.memberId||'') + (memName ? ('（'+memName+'）') : '');
          var byDisplay = (del.byId||del.by||'') + (byName ? ('（'+byName+'）') : '');

          showBox(msgTarget,'ok','✅ 已刪除今日簽到','✅ Deleted today attendance',
            kvHtml([
              {k:'Event', v:del.eventKey||''},
              {k:'已刪除 / Deleted', v:'Attendance record deleted / 出席記錄已刪除'},
              {k:'Member', v:memberDisplay},
              {k:'By', v:byDisplay}
            ])
          );

          try{ closeModal(parentModal); }catch(e){}
          var btnRow = document.createElement('div');
          btnRow.className = 'miniBtnRow';
          btnRow.style.marginTop = '12px';
          btnRow.innerHTML = '<button id="btnCloseAfter" class="alt">⬅️ 返回 Live / Back to Live</button>';
          modal.querySelector('.modal').appendChild(btnRow);
          modal.querySelector('#btnCloseAfter').onclick = function(){ closeModal(modal); App.view='realtime'; render(); };
        }).catch(function(){
          showErr(msgTarget, {code:'E500', zh:'系統錯誤', en:'Error'});
        });
      }

      restart();
    }

    function openSuppressNewFriendFlow(memberId, parentModal){
      var modal = openModal(
        '<div class="big warn">🏷️ 確認移除新朋友標記？ / Remove new-friend tag?</div>'+
        '<div class="small">此操作只影響今次聚會顯示（不會改資料、不會發電郵）。<br/>This affects display for this event only (no data change, no email).</div>'+
        '<div class="miniBtnRow" style="margin-top:12px;">'+
          '<button id="btnGoSupp" class="primary">✅ 继续 / Continue</button>'+
          '<button id="btnCancelSupp" class="danger">取消 / Cancel</button>'+
        '</div>'
      );
      modal.querySelector('#btnCancelSupp').onclick = function(){ closeModal(modal); };
      modal.querySelector('#btnGoSupp').onclick = function(){ closeModal(modal); openSuppressReauthScan(memberId, parentModal); };
    }

    function openSuppressReauthScan(memberId, parentModal){
      var isSuper = App.staff && App.staff.id === 'SUPERUSER';

      var title = isSuper
        ? '請掃描管理員（ADMIN）QR 以作記錄 / Scan ADMIN QR for audit'
        : '請掃描你本人同工 QR 以確認 / Scan your own staff QR to confirm';

      var msgTarget = 'suppMsg_' + Date.now().toString(36);

      var modal = openModal(
        '<div class="big">'+escapeHtml(title)+'</div>'+
        '<div id="suppCam" class="card" style="margin-top:10px;">'+
          '<div class="videoWrap"><video id="videoSupp" playsinline></video></div>'+
          '<div class="miniBtnRow">'+
            '<button id="btnSwitchCamSupp" class="alt">🔄 切換相機 / Switch camera</button>'+
            '<button id="btnCancelSupp2" class="danger">取消 / Cancel</button>'+
          '</div>'+
        '</div>'+
        '<div id="'+msgTarget+'"></div>'+
        '<div id="suppActions" class="miniBtnRow hide" style="margin-top:12px;">'+
          '<button id="btnRescanSupp" class="primary">🔁 重新掃描 / Rescan</button>'+
          '<button id="btnBackSupp" class="alt">⬅️ 返回 / Back</button>'+
        '</div>'
      );

      function restart(){
        clear(msgTarget);
        $('suppCam').classList.remove('hide');
        $('suppActions').classList.add('hide');
        startScan('videoSupp', onCaptured, msgTarget);
      }

      modal.querySelector('#btnCancelSupp2').onclick = function(){ stopScan(); closeModal(modal); };
      modal.querySelector('#btnBackSupp').onclick = function(){ stopScan(); closeModal(modal); };
      modal.querySelector('#btnRescanSupp').onclick = function(){ stopScan(); restart(); };

      camBindSwitchButton_('btnSwitchCamSupp', function(){ stopScan(); restart(); });

      function onCaptured(payload){
        stopScan();
        $('suppCam').classList.add('hide');
        $('suppActions').classList.remove('hide');
        showBox(msgTarget,'warn','處理中…','Working…');

        var reauthPayload = isSuper ? '' : payload;
        var adminPayload = isSuper ? payload : '';

        callApi('api_live_suppress_new_friend', App.token, memberId, reauthPayload, adminPayload).then(function(res){
          if(!res || !res.ok){ showErr(msgTarget, res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }

          var t = res.target || {};
          var byName = ((t.byNameZh||'') + ' ' + (t.byNameEn||'')).trim();
          var byDisplay = (t.byId||'') + (byName ? ('（'+byName+'）') : '');

          showBox(msgTarget,'ok','✅ 已移除新朋友標記','✅ New-friend tag removed',
            '<div class="small">只影響本次聚會顯示，不會發電郵。<br/>Display-only for this event; no email.</div>'+
            '<div class="divider"></div>'+
            kvHtml([
              {k:'Event', v:res.eventKey||''},
              {k:'Member', v:(t.id||'')},
              {k:'By', v:byDisplay}
            ])
          );

          try{ closeModal(parentModal); }catch(e){}
          var btnRow = document.createElement('div');
          btnRow.className = 'miniBtnRow';
          btnRow.style.marginTop = '12px';
          btnRow.innerHTML = '<button id="btnCloseAfterSupp" class="alt">⬅️ 返回 Live / Back to Live</button>';
          modal.querySelector('.modal').appendChild(btnRow);
          modal.querySelector('#btnCloseAfterSupp').onclick = function(){
            closeModal(modal);
            App.view='realtime';
            render();
          };

        }).catch(function(){
          showErr(msgTarget, {code:'E500', zh:'系統錯誤', en:'Error'});
        });
      }

      restart();
    }

    // ===== Missing view binders we haven't wired yet (simple wrappers) =====
    function bindVrmWrapper(){ bindVrm(); }
    // bindVrm already defined above, wrapper unused.

    // Boot
    render();
  </script>
</body>
</html>
