  <!--
  ============================================================
  FILE: index.html (Staff Portal UI)
  UI VERSION TAG: staff3-ui1
  ============================================================

  CHANGELOG (staff3-ui1) — requested UI-only changes:
  [1] Live page: show 🆕 New friends list immediately (not behind Names button),
      while keeping Names list toggle available.
  [2] Scan check-in: camera panel collapses AFTER successful check-in (OK/ALREADY),
      Scan again cleanly restarts camera.
  [3] Manual check-in: rich result output consistent with scan (ID, names, time,
      handled-by, receiptId, already-checked details).
  [4] Email proof status shown on UI after check-in (SENT/OPTOUT/NO_EMAIL/QUOTA/ERROR),
      bilingual, and supports ALREADY records (if backend returns emailStatus/emailUi).
  [5] Camera switch: if device has multiple cameras, provide “Switch camera” button
      on scan panels (login, check-in, auth, delete reauth). Selected camera persists.
  [6] Manual search UI gate: if input looks like partial CCF ID (e.g., CCF12),
      do NOT call backend; ask user to enter full CCF ID (e.g., CCF0123).

  PATCH BOUNDARIES: search for "PATCH_BOUNDARY:" blocks for easy future edits.
  ============================================================
  -->

  <style>
    :root{
      --bg:#f5f7ff; --card:#ffffff; --text:#0d1b3d; --muted:#5a6b90;
      --border:rgba(10,30,80,0.12); --good:#1aa86c; --bad:#d93c5e; --warn:#c88400;
      --shadow: 0 10px 24px rgba(10,30,80,0.10);
      /* Adaptive sizing */
      --pad: clamp(10px, 3.2vw, 16px);
      --radius: clamp(14px, 3.2vw, 18px);
      --fs-title: clamp(20px, 4.8vw, 26px);
      --fs-big: clamp(18px, 4.2vw, 22px);
      --fs-body: clamp(13px, 3.4vw, 16px);
      --fs-input: clamp(16px, 4vw, 18px); /* >=16 prevents iOS zoom */
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:0 auto;padding:var(--pad)}
    .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:8px 2px 8px}
    .title{font-size:var(--fs-title);font-weight:900}
    .sub{font-size:var(--fs-body);color:var(--muted);margin-top:2px}
    .hint{font-size:var(--fs-body);color:var(--muted);margin-top:8px;line-height:1.45}
    .pill{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:4px 10px;border-radius:999px;background:#fff}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:calc(var(--pad) + 2px);margin:10px 0;box-shadow:var(--shadow)}
    .big{font-size:var(--fs-big);font-weight:950;letter-spacing:0.2px;line-height:1.25}
    .small{font-size:var(--fs-body);color:var(--muted);margin-top:6px;line-height:1.45}
    .label{font-size:var(--fs-body);color:var(--muted);margin-bottom:6px}
    input,button{width:100%;border-radius:var(--radius);border:1px solid var(--border);background:#fff;color:var(--text);padding:calc(var(--pad) + 2px);font-size:var(--fs-input)}
    button{cursor:pointer;font-weight:900;box-shadow:0 6px 14px rgba(10,30,80,0.06)}
    button.primary{background:#e9fff4;border-color:rgba(26,168,108,0.25)}
    button.alt{background:#eef4ff;border-color:rgba(40,90,200,0.18)}
    button.danger{background:#ffeef2;border-color:rgba(217,60,94,0.25)}
    .miniBtnRow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
    .miniBtnRow button{flex:1 1 180px}
    .divider{height:1px;background:var(--border);margin:12px 0}
    .msgBox{border-radius:var(--radius);padding:12px;border:1px solid var(--border);margin-top:10px}
    .msgBox.ok{border-color:rgba(26,168,108,0.35);background:#edfff6}
    .msgBox.err{border-color:rgba(217,60,94,0.35);background:#fff1f4}
    .msgBox.warn{border-color:rgba(200,132,0,0.35);background:#fff6e6}
    .ok{color:var(--good)} .err{color:var(--bad)} .warn{color:var(--warn)}
    .hide{display:none!important}
    .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;margin-top:10px}
    .kv div:nth-child(odd){color:var(--muted)}
    .videoWrap{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#f7f9ff}
    video{width:100%;display:block}
    .footer{margin-top:14px;padding:6px 4px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.45);
      z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;
    }
    .modal{
      width:min(720px, 100%);
      background:#fff;border-radius:18px;border:1px solid var(--border);
      box-shadow:0 24px 60px rgba(0,0,0,0.25);
      padding:14px;max-height:85vh;overflow:auto;
    }

    /* list items */
    .listWrap{max-height:55vh;overflow:auto;border:1px solid var(--border);border-radius:14px;padding:10px;background:#fff}
    .nameItem{
      padding:10px;border:1px solid var(--border);border-radius:12px;margin-top:8px;
      white-space:normal;overflow-wrap:anywhere;word-break:break-word;
    }
    .nameItem.tap{cursor:pointer}
    .nameItem .zh{font-weight:950;}
    .nameItem .en{color:var(--muted);font-size:14px;margin-top:4px;font-weight:700;}

    @media (pointer: coarse){
      button{ min-height: 52px; }
    }
    @media (max-width: 420px){
      .kv{ grid-template-columns: 120px 1fr; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <div class="title">CCF Staff Portal</div>
        <div class="sub">同工專用 / Staff only</div>
        <div class="hint">
          請啟用 Cookies、確保網絡連線良好，並允許裝置提示的所有權限。<br/>
          Please enable cookies, ensure good internet connection, and allow all permission prompts while using the portal.
        </div>
      </div>
      <div><span class="pill">v<?= APP_VERSION ?> · ui staff3-ui1</span></div>
    </header>

    <main id="app"></main>

    <footer class="footer">
      <div>© Cantonese Christian Fellowship</div>
      <div>如問題持續，請聯絡影音同工 / Contact Media team if issue persists</div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    var App = {
      token:null, staff:null,
      view:'login', // login | menu | checkinMenu | scanCheckin | manualCheckin | realtime | vrm | auth
      stream:null, raf:null, scanning:false, detector:null,
      debounceT:null, intervalId:null, clockTimer:null,
      selectedMember:null,
      liveNamesOpen:false,
      liveData:null,
      stable:{ value:null, count:0, firstTs:0 },

      // auth flow
      authApprover:null, // {id,nameZh,nameEn,status}
      authTarget:null,   // {id,nameZh,nameEn,status,roleExpiresIso}
      authRole:null      // 'HELPER' | 'TEMP'
    };

    // Stability gate (preserved)
    var STABLE_REQUIRED_COUNT = 2;
    var STABLE_REQUIRED_MS = 250;

    function $(id){ return document.getElementById(id); }

    function callApi(fn){
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject){
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fn].apply(runner, args);
      });
    }

    function escapeHtml(s){
      s = String(s || '');
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showBox(targetId, kind, titleZh, titleEn, detailHtml){
      detailHtml = detailHtml || '';
      var el = $(targetId); if(!el) return;
      el.innerHTML =
        '<div class="msgBox '+kind+'">' +
          '<div class="big '+(kind==='ok'?'ok':(kind==='err'?'err':'warn'))+'">'+titleZh+'</div>' +
          '<div style="margin-top:4px;font-size:16px;">'+titleEn+'</div>' +
          (detailHtml ? ('<div style="margin-top:10px;">'+detailHtml+'</div>') : '') +
        '</div>';
    }

    function showErr(targetId, res){
      var code = res && res.code ? (' <span class="pill">'+escapeHtml(res.code)+'</span>') : '';
      var detail = res && res.detail ? ('<div class="small">'+escapeHtml(res.detail)+'</div>') : '';
      showBox(
        targetId,
        'err',
        escapeHtml((res && res.zh) || '發生錯誤') + code,
        escapeHtml((res && res.en) || 'Error'),
        detail
      );
    }

    function openModal(html){
      var o = document.createElement('div');
      o.className = 'overlay';
      o.innerHTML = '<div class="modal">'+html+'</div>';
      document.body.appendChild(o);
      return o;
    }
    function closeModal(o){ try{ document.body.removeChild(o); }catch(e){} }

    function clear(targetId){ var el=$(targetId); if(el) el.innerHTML=''; }

    function staffDisplayName(){
      if(!App.staff) return '';
      if(App.staff.id === 'SUPERUSER') return 'SUPERUSER';
      var zh = App.staff.nameZh || '';
      var en = App.staff.nameEn || '';
      return (zh + ' ' + en).trim() || App.staff.id;
    }

    function canTapLiveNames(){
      if(!App.staff) return false;
      if(App.staff.id === 'SUPERUSER') return true;
      var st = String(App.staff.status||'').toUpperCase();
      return (st === 'STAFF' || st === 'ADMIN');
    }

    function canUseAuth(){
      if(!App.staff) return false;
      if(App.staff.id === 'SUPERUSER') return true;
      var st = String(App.staff.status||'').toUpperCase();
      return (st === 'STAFF' || st === 'ADMIN');
    }

    function getDeviceId(){
      try{
        var id = localStorage.getItem('ccf_deviceId');
        if(!id){
          id = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
          localStorage.setItem('ccf_deviceId', id);
        }
        return id;
      }catch(e){
        return 'D' + Date.now().toString(36);
      }
    }

    function getUA(){
      try{ return navigator.userAgent || ''; }catch(e){ return ''; }
    }

    function resetStability(){
      App.stable.value = null;
      App.stable.count = 0;
      App.stable.firstTs = 0;
    }

    function acceptWhenStable(candidate){
      var now = Date.now();
      if(!candidate){
        resetStability();
        return null;
      }
      if(App.stable.value === candidate){
        App.stable.count += 1;
      } else {
        App.stable.value = candidate;
        App.stable.count = 1;
        App.stable.firstTs = now;
      }
      var elapsed = now - (App.stable.firstTs || now);
      if(App.stable.count >= STABLE_REQUIRED_COUNT && elapsed >= STABLE_REQUIRED_MS){
        var v = App.stable.value;
        resetStability();
        return v;
      }
      return null;
    }

    function stopScan(){
      App.scanning=false;
      if(App.raf) cancelAnimationFrame(App.raf);
      App.raf=null;
      if(App.stream){
        App.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
        App.stream=null;
      }
      resetStability();
    }

    function stopIntervals(){
      if(App.intervalId){ clearInterval(App.intervalId); App.intervalId=null; }
      if(App.clockTimer){ clearInterval(App.clockTimer); App.clockTimer=null; }
    }

    function startClock(){
      var el = $('liveClock');
      if(!el) return;

      function tick(){
        try{
          var fmt = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/London', hour:'2-digit', minute:'2-digit', second:'2-digit' });
          el.textContent = fmt.format(new Date());
        }catch(e){
          var d = new Date();
          var hh = ('0'+d.getHours()).slice(-2);
          var mm = ('0'+d.getMinutes()).slice(-2);
          var ss = ('0'+d.getSeconds()).slice(-2);
          el.textContent = hh+':'+mm+':'+ss;
        }
      }
      tick();
      App.clockTimer = setInterval(tick, 1000);
    }

    /* ============================================================
     * PATCH_BOUNDARY: CAMERA_SWITCH_BEGIN
     * Camera switcher (multi-camera), persists selected deviceId
     * ============================================================ */
    function camGetSelectedId_(){
      try{ return localStorage.getItem('ccf_cam_deviceId') || ''; }catch(e){ return ''; }
    }
    function camSetSelectedId_(id){
      try{
        if(id) localStorage.setItem('ccf_cam_deviceId', id);
        else localStorage.removeItem('ccf_cam_deviceId');
      }catch(e){}
    }

    function camListVideoInputs_(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve([]);
      return navigator.mediaDevices.enumerateDevices().then(function(devs){
        var cams = (devs||[]).filter(function(d){ return d && d.kind === 'videoinput'; });
        // stable ordering by deviceId (labels may be blank on iOS)
        cams.sort(function(a,b){ return String(a.deviceId||'').localeCompare(String(b.deviceId||'')); });
        return cams;
      }).catch(function(){ return []; });
    }

    function camBindSwitchButton_(btnId, restartFn){
      var btn = $(btnId);
      if(!btn) return;

      camListVideoInputs_().then(function(cams){
        if(!cams || cams.length < 2){
          btn.classList.add('hide');
          return;
        }
        btn.classList.remove('hide');

        btn.onclick = function(){
          camListVideoInputs_().then(function(cams2){
            if(!cams2 || cams2.length < 2) return;
            var cur = camGetSelectedId_();
            var idx = cams2.findIndex(function(x){ return x.deviceId === cur; });
            var next = cams2[(idx >= 0 ? idx+1 : 0) % cams2.length];
            camSetSelectedId_(next.deviceId || '');
            if(typeof restartFn === 'function') restartFn();
          });
        };
      });
    }

    function camBuildPreferredConstraints_(){
      var sel = camGetSelectedId_();
      if(sel){
        return { video: { deviceId: { exact: sel } }, audio:false };
      }
      return { video: { facingMode: { ideal:'environment' } }, audio:false };
    }
    /* ============================================================
     * PATCH_BOUNDARY: CAMERA_SWITCH_END
     * ============================================================ */

    function startScan(videoId, onCaptured, msgTarget){
      stopScan();

      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        showErr(msgTarget, { code:'E420', zh:'此裝置不支援相機', en:'Camera not supported' });
        return;
      }

      var constraintsPreferred = camBuildPreferredConstraints_();
      var constraintsFacingFallback = { video: { facingMode: { ideal:'environment' } }, audio:false };
      var constraintsFallback  = { video: true, audio:false };

      function tryStart(constraints, allowFallback){
        navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
          App.stream = stream;
          var v = $(videoId);
          v.srcObject = stream;
          return v.play().then(function(){
            App.scanning=true;
            scanLoop(v, onCaptured, msgTarget);
          });
        }).catch(function(err){
          // If selected deviceId fails, clear and fallback once
          var sel = camGetSelectedId_();
          var usingExact = !!(sel && constraints && constraints.video && constraints.video.deviceId && constraints.video.deviceId.exact);
          if(usingExact){
            camSetSelectedId_('');
            tryStart(constraintsFacingFallback, true);
            return;
          }
          if(allowFallback){
            tryStart(constraintsFallback, false);
            return;
          }
          stopScan();
          showErr(msgTarget, { code:'E420', zh:'相機無法啟動', en:'Camera cannot start', detail: err && err.name ? err.name : '' });
        });
      }

      tryStart(constraintsPreferred, true);
    }

    function scanLoop(video, onCaptured, msgTarget){
      if(!App.scanning) return;

      if(!video || video.readyState < 2){
        App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
        return;
      }

      // BarcodeDetector
      try{
        if('BarcodeDetector' in window){
          App.detector = App.detector || new BarcodeDetector({ formats:['qr_code'] });
          App.detector.detect(video).then(function(codes){
            var candidate = (codes && codes.length && codes[0].rawValue) ? codes[0].rawValue : null;
            var stable = acceptWhenStable(candidate);
            if(stable){
              stopScan();
              onCaptured(stable);
              return;
            }
            App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
          }).catch(function(){
            App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
          });
          return;
        }
      }catch(e){}

      // jsQR fallback
      var text = null;
      try{
        if(window.jsQR){
          var canvas = App._canvas || (App._canvas=document.createElement('canvas'));
          var ctx = App._ctx || (App._ctx=canvas.getContext('2d',{ willReadFrequently:true }));
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          var img = ctx.getImageData(0,0,canvas.width,canvas.height);
          var qr = window.jsQR(img.data, canvas.width, canvas.height);
          if(qr && qr.data) text = qr.data;
        }
      }catch(e){}

      var stable2 = acceptWhenStable(text);
      if(stable2){
        stopScan();
        onCaptured(stable2);
        return;
      }

      App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
    }

    function restoreSession(){
      var token = null;
      try { token = sessionStorage.getItem('ccf_token'); } catch(e){}
      if(!token) return;

      callApi('api_ping', token).then(function(res){
        if(res && res.ok){
          App.token = token;
          App.staff = res.staff;
          App.view = 'menu';
          render();
        } else {
          try { sessionStorage.removeItem('ccf_token'); } catch(e){}
        }
      }).catch(function(){
        try { sessionStorage.removeItem('ccf_token'); } catch(e){}
      });
    }

    function logout(){
      stopScan(); stopIntervals();
      try { callApi('api_logout', App.token); } catch(e){}
      try { sessionStorage.removeItem('ccf_token'); } catch(e){}
      App.token=null; App.staff=null;
      App.view='login';
      render();
    }

    function render(){
      stopScan(); stopIntervals();
      clearTimeout(App.debounceT);
      App.selectedMember=null;
      App.liveNamesOpen=false;
      App.liveData=null;

      // reset auth state on render changes
      if(App.view !== 'auth'){
        App.authApprover=null;
        App.authTarget=null;
        App.authRole=null;
      }

      var root = $('app');
      if(App.view==='login'){ root.innerHTML = viewLogin(); bindLogin(); restoreSession(); return; }
      if(App.view==='menu'){ root.innerHTML = viewMenu(); bindMenu(); return; }
      if(App.view==='checkinMenu'){ root.innerHTML = viewCheckinMenu(); bindCheckinMenu(); return; }
      if(App.view==='scanCheckin'){ root.innerHTML = viewScanCheckin(); bindScanCheckin(); return; }
      if(App.view==='manualCheckin'){ root.innerHTML = viewManualCheckin(); bindManualCheckin(); return; }
      if(App.view==='realtime'){ root.innerHTML = viewRealtime(); bindRealtime(); return; }
      if(App.view==='vrm'){ root.innerHTML = viewVrm(); bindVrm(); return; }
      if(App.view==='auth'){ root.innerHTML = viewAuth(); bindAuth(); return; }
    }

    /******** Views ********/
    function viewLogin(){
      return ''+
        '<div class="card">'+
          '<div class="big">🔐 LOG IN / 登入</div>'+
          '<div class="small">請掃描你自己的個人 QR code 以登入。<br/>Please scan your personal QR code to log in.</div>'+
          '<div class="miniBtnRow">'+
            '<button id="btnStartLoginScan" class="primary">📷 掃描 QR 登入 / Scan QR to log in</button>'+
          '</div>'+
          '<div id="loginCam" class="card hide" style="margin-top:10px;">'+
            '<div class="big">📷 掃描中… / Scanning…</div>'+
            '<div class="videoWrap" style="margin-top:10px;"><video id="videoLogin" playsinline></video></div>'+
            '<div class="miniBtnRow">'+
              '<button id="btnSwitchCamLogin" class="alt">🔄 切換相機 / Switch camera</button>'+
              '<button id="btnCancelLoginScan" class="danger">取消 / Cancel</button>'+
            '</div>'+
          '</div>'+
          '<div class="divider"></div>'+
          '<div>'+
            '<div class="label">For internal use only</div>'+
            '<input id="internalField" type="password" autocomplete="off" />'+
            '<div class="miniBtnRow" style="margin-top:8px;">'+
              '<button id="btnInternalOk" class="alt">OK</button>'+
            '</div>'+
          '</div>'+
          '<div id="msg"></div>'+
          '<div class="small" style="margin-top:10px;">如問題持續，請聯絡影音同工。<br/>Contact Media team if issue persists.</div>'+
        '</div>';
    }

    function viewMenu(){
      var st = App.staff ? String(App.staff.status||'').toUpperCase() : '';
      var isSuper = App.staff && App.staff.id === 'SUPERUSER';

      var authBtn = (canUseAuth())
        ? '<div class="miniBtnRow">'+
            '<button id="goAuth" class="alt">🔐 授權 / Authorise</button>'+
          '</div>'
        : '';

      return ''+
        '<div class="card">'+
          '<div class="big">👋 已登入 / Logged in</div>'+
          '<div class="kv">'+
            '<div>同工 / Staff</div><div>'+escapeHtml(staffDisplayName())+'</div>'+
            '<div>身份 / Role</div><div>'+escapeHtml(isSuper ? 'SUPERUSER' : st)+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="card">'+
          '<div class="big">📌 主選單 / Main menu</div>'+
          '<div class="miniBtnRow">'+
            '<button id="goCheckin" class="primary">✅ 簽到 / Check-in</button>'+
          '</div>'+
          '<div class="miniBtnRow">'+
            '<button id="goRealtime" class="alt">📊 即時情況 / Live</button>'+
            '<button id="goVrm" class="alt">🚗 車牌搜尋 / Car reg</button>'+
          '</div>'+
          authBtn+
          '<div class="divider"></div>'+
          '<div class="miniBtnRow">'+
            '<button id="btnLogout" class="danger">🚪 登出 / Logout</button>'+
          '</div>'+
        '</div>';
    }

    function viewCheckinMenu(){
      return ''+
        '<div class="card">'+
          '<div class="big">✅ 簽到 / Check-in</div>'+
          '<div class="miniBtnRow">'+
            '<button id="goScanCheckin" class="primary">📷 掃描 QR 卡 / Scan QR badge</button>'+
          '</div>'+

    function emailUiFromStatus(status){
      status = String(status||'').trim().toUpperCase();
      if(status === 'SENT') return { zh:'📧 已發送電郵簽到證明。', en:'📧 Email proof sent.' };
      if(status === 'OPTOUT') return { zh:'📧 已選擇不接收電郵。', en:'📧 Opted out of email.' };
      if(status === 'NO_EMAIL') return { zh:'📧 未有電郵資料。', en:'📧 No email on file.' };
      if(status === 'QUOTA') return { zh:'📧 今日電郵額度已用完。', en:'📧 Daily quota exceeded.' };
      if(status === 'ERROR') return { zh:'📧 電郵發送失敗。', en:'📧 Failed to send email.' };
      if(!status) return { zh:'📧 未有電郵狀態。', en:'📧 No email status.' };
      return { zh:'📧 電郵狀態：' + status, en:'📧 Email status: ' + status };
    }

    function bindScanCheckin(){
      var cam = $('scanCam');
      var msg = 'scanMsg';
      clear(msg);

      $('backCheckinMenu').onclick = function(){ App.view='checkinMenu'; render(); };

      $('btnStopCam').onclick = function(){
        stopScan();
        showBox(msg,'warn','⏹ 已停止相機','⏹ Camera stopped','<div class="small">可按「Scan again」重新開啟。</div>');
      };

      $('btnRestartScan').onclick = function(){ startCheckinScan(); };

      camBindSwitchButton_('btnSwitchCamCheckin', function(){
        startCheckinScan();
      });

      startCheckinScan();

      function startCheckinScan(){
        clear(msg);
        cam.classList.remove('hide');
        startScan('videoCheckin', function(text){
          // Stop camera during processing, but do NOT collapse panel yet
          stopScan();
          showBox(msg,'warn','處理中…','Working…');
          doCheckin(text);
        }, msg);
      }

      function renderEmailLine(res){
        // Prefer emailUi (bilingual) if returned by backend
        if(res && res.emailUi && (res.emailUi.zh || res.emailUi.en)){
          return '<div class="msgBox warn" style="margin-top:10px;">' +
                   '<div class="big warn">'+escapeHtml(res.emailUi.zh || '')+'</div>' +
                   '<div style="margin-top:4px;font-size:16px;">'+escapeHtml(res.emailUi.en || '')+'</div>' +
                 '</div>';
        }
        var st = (res && res.emailStatus) ? res.emailStatus : '';
        if(!st && res && res.already && res.already.emailStatus) st = res.already.emailStatus;
        var ui = emailUiFromStatus(st);
        return '<div class="msgBox warn" style="margin-top:10px;">' +
                 '<div class="big warn">'+escapeHtml(ui.zh)+'</div>' +
                 '<div style="margin-top:4px;font-size:16px;">'+escapeHtml(ui.en)+'</div>' +
               '</div>';
      }

      function doCheckin(payload){
        var deviceId = getDeviceId();
        var ua = getUA();

        callApi('api_checkin_scan', App.token, payload, null, deviceId, ua).then(function(res){
          if(!res || !res.ok){
            // Keep camera panel open (no collapse), and allow retry
            showErr(msg, res || {code:'E500', zh:'系統錯誤', en:'Error'});
            cam.classList.remove('hide');
            return;
          }

          var handledBy = res.staff ? ((res.staff.nameZh||'')+' '+(res.staff.nameEn||'')).trim() : '';

          if(res.result === 'ALREADY'){
            cam.classList.add('hide'); // collapse after successful outcome
            var hb = res.already && res.already.handledBy
              ? ((res.already.handledBy.nameZh||'')+' '+(res.already.handledBy.nameEn||'')).trim() || (res.already.handledBy.staffId||'')
              : '';

            showBox(msg,'ok','✅ 經已簽到','✅ Already checked in',
              '<div class="kv">'+
                '<div>CCF ID</div><div>'+escapeHtml(res.member.id||'')+'</div>'+
                '<div>中文名</div><div>'+escapeHtml(res.member.nameZh||'')+'</div>'+
                '<div>English</div><div>'+escapeHtml(res.member.nameEn||'')+'</div>'+
                '<div>Last sign-in</div><div>'+escapeHtml((res.already&&res.already.timeUk)||'')+'</div>'+
                '<div>Handled by</div><div>'+escapeHtml(hb)+'</div>'+
                '<div>Receipt</div><div>'+escapeHtml((res.already&&res.already.receiptId)||'')+'</div>'+
              '</div>' +
              renderEmailLine(res.already && res.already.emailUi ? { emailUi: res.already.emailUi } : res)
            );
            return;
          }

          cam.classList.add('hide'); // collapse after successful outcome

          showBox(msg,'ok','✅ 簽到成功','✅ Check-in successful',
            '<div class="kv">'+
              '<div>CCF ID</div><div>'+escapeHtml(res.member.id||'')+'</div>'+
              '<div>中文名</div><div>'+escapeHtml(res.member.nameZh||'')+'</div>'+
              '<div>English</div><div>'+escapeHtml(res.member.nameEn||'')+'</div>'+
              '<div>Time (UK)</div><div>'+escapeHtml(res.timeUk||'')+'</div>'+
              '<div>Handled by</div><div>'+escapeHtml(handledBy)+'</div>'+
              '<div>Receipt</div><div>'+escapeHtml(res.receiptId||'')+'</div>'+
            '</div>' +
            renderEmailLine(res)
          );
        }).catch(function(){
          showErr(msg, { code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.' });
          cam.classList.remove('hide');
        });
      }
    }

    function bindManualCheckin(){
      var q = $('q');
      var results = $('results');
      var manualMsg = 'manualMsg';
      var manualPanel = $('manualPanel');
      var confirmPanel = $('confirmPanel');

      $('backCheckinMenu2').onclick = function(){ App.view='checkinMenu'; render(); };

      q.addEventListener('input', function(){
        clearTimeout(App.debounceT);
        App.debounceT = setTimeout(function(){
          var text = q.value.trim();
          if(!text){ results.innerHTML=''; clear(manualMsg); return; }

          /* ============================================================
           * PATCH_BOUNDARY: MANUAL_SEARCH_PARTIAL_CCF_GATE_UI_BEGIN
           * If user types partial CCF ID (e.g. CCF12), do not call backend.
           * Only full CCF ID (e.g. CCF0123) should do an ID lookup.
           * ============================================================ */
          var t = text.toUpperCase();
          var looksCcf = /^CCF\d+$/i.test(t);
          var fullCcf = /^CCF\d{4,}$/i.test(t);
          if(looksCcf && !fullCcf){
            results.innerHTML = '';
            showBox(manualMsg,'warn',
              '請輸入完整 CCF ID（例如 CCF0123）',
              'Please enter full CCF ID (e.g. CCF0123)',
              '<div class="small">部分 CCF ID 不會搜尋，以免誤選。</div>'
            );
            return;
          }
          /* ============================================================
           * PATCH_BOUNDARY: MANUAL_SEARCH_PARTIAL_CCF_GATE_UI_END
           * ============================================================ */

          doSearch(text);
        }, 220);
      });

      function doSearch(text){
        clear(manualMsg);
        callApi('api_search_members', App.token, text).then(function(res){
          if(!res || !res.ok){ showErr(manualMsg, res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }

          if(!res.results || !res.results.length){
            results.innerHTML = '<div class="msgBox warn"><div class="big warn">沒有結果 / No results</div></div>';
            return;
          }

          results.innerHTML = res.results.map(function(r){
            return ''+
              '<div class="msgBox warn" style="margin-bottom:10px;">'+
                '<div class="kv">'+
                  '<div>CCF ID</div><div>'+escapeHtml(r.id)+'</div>'+
                  '<div>中文名</div><div>'+escapeHtml(r.nameZh||'')+'</div>'+
                  '<div>English</div><div>'+escapeHtml(r.nameEn||'')+'</div>'+
                '</div>'+
                '<div class="miniBtnRow">'+
                  '<button class="primary" data-id="'+escapeHtml(r.id)+'">✅ 選擇 / Select</button>'+
                '</div>'+
              '</div>';
          }).join('');

          Array.prototype.slice.call(results.querySelectorAll('button[data-id]')).forEach(function(btn){
            btn.onclick = function(){
              var id = btn.getAttribute('data-id');
              App.selectedMember = { id:id, nameZh:'', nameEn:'' };
              showConfirmOnly(id);
            };
          });

        }).catch(function(){
          showErr(manualMsg, { code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.' });
        });
      }

      function showConfirmOnly(id){

          manualPanel.classList.remove('hide');
          App.selectedMember=null;

            '<div class="kv">'+
              '<div>CCF ID</div><div>'+escapeHtml((res.member&&res.member.id)||id)+'</div>'+
              '<div>中文名</div><div>'+escapeHtml((res.member&&res.member.nameZh)||'')+'</div>'+
              '<div>English</div><div>'+escapeHtml((res.member&&res.member.nameEn)||'')+'</div>'+
              '<div>Time (UK)</div><div>'+escapeHtml(res.timeUk||'')+'</div>'+
              '<div>Handled by</div><div>'+escapeHtml(handledBy)+'</div>'+
              '<div>Receipt</div><div>'+escapeHtml(res.receiptId||'')+'</div>'+
            '</div>' +
            renderEmailLineFromRes(res)
          );
        }).catch(function(){
          showErr(manualMsg, { code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.' });
        });
      }
    }

    function bindRealtime(){
      $('backMenu2').onclick = function(){ App.view='menu'; render(); };
      $('btnRtRefresh').onclick = function(){ refresh(); };
      $('btnToggleNames').onclick = function(){ toggleNames(); };

      startClock();
      refresh();
      App.intervalId = setInterval(function(){ refresh(); }, 120000);

      function refresh(){
        var box = $('rtBox');
        box.innerHTML = '<div class="small">更新中… / Loading…</div>';

        callApi('api_get_live_page', App.token, null).then(function(res){
          if(!res || !res.ok){ box.innerHTML=''; showErr('rtBox', res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }
          App.liveData = res;

          var last = res.lastSignIn
            ? '<div class="msgBox warn" style="margin-top:10px;"><div class="big warn">最後簽到 / Last sign-in</div><div style="margin-top:6px;font-size:16px;">'+escapeHtml(res.lastSignIn.timeUk)+' — '+escapeHtml(((res.lastSignIn.nameZh||'')+' '+(res.lastSignIn.nameEn||'')).trim())+'</div></div>'
            : '<div class="msgBox warn" style="margin-top:10px;"><div class="big warn">暫無記錄 / No check-ins yet</div></div>';

          /* ============================================================
           * PATCH_BOUNDARY: LIVE_NEWFRIENDS_ALWAYS_VISIBLE_BEGIN
           * Always show 🆕 new friends list on live page
           * ============================================================ */
          var names = res.names || [];
          var newFriends = names.filter(function(n){ return n && n.isNew; });

          var newFriendsHtml = '';
          if(newFriends.length){
            newFriendsHtml =
              '<div class="msgBox warn" style="margin-top:10px;">'+
                '<div class="big warn">🆕 新朋友 / New friends ('+escapeHtml(newFriends.length)+')</div>'+
                '<div class="small">（自動顯示）/ Auto-shown</div>'+
              '</div>'+
              '<div class="listWrap" style="margin-top:10px;">'+
                newFriends.map(function(n){
                  var zh = n.nameZh || '';
                  var en = n.nameEn || '';
                  var top = '🆕 ' + (zh || en || '');
                  var bottom = [];
                  if(zh && en) bottom.push(en);
                  bottom.push('CCF ID: ' + (n.id||''));
                  return ''+
                    '<div class="nameItem">'+
                      '<div class="zh">'+escapeHtml(top)+'</div>'+
                      '<div class="en">'+escapeHtml(bottom.join(' · '))+'</div>'+
                    '</div>';
                }).join('')+
              '</div>';
          } else {
            newFriendsHtml =
              '<div class="msgBox warn" style="margin-top:10px;">'+
                '<div class="big warn">🆕 新朋友 / New friends</div>'+
                '<div class="small">暫時沒有 / None</div>'+
              '</div>';
          }
          /* ============================================================
           * PATCH_BOUNDARY: LIVE_NEWFRIENDS_ALWAYS_VISIBLE_END
           * ============================================================ */

          box.innerHTML =
            '<div class="kv">' +
              '<div>Event</div><div>'+escapeHtml(res.eventKey)+'</div>' +
              '<div>已簽到</div><div><span class="big">'+escapeHtml(res.checkedInCount)+'</span></div>' +
              '<div>新朋友</div><div><span class="big">'+escapeHtml(res.newCount||0)+'</span></div>' +
            '</div>' +
            last +
            newFriendsHtml;

          if(App.liveNamesOpen) renderNames();
        }).catch(function(){
          $('rtBox').innerHTML='';
          showErr('rtBox', { code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.' });
        });
      }

      function toggleNames(){
        App.liveNamesOpen = !App.liveNamesOpen;
        var box = $('rtNamesBox');
        if(!App.liveNamesOpen){ box.classList.add('hide'); return; }
        box.classList.remove('hide');
        renderNames();
      }

      function renderNames(){
        var box = $('rtNamesBox');
        var res = App.liveData;
        if(!res || !res.names){
          box.innerHTML = '<div class="small">載入中… / Loading…</div>';
          return;
        }

        var tappable = canTapLiveNames();

        box.innerHTML =
          '<div class="big">👥 名單 / Names</div>' +
          '<div class="small">（可向下滑動 / Scroll down）</div>' +
          '<div class="listWrap" style="margin-top:10px;">' +
            res.names.map(function(n){
              var zh = n.nameZh || '';
              var en = n.nameEn || '';
              var top = (n.isNew ? '🆕 ' : '') + (zh || en || '');
              var bottom = (zh && en) ? en : '';
              var cls = 'nameItem' + (tappable ? ' tap' : '');
              return '<div class="'+cls+'" data-mid="'+escapeHtml(n.id)+'">' +
                       '<div class="zh">' + escapeHtml(top) + '</div>' +
                       (bottom ? ('<div class="en">' + escapeHtml(bottom) + '</div>') : '') +
                     '</div>';
            }).join('') +
          '</div>';

        if(tappable){
          Array.prototype.slice.call(box.querySelectorAll('.nameItem[data-mid]')).forEach(function(el){
            el.onclick = function(){
              var mid = el.getAttribute('data-mid');
              openMemberDetailModal(mid);
            };
          });
        }
      }
    }

    function bindVrm(){
      $('backMenu3').onclick = function(){ App.view='menu'; render(); };

      var q = $('vrmQ');
      var out = $('vrmResults');

      q.addEventListener('input', function(){
        clearTimeout(App.debounceT);
        App.debounceT = setTimeout(function(){
          var text = q.value.trim();
          if(!text){ out.innerHTML=''; clear('vrmMsg'); return; }
          search(text);
        }, 220);
      });

      function search(text){
        clear('vrmMsg');
        callApi('api_search_vrm', App.token, text, null).then(function(res){
          if(!res || !res.ok){ showErr('vrmMsg', res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }

          if(!res.hasVRM){
            out.innerHTML = '';
            showBox('vrmMsg','warn','未找到 VRM 欄位','VRM columns not found',
              '<div class="small">請在 Members 表加入兩欄：VRM 及 VRM2（欄名需完全相同）。<br/>Add headers: VRM and VRM2 (exact names).</div>');
            return;
          }

          if(!res.results || !res.results.length){
            out.innerHTML = '<div class="msgBox warn"><div class="big warn">沒有結果 / No results</div></div>';
            return;
          }

          out.innerHTML = res.results.map(function(r){
            var plates = [r.vrm, r.vrm2].filter(Boolean).join(' / ');
            var ci = r.checkedInToday
              ? '<div class="big ok">✅ 已簽到 / Checked-in</div>'
              : '<div class="big warn">⏳ 未簽到 / Not checked-in</div>';

            return ''+
              '<div class="msgBox warn" style="margin-bottom:10px;">'+
                '<div class="kv">'+
                  '<div>車牌 / Plate</div><div>'+escapeHtml(plates)+'</div>'+
                  '<div>CCF ID</div><div>'+escapeHtml(r.id)+'</div>'+
                  '<div>中文名</div><div>'+escapeHtml(r.nameZh||'')+'</div>'+
                  '<div>English</div><div>'+escapeHtml(r.nameEn||'')+'</div>'+
                '</div>'+
                '<div style="margin-top:10px;">'+ci+'</div>'+
              '</div>';
          }).join('');

        }).catch(function(){
          showErr('vrmMsg', { code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.' });
        });
      }
    }

    /******** Auth UI wiring ********/
    function bindAuth(){
      if(!canUseAuth()){
        showBox('authMsg','err','沒有權限','No permission');
        return;
      }

      var step = !App.authApprover ? 1 : (!App.authTarget ? 2 : (!App.authRole ? 3 : 4));

      if(step === 1){
        $('btnAuthCancel').onclick = function(){ App.view='menu'; render(); };

        camBindSwitchButton_('btnSwitchCamAuth1', function(){
          render(); // simplest restart: rerender step 1, startScan again
        });

        startScan('videoAuth', function(payload){
          callApi('api_auth_validate_approver', App.token, payload).then(function(res){
            if(!res || !res.ok){ showErr('authMsg', res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }

            var a = res.approver;
            var modal = openModal(
              '<div class="big">確認授權者？ / Confirm approver?</div>'+
              '<div class="kv">'+
                '<div>CCF ID</div><div>'+escapeHtml(a.id)+'</div>'+
                '<div>姓名</div><div>'+escapeHtml((a.nameZh+" "+a.nameEn).trim())+'</div>'+
                '<div>身份</div><div>'+escapeHtml(a.status)+'</div>'+
              '</div>'+
              '<div class="miniBtnRow" style="margin-top:12px;">'+
                '<button id="btnYes" class="primary">✅ 是我 / Yes</button>'+
                '<button id="btnNo" class="danger">🔁 重新掃描 / Rescan</button>'+
              '</div>'
            );
            modal.querySelector('#btnYes').onclick = function(){
              closeModal(modal);
              App.authApprover = a;
              render();
            };
            modal.querySelector('#btnNo').onclick = function(){
              closeModal(modal);
              render();
            };
          }).catch(function(){
            showErr('authMsg', { code:'E500', zh:'系統錯誤', en:'Error' });
          });
        }, 'authMsg');

        return;
      }

      if(step === 2){
        $('btnAuthBack1').onclick = function(){ App.authApprover=null; render(); };
        $('btnAuthRestart2').onclick = function(){ render(); };

        camBindSwitchButton_('btnSwitchCamAuth2', function(){
          render();
        });

        startScan('videoAuth2', function(payload){
          callApi('api_auth_validate_target', App.token, payload).then(function(res){
            if(!res || !res.ok){ showErr('authMsg', res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }
            App.authTarget = res.target;
            render();
          }).catch(function(){
            showErr('authMsg', { code:'E500', zh:'系統錯誤', en:'Error' });
          });
        }, 'authMsg');

        return;
      }

      if(step === 3){
        $('btnAuthBack2').onclick = function(){ App.authTarget=null; App.authRole=null; render(); };
        $('btnRoleTemp').onclick = function(){ App.authRole='TEMP'; render(); };
        $('btnRoleHelper').onclick = function(){ App.authRole='HELPER'; render(); };
        return;
      }

      if(step === 4){
        $('btnAuthBack3').onclick = function(){ App.authRole=null; render(); };

        $('btnAuthCommit').onclick = function(){
          clear('authMsg');
          callApi('api_auth_commit', App.token, App.authApprover.id, App.authTarget.id, App.authRole).then(function(res){
            if(!res || !res.ok){ showErr('authMsg', res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }
            showBox('authMsg','ok','✅ 已完成授權','✅ Authorised',
              '<div class="kv">'+
                '<div>Target</div><div>'+escapeHtml(res.target.id)+'</div>'+
                '<div>New status</div><div>'+escapeHtml(res.target.newStatus)+'</div>'+
                '<div>Expiry</div><div>'+escapeHtml(res.target.roleExpiresIso || res.target.roleExpires || '')+'</div>'+
              '</div>'
            );
          }).catch(function(){
            showErr('authMsg', { code:'E500', zh:'系統錯誤', en:'Error' });
          });
        };
        return;
      }
    }

    /******** Member detail modal + delete flow ********/
    function openMemberDetailModal(memberId){
      var modal = openModal(
        '<div class="big">載入中… / Loading…</div>'+
        '<div class="small">請稍候 / Please wait</div>'
      );

      callApi('api_live_get_member_detail', App.token, memberId, null).then(function(res){
        if(!res || !res.ok){
          closeModal(modal);
          showErr('rtBox', res || {code:'E500', zh:'系統錯誤', en:'Error'});
          return;
        }

        var m = res.member || {};
        var today = res.today;
        var last4 = res.last4EventKeys || [];
        var plates = [m.vrm, m.vrm2].filter(Boolean).join(' / ');
        var todayHtml = today
          ? ('<div class="msgBox ok" style="margin-top:10px;">'+
              '<div class="big ok">今日簽到 / Today</div>'+
              '<div class="kv">'+
                '<div>Event</div><div>'+escapeHtml(today.eventKey)+'</div>'+
                '<div>Time</div><div>'+escapeHtml(today.timeUk)+'</div>'+
                '<div>Method</div><div>'+escapeHtml(today.method||'')+'</div>'+
                '<div>Handled by</div><div>'+escapeHtml(((today.handledBy.nameZh||'')+' '+(today.handledBy.nameEn||'')).trim() || today.handledBy.id||'')+'</div>'+
                '<div>Receipt</div><div>'+escapeHtml(today.receiptId||'')+'</div>'+
              '</div>'+
            '</div>')
          : ('<div class="msgBox warn" style="margin-top:10px;">'+
              '<div class="big warn">今日未見簽到 / Not checked-in today</div>'+
            '</div>');

        var last4Html = last4.length
          ? ('<div class="msgBox warn" style="margin-top:10px;">'+
              '<div class="big warn">最近 4 次活動 / Last 4 events</div>'+
              '<div class="small" style="margin-top:6px;">'+escapeHtml(last4.join(' · '))+'</div>'+
            '</div>')
          : ('<div class="small" style="margin-top:10px;">未有過往記錄 / No history</div>');

        var canDelete = canTapLiveNames() || (App.staff && App.staff.id === 'SUPERUSER');

        modal.querySelector('.modal').innerHTML =
          '<div class="big">👤 會員資料 / Member</div>'+
          '<div class="kv">'+
            '<div>CCF ID</div><div>'+escapeHtml(m.id||'')+'</div>'+
            '<div>中文名</div><div>'+escapeHtml(m.nameZh||'')+'</div>'+
            '<div>English</div><div>'+escapeHtml(m.nameEn||'')+'</div>'+
            '<div>VRM</div><div>'+escapeHtml(plates||'')+'</div>'+
            '<div>Status</div><div>'+escapeHtml(m.status||'')+'</div>'+
          '</div>'+
          todayHtml+
          last4Html+
          '<div class="miniBtnRow" style="margin-top:12px;">'+
            '<button id="btnClose" class="alt">⬅️ 返回 / Back</button>'+
            (canDelete ? '<button id="btnDelete" class="danger">💣 刪除今日簽到 / Delete today</button>' : '')+
          '</div>'+
          '<div id="detailMsg"></div>';

        modal.querySelector('#btnClose').onclick = function(){ closeModal(modal); };

        if(canDelete){
          modal.querySelector('#btnDelete').onclick = function(){
            if(!today){
              showBox('detailMsg','warn','今日無記錄','No record today');
              return;
            }
            openDeleteFlow(memberId, modal);
          };
        }
      }).catch(function(){
        closeModal(modal);
        showErr('rtBox', {code:'E500', zh:'系統錯誤', en:'Error'});
      });
    }

    function openDeleteFlow(memberId, parentModal){
      var isSuper = App.staff && App.staff.id === 'SUPERUSER';

      var modal = openModal(
        '<div class="big err">💣 確認刪除？ / Confirm delete?</div>'+
        '<div class="small">此操作會刪除今日出席記錄，並會被記錄。<br/>This deletes today’s attendance and will be logged.</div>'+
        '<div class="miniBtnRow" style="margin-top:12px;">'+
          '<button id="btnGo" class="danger">✅ 继续 / Continue</button>'+
          '<button id="btnCancel" class="alt">取消 / Cancel</button>'+
        '</div>'
      );
      modal.querySelector('#btnCancel').onclick = function(){ closeModal(modal); };
      modal.querySelector('#btnGo').onclick = function(){
        closeModal(modal);
        openReauthScan(memberId, parentModal, isSuper);
      };
    }

    function openReauthScan(memberId, parentModal, isSuper){
      var title = isSuper
        ? '請掃描管理員（ADMIN）QR 以作記錄 / Scan ADMIN QR for audit'
        : '請掃描你本人同工 QR 以確認 / Scan your own staff QR to confirm';

      var msgTarget = 'reauthMsg_' + Date.now().toString(36);

      var modal = openModal(
        '<div class="big">'+escapeHtml(title)+'</div>'+
        '<div class="videoWrap" style="margin-top:10px;"><video id="videoReauth" playsinline></video></div>'+
        '<div class="miniBtnRow">'+
          '<button id="btnSwitchCamReauth" class="alt">🔄 切換相機 / Switch camera</button>'+
          '<button id="btnCancelReauth" class="danger">取消 / Cancel</button>'+
        '</div>'+
        '<div id="'+msgTarget+'"></div>'
      );

      modal.querySelector('#btnCancelReauth').onclick = function(){
        stopScan();
        closeModal(modal);
      };

      camBindSwitchButton_('btnSwitchCamReauth', function(){
        stopScan();
        // restart scan in-place
        startScan('videoReauth', onCapturedReauth, msgTarget);
      });

      function onCapturedReauth(payload){
        stopScan();
        showBox(msgTarget,'warn','處理中…','Working…');

        var reauthPayload = isSuper ? '' : payload;
        var adminPayload = isSuper ? payload : '';

        callApi('api_live_delete_today_checkin', App.token, memberId, reauthPayload, adminPayload).then(function(res){
          if(!res || !res.ok){
            showErr(msgTarget, res || {code:'E500', zh:'系統錯誤', en:'Error'});
            return;
          }

          var email = res.email || {};
          var emailLine = '';
          if(email.status === 'SENT'){
            emailLine = '<div class="small">📧 Email sent to: '+escapeHtml(email.toMasked||'')+'</div>';
          } else if(email.status === 'OPTOUT'){
            emailLine = '<div class="small">📧 Member opted out</div>';
          } else if(email.status === 'NO_EMAIL'){
            emailLine = '<div class="small">📧 No email on file</div>';
          } else if(email.status){
            emailLine = '<div class="small">📧 Email status: '+escapeHtml(email.status)+'</div>';
          }

          showBox(msgTarget,'ok','✅ 已刪除','✅ Deleted',
            '<div class="kv">'+
              '<div>Event</div><div>'+escapeHtml(res.deleted.eventKey)+'</div>'+
              '<div>Member</div><div>'+escapeHtml(res.deleted.memberId)+'</div>'+
              '<div>By</div><div>'+escapeHtml(res.deleted.by)+'</div>'+
            '</div>'+emailLine
          );

          try{ closeModal(parentModal); }catch(e){}
          try{ if(App.view==='realtime') { App.liveNamesOpen=false; App.liveData=null; } }catch(e){}

          var btnRow = document.createElement('div');
          btnRow.className = 'miniBtnRow';
          btnRow.style.marginTop = '12px';
          btnRow.innerHTML = '<button id="btnCloseAfter" class="alt">⬅️ 返回 / Back</button>';
          modal.querySelector('.modal').appendChild(btnRow);
          modal.querySelector('#btnCloseAfter').onclick = function(){ closeModal(modal); App.view='realtime'; render(); };
        }).catch(function(){
          showErr(msgTarget, {code:'E500', zh:'系統錯誤', en:'Error'});
        });
      }

      startScan('videoReauth', onCapturedReauth, msgTarget);
    }

    render();
  </script>
