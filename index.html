<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CCF Live Service Portal</title>

  <!-- ============================================================
   * FILE: index.html (Live Service Portal UI)
   * UI VERSION: staff8-ui1 (restored full functions + self-check)
   * For Code.gs: v2026-02-02.staff8
   *
   * IMPORTANT: No "Under18" variables anywhere.
   * Uses only:
   *   - member.isMinor
   *   - live item n.isMinor
   * ============================================================ -->

  <style>
    :root{
      --bg:#f5f7ff; --card:#ffffff; --text:#0d1b3d; --muted:#5a6b90;
      --border:rgba(10,30,80,0.12); --good:#1aa86c; --bad:#d93c5e; --warn:#c88400;
      --shadow: 0 10px 24px rgba(10,30,80,0.10);

      --pad: clamp(10px, 3.2vw, 18px);
      --radius: clamp(14px, 3.2vw, 18px);
      --fs-title: clamp(20px, 5.2vw, 28px);
      --fs-big: clamp(18px, 4.8vw, 24px);
      --fs-body: clamp(14px, 3.8vw, 18px);
      --fs-input: clamp(16px, 4.2vw, 20px);
      --fs-small: clamp(12px, 3.2vw, 15px);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:0 auto;padding:var(--pad)}
    .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:8px 2px 8px}
    .title{font-size:var(--fs-title);font-weight:900}
    .sub{font-size:var(--fs-body);color:var(--muted);margin-top:2px}
    .hint{font-size:var(--fs-body);color:var(--muted);margin-top:8px;line-height:1.45}
    .pill{font-size:var(--fs-small);color:var(--muted);border:1px solid var(--border);padding:4px 10px;border-radius:999px;background:#fff}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:calc(var(--pad) + 2px);margin:10px 0;box-shadow:var(--shadow)}
    .big{font-size:var(--fs-big);font-weight:950;letter-spacing:0.2px;line-height:1.25}
    .small{font-size:var(--fs-body);color:var(--muted);margin-top:6px;line-height:1.45}
    .label{font-size:var(--fs-body);color:var(--muted);margin-bottom:6px}

    input,button{
      width:100%;
      border-radius:var(--radius);
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      padding:calc(var(--pad) + 2px);
      font-size:var(--fs-input)
    }
    button{cursor:pointer;font-weight:900;box-shadow:0 6px 14px rgba(10,30,80,0.06)}
    button.primary{background:#e9fff4;border-color:rgba(26,168,108,0.25)}
    button.alt{background:#eef4ff;border-color:rgba(40,90,200,0.18)}
    button.danger{background:#ffeef2;border-color:rgba(217,60,94,0.25)}
    button.blue{ background:#eef4ff; border-color:rgba(40,90,200,0.18); }
    button.orange{ background:#fff6e6; border-color:rgba(200,132,0,0.35); }

    .menuGrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    .menuGrid button{ min-height: 62px; }

    .miniBtnRow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
    .miniBtnRow button{flex:1 1 180px}

    .divider{height:1px;background:var(--border);margin:12px 0}
    .msgBox{border-radius:var(--radius);padding:12px;border:1px solid var(--border);margin-top:10px}
    .msgBox.ok{border-color:rgba(26,168,108,0.35);background:#edfff6}
    .msgBox.err{border-color:rgba(217,60,94,0.35);background:#fff1f4}
    .msgBox.warn{border-color:rgba(200,132,0,0.35);background:#fff6e6}
    .ok{color:var(--good)} .err{color:var(--bad)} .warn{color:var(--warn)}
    .hide{display:none!important}

    .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;margin-top:10px}
    .kv div:nth-child(odd){color:var(--muted)}
    .msgEn{margin-top:4px;font-size:var(--fs-body);}

    .videoWrap{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#f7f9ff}
    video{width:100%;display:block}

    .footer{margin-top:14px;padding:6px 4px;font-size:var(--fs-small);color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.45);
      z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;
    }
    .modal{
      width:min(720px, 100%);
      background:#fff;border-radius:18px;border:1px solid var(--border);
      box-shadow:0 24px 60px rgba(0,0,0,0.25);
      padding:14px;max-height:85vh;overflow:auto;
    }

    .listWrap{max-height:55vh;overflow:auto;border:1px solid var(--border);border-radius:14px;padding:10px;background:#fff}
    .nameItem{
      padding:10px;border:1px solid var(--border);border-radius:12px;margin-top:8px;
      white-space:normal;overflow-wrap:anywhere;word-break:break-word;
    }
    .nameItem.tap{cursor:pointer}
    .nameItem .zh{font-weight:950;}
    .nameItem .en{color:var(--muted);font-size:var(--fs-body);margin-top:4px;font-weight:700;}

    .chipRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{font-size:var(--fs-small);padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--muted)}
    .chip.good{border-color:rgba(26,168,108,0.35);background:#edfff6;color:var(--good)}
    .chip.bad{border-color:rgba(217,60,94,0.35);background:#fff1f4;color:var(--bad)}
    .chip.warn{border-color:rgba(200,132,0,0.35);background:#fff6e6;color:var(--warn)}

    @media (pointer: coarse){
      button{ min-height: 56px; }
    }
    @media (max-width: 420px){
      .kv{ grid-template-columns: 120px 1fr; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <div class="title">CCF Live Service Portal</div>
        <div class="sub">同工專用 / Staff only</div>
        <div class="hint">
          請啟用 Cookies、確保網絡連線良好，並允許裝置提示的所有權限。<br/>
          Please enable cookies, ensure good internet connection, and allow all permission prompts while using the portal.
        </div>
      </div>
      <div><span class="pill">v<?= APP_VERSION ?> · ui staff8-ui1</span></div>
    </header>

    <main id="app"></main>

    <footer class="footer">
      <div>© Cantonese Christian Fellowship</div>
      <div>如問題持續，請聯絡影音同工 / Contact Media team if issue persists</div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    var App = {
      token:null, staff:null,
      view:'login',
      stream:null, raf:null, scanning:false, detector:null,
      debounceT:null, intervalId:null, clockTimer:null,
      liveNamesOpen:false,
      liveData:null,
      liveNamesFilter:'',
      stable:{ value:null, count:0, firstTs:0 },

      // Auth flow
      authApprover:null,
      authTarget:null,
      authRole:null,
      authFlash:null,

      // Manual UI state
      manualLastQuery:'',
      manualSelectedId:null,
      manualLocked:false
    };

    var STABLE_REQUIRED_COUNT = 2;
    var STABLE_REQUIRED_MS = 250;

    function $(id){ return document.getElementById(id); }

    function callApi(fn){
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject){
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fn].apply(runner, args);
      });
    }

    function escapeHtml(s){
      s = String(s || '');
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showBox(targetId, kind, titleZh, titleEn, detailHtml){
      detailHtml = detailHtml || '';
      var el = $(targetId); if(!el) return;
      el.innerHTML =
        '<div class="msgBox '+kind+'">' +
          '<div class="big '+(kind==='ok'?'ok':(kind==='err'?'err':'warn'))+'">'+titleZh+'</div>' +
          '<div class="msgEn">'+titleEn+'</div>' +
          (detailHtml ? ('<div style="margin-top:10px;">'+detailHtml+'</div>') : '') +
        '</div>';
    }

    function showErr(targetId, res){
      var code = res && res.code ? (' <span class="pill">'+escapeHtml(res.code)+'</span>') : '';
      var detail = res && res.detail ? ('<div class="small">'+escapeHtml(res.detail)+'</div>') : '';
      showBox(
        targetId,
        'err',
        escapeHtml((res && res.zh) || '發生錯誤') + code,
        escapeHtml((res && res.en) || 'Error'),
        detail
      );
    }

    function openModal(html){
      var o = document.createElement('div');
      o.className = 'overlay';
      o.innerHTML = '<div class="modal">'+html+'</div>';
      document.body.appendChild(o);
      return o;
    }
    function closeModal(o){ try{ document.body.removeChild(o); }catch(e){} }
    function clear(targetId){ var el=$(targetId); if(el) el.innerHTML=''; }

    function kvHtml(pairs){
      var rows = (pairs||[]).filter(function(x){ return x && String(x.v||'').trim() !== ''; });
      if(!rows.length) return '';
      return '<div class="kv">' + rows.map(function(x){
        return '<div>'+escapeHtml(x.k)+'</div><div>'+escapeHtml(x.v)+'</div>';
      }).join('') + '</div>';
    }

    function staffDisplayName(){
      if(!App.staff) return '';
      if(App.staff.id === 'SUPERUSER') return 'SUPERUSER';
      var zh = App.staff.nameZh || '';
      var en = App.staff.nameEn || '';
      return (zh + ' ' + en).trim() || App.staff.id;
    }

    function canTapLiveNames(){
      if(!App.staff) return false;
      if(App.staff.id === 'SUPERUSER') return true;
      var st = String(App.staff.status||'').toUpperCase();
      return (st === 'STAFF' || st === 'ADMIN');
    }

    function canUseAuth(){
      if(!App.staff) return false;
      if(App.staff.id === 'SUPERUSER') return true;
      var st = String(App.staff.status||'').toUpperCase();
      return (st === 'STAFF' || st === 'ADMIN');
    }

    function getDeviceId(){
      try{
        var id = localStorage.getItem('ccf_deviceId');
        if(!id){
          id = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
          localStorage.setItem('ccf_deviceId', id);
        }
        return id;
      }catch(e){
        return 'D' + Date.now().toString(36);
      }
    }
    function getUA(){ try{ return navigator.userAgent || ''; }catch(e){ return ''; } }

    function hiPref(p){
      var s = String(p||'').trim();
      if(!s) return '';
      return '<span style="background:#fff3c4;padding:2px 8px;border-radius:10px;border:1px solid rgba(200,132,0,0.28);">'+escapeHtml(s)+'</span>';
    }

    function isMinorNoticeHtml(isMinor){
      if(!isMinor) return '';
      return ''+
        '<div class="msgBox warn" style="margin-top:10px;">'+
          '<div class="big warn">⚠️ 未滿 18 歲提示</div>'+
          '<div class="msgEn">⚠️ Minor (under 18) notice</div>'+
          '<div class="small" style="margin-top:8px;">'+
            '請留意同行安排及監護需要。<br/>'+
            '如屬未滿 16 歲，請按教會/同工指引採取相應行動（例如確保監護人同在、必要時通知負責同工）。'+
            '<div class="divider"></div>'+
            'Please be mindful of supervision/guardian arrangements.<br/>'+
            'If they are under 16, take appropriate actions per safeguarding guidance (e.g., ensure a guardian is present; escalate if needed).'+
          '</div>'+
        '</div>';
    }

    function emailUiFromStatus(status){
      status = String(status||'').trim().toUpperCase();
      if(status === 'SENT') return { zh:'📧 已發送電郵簽到證明。', en:'📧 Email proof sent.' };
      if(status === 'OPTOUT') return { zh:'📧 已選擇不接收電郵。', en:'📧 Opted out of email.' };
      if(status === 'NO_EMAIL') return { zh:'📧 未有電郵資料。', en:'📧 No email on file.' };
      if(status === 'QUOTA') return { zh:'📧 今日電郵額度已用完。', en:'📧 Daily quota exceeded.' };
      if(status === 'ERROR') return { zh:'📧 電郵發送失敗。', en:'📧 Failed to send email.' };
      if(!status) return { zh:'📧 未有電郵狀態。', en:'📧 No email status.' };
      return { zh:'📧 電郵狀態：' + status, en:'📧 Email status: ' + status };
    }

    function newFriendWelcomeHtml(member){
      if(!member || !member.isNewFriend) return '';
      var pref = (member.preferredName||'').trim();
      var extra = pref ? ('<div class="small" style="margin-top:8px;">Preferred / 常用稱呼：'+hiPref(pref)+'</div>') : '';
      return ''+
        '<div class="msgBox warn" style="margin-top:10px;">'+
          '<div class="big warn">🆕 新朋友 / New friend</div>'+
          '<div class="msgEn">🎉 歡迎第一次到訪 / Welcome</div>'+
          '<div class="small" style="margin-top:8px;">'+
            '歡迎你！如需要加入社群或有任何問題，請聯絡接待/影音同工。<br/>'+
            'Welcome! If you need help or want to join the community, please speak to the Welcome/Media team.'+
          '</div>'+
          extra+
        '</div>';
    }

    function fmtIsoToUkYmdHm(iso){
      if(!iso) return '';
      var d = new Date(iso);
      if(isNaN(d.getTime())) return String(iso);
      try{
        var parts = new Intl.DateTimeFormat('en-GB', {
          timeZone:'Europe/London',
          year:'numeric', month:'2-digit', day:'2-digit',
          hour:'2-digit', minute:'2-digit',
          hour12:false
        }).formatToParts(d);
        var m = {};
        parts.forEach(function(p){ m[p.type]=p.value; });
        return (m.year||'') + '/' + (m.month||'') + '/' + (m.day||'') + ' ' + (m.hour||'') + ':' + (m.minute||'');
      }catch(e){
        var yy = d.getFullYear();
        var mm = ('0'+(d.getMonth()+1)).slice(-2);
        var dd = ('0'+d.getDate()).slice(-2);
        var hh = ('0'+d.getHours()).slice(-2);
        var mi = ('0'+d.getMinutes()).slice(-2);
        return yy + '/' + mm + '/' + dd + ' ' + hh + ':' + mi;
      }
    }

    // Camera switch + scan
    function camGetSelectedId_(){ try{ return localStorage.getItem('ccf_cam_deviceId') || ''; }catch(e){ return ''; } }
    function camSetSelectedId_(id){
      try{ if(id) localStorage.setItem('ccf_cam_deviceId', id); else localStorage.removeItem('ccf_cam_deviceId'); }catch(e){}
    }
    function camListVideoInputs_(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve([]);
      return navigator.mediaDevices.enumerateDevices().then(function(devs){
        var cams = (devs||[]).filter(function(d){ return d && d.kind === 'videoinput'; });
        cams.sort(function(a,b){ return String(a.deviceId||'').localeCompare(String(b.deviceId||'')); });
        return cams;
      }).catch(function(){ return []; });
    }
    function camBindSwitchButton_(btnId, restartFn){
      var btn = $(btnId);
      if(!btn) return;
      camListVideoInputs_().then(function(cams){
        if(!cams || cams.length < 2){ btn.classList.add('hide'); return; }
        btn.classList.remove('hide');
        btn.onclick = function(){
          camListVideoInputs_().then(function(cams2){
            if(!cams2 || cams2.length < 2) return;
            var cur = camGetSelectedId_();
            var idx = cams2.findIndex(function(x){ return x.deviceId === cur; });
            var next = cams2[(idx >= 0 ? idx+1 : 0) % cams2.length];
            camSetSelectedId_(next.deviceId || '');
            if(typeof restartFn === 'function') restartFn();
          });
        };
      });
    }
    function camBuildPreferredConstraints_(){
      var sel = camGetSelectedId_();
      if(sel) return { video: { deviceId: { exact: sel } }, audio:false };
      return { video: { facingMode: { ideal:'environment' } }, audio:false };
    }

    function resetStability(){
      App.stable.value = null;
      App.stable.count = 0;
      App.stable.firstTs = 0;
    }
    function acceptWhenStable(candidate){
      var now = Date.now();
      if(!candidate){ resetStability(); return null; }
      if(App.stable.value === candidate){ App.stable.count += 1; }
      else { App.stable.value = candidate; App.stable.count = 1; App.stable.firstTs = now; }
      var elapsed = now - (App.stable.firstTs || now);
      if(App.stable.count >= STABLE_REQUIRED_COUNT && elapsed >= STABLE_REQUIRED_MS){
        var v = App.stable.value; resetStability(); return v;
      }
      return null;
    }

    function stopScan(){
      App.scanning=false;
      if(App.raf) cancelAnimationFrame(App.raf);
      App.raf=null;
      if(App.stream){
        App.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
        App.stream=null;
      }
      resetStability();
    }

    function startScan(videoId, onCaptured, msgTarget){
      stopScan();
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        showErr(msgTarget, { code:'E420', zh:'此裝置不支援相機', en:'Camera not supported' });
        return;
      }

      var constraintsPreferred = camBuildPreferredConstraints_();
      var constraintsFacingFallback = { video: { facingMode: { ideal:'environment' } }, audio:false };
      var constraintsFallback  = { video: true, audio:false };

      function tryStart(constraints, allowFallback){
        navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
          App.stream = stream;
          var v = $(videoId);
          v.srcObject = stream;
          return v.play().then(function(){
            App.scanning=true;
            scanLoop(v, onCaptured, msgTarget);
          });
        }).catch(function(err){
          var sel = camGetSelectedId_();
          var usingExact = !!(sel && constraints && constraints.video && constraints.video.deviceId && constraints.video.deviceId.exact);
          if(usingExact){
            camSetSelectedId_('');
            tryStart(constraintsFacingFallback, true);
            return;
          }
          if(allowFallback){
            tryStart(constraintsFallback, false);
            return;
          }
          stopScan();
          showErr(msgTarget, { code:'E420', zh:'相機無法啟動', en:'Camera cannot start', detail: err && err.name ? err.name : '' });
        });
      }
      tryStart(constraintsPreferred, true);
    }

    function scanLoop(video, onCaptured, msgTarget){
      if(!App.scanning) return;

      if(!video || video.readyState < 2){
        App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
        return;
      }

      try{
        if('BarcodeDetector' in window){
          App.detector = App.detector || new BarcodeDetector({ formats:['qr_code'] });
          App.detector.detect(video).then(function(codes){
            var candidate = (codes && codes.length && codes[0].rawValue) ? codes[0].rawValue : null;
            var stable = acceptWhenStable(candidate);
            if(stable){ stopScan(); onCaptured(stable); return; }
            App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
          }).catch(function(){
            App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
          });
          return;
        }
      }catch(e){}

      var text = null;
      try{
        if(window.jsQR){
          var canvas = App._canvas || (App._canvas=document.createElement('canvas'));
          var ctx = App._ctx || (App._ctx=canvas.getContext('2d',{ willReadFrequently:true }));
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          var img = ctx.getImageData(0,0,canvas.width,canvas.height);
          var qr = window.jsQR(img.data, canvas.width, canvas.height);
          if(qr && qr.data) text = qr.data;
        }
      }catch(e){}

      var stable2 = acceptWhenStable(text);
      if(stable2){ stopScan(); onCaptured(stable2); return; }
      App.raf = requestAnimationFrame(function(){ scanLoop(video,onCaptured,msgTarget); });
    }

    function restoreSession(){
      var token = null;
      try { token = sessionStorage.getItem('ccf_token'); } catch(e){}
      if(!token) return;

      callApi('api_ping', token).then(function(res){
        if(res && res.ok){
          App.token = token;
          App.staff = res.staff;
          App.view = 'menu';
          render();
        } else {
          try { sessionStorage.removeItem('ccf_token'); } catch(e){}
        }
      }).catch(function(){
        try { sessionStorage.removeItem('ccf_token'); } catch(e){}
      });
    }

    function startClock(){
      var el = $('liveClock');
      if(!el) return;
      function tick(){
        try{
          var fmt = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/London', hour:'2-digit', minute:'2-digit', second:'2-digit' });
          el.textContent = fmt.format(new Date());
        }catch(e){
          var d = new Date();
          el.textContent = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
        }
      }
      tick();
      App.clockTimer = setInterval(tick, 1000);
    }

    function logout(){
      stopScan();
      if(App.intervalId){ clearInterval(App.intervalId); App.intervalId=null; }
      if(App.clockTimer){ clearInterval(App.clockTimer); App.clockTimer=null; }
      try { callApi('api_logout', App.token); } catch(e){}
      try { sessionStorage.removeItem('ccf_token'); } catch(e){}
      App.token=null; App.staff=null;
      App.view='login';
      render();
    }

    function render(){
      stopScan();
      if(App.intervalId){ clearInterval(App.intervalId); App.intervalId=null; }
      if(App.clockTimer){ clearInterval(App.clockTimer); App.clockTimer=null; }
      clearTimeout(App.debounceT);

      if(App.view !== 'auth'){
        App.authApprover=null;
        App.authTarget=null;
        App.authRole=null;
        App.authFlash=null;
      }

      var root = $('app');
      if(App.view==='login'){ root.innerHTML = viewLogin(); bindLogin(); restoreSession(); return; }
      if(App.view==='menu'){ root.innerHTML = viewMenu(); bindMenu(); return; }
      if(App.view==='checkinMenu'){ root.innerHTML = viewCheckinMenu(); bindCheckinMenu(); return; }

    // ===== Self-check modal (discrete functions) =====
    function openSelfCheckModal(){
      var o = openModal(
        '<div class="big">🩺 自我檢查 / Self-check</div>'+
        '<div class="small">此功能只檢查後端（Google Apps Script + Sheet）是否正常。<br/>This checks backend (Apps Script + Sheets). It cannot detect broken UI buttons.</div>'+
        '<div id="scBox" class="card" style="margin-top:10px;"></div>'+
        '<div class="miniBtnRow">'+
          '<button id="btnScRun" class="primary">▶️ 開始檢查 / Run checks</button>'+
          '<button id="btnScWrite" class="orange">✍️ 寫入測試 / Write test</button>'+
          '<button id="btnScConfirm" class="orange">✅ 同工確認 / Staff confirm</button>'+
          '<button id="btnScClose" class="danger">關閉 / Close</button>'+
        '</div>'
      );

      function setBusy(msg){
        var b = o.querySelector('#scBox');
        b.innerHTML = '<div class="small">'+escapeHtml(msg||'Loading...')+'</div>';
      }

      function renderChecks(res){
        var b = o.querySelector('#scBox');
        if(!res || !res.ok){
          b.innerHTML = '';
          showErrInto(b, res || {code:'E500', zh:'檢查失敗', en:'Self-check failed'});
          return;
        }
        var checks = res.checks || [];
        var chips = checks.map(function(c){
          return '<span class="chip '+(c.ok?'good':'bad')+'">'+(c.ok?'✅ ':'❌ ')+escapeHtml(c.zh)+'</span>';
        }).join('');
        var detail = checks.map(function(c){
          return '<div class="nameItem">'+
                   '<div class="zh">'+(c.ok?'✅ ':'❌ ')+escapeHtml(c.zh)+'</div>'+
                   '<div class="en">'+escapeHtml(c.en)+'</div>'+
                   (c.detail ? '<div class="small" style="margin-top:6px;">'+escapeHtml(c.detail)+'</div>' : '')+
                 '</div>';
        }).join('');
        b.innerHTML =
          '<div class="small">Event: <span class="pill">'+escapeHtml(res.eventKey||'')+'</span> · '+escapeHtml(fmtIsoToUkYmdHm(res.timeIso||''))+'</div>'+
          '<div class="chipRow">'+chips+'</div>'+
          '<div class="divider"></div>'+
          '<div class="listWrap">'+detail+'</div>';
      }

      function showErrInto(containerEl, res){
        var code = res && res.code ? (' <span class="pill">'+escapeHtml(res.code)+'</span>') : '';
        var detail = res && res.detail ? ('<div class="small">'+escapeHtml(res.detail)+'</div>') : '';
        containerEl.innerHTML =
          '<div class="msgBox err">'+
            '<div class="big err">'+escapeHtml((res && res.zh) || '發生錯誤')+code+'</div>'+
            '<div class="msgEn">'+escapeHtml((res && res.en) || 'Error')+'</div>'+
            (detail ? ('<div style="margin-top:10px;">'+detail+'</div>') : '')+
          '</div>';
      }

      o.querySelector('#btnScClose').onclick = function(){ closeModal(o); };

      o.querySelector('#btnScRun').onclick = function(){
        setBusy('更新中… / Running…');
        callApi('api_selfcheck_readonly', App.token).then(renderChecks).catch(function(){
          var b = o.querySelector('#scBox');
          showErrInto(b, {code:'E500', zh:'系統錯誤', en:'System error'});
        });
      };

      o.querySelector('#btnScWrite').onclick = function(){
        setBusy('寫入測試中… / Write testing…');
        callApi('api_selfcheck_write_test', App.token, getDeviceId(), getUA()).then(function(res){
          var b = o.querySelector('#scBox');
          if(res && res.ok){
            b.innerHTML =
              '<div class="msgBox ok">'+
                '<div class="big ok">'+escapeHtml(res.zh||'完成')+'</div>'+
                '<div class="msgEn">'+escapeHtml(res.en||'Done')+'</div>'+
                '<div class="small" style="margin-top:8px;">Event: '+escapeHtml(res.eventKey||'')+'</div>'+
              '</div>';
          } else {
            showErrInto(b, res || {code:'E500', zh:'寫入測試失敗', en:'Write test failed'});
          }
        }).catch(function(){
          var b = o.querySelector('#scBox');
          showErrInto(b, {code:'E500', zh:'系統錯誤', en:'System error'});
        });
      };

      o.querySelector('#btnScConfirm').onclick = function(){
        setBusy('記錄中… / Logging…');
        callApi('api_selfcheck_mark_completed', App.token, getDeviceId(), getUA()).then(function(res){
          var b = o.querySelector('#scBox');
          if(res && res.ok){
            b.innerHTML =
              '<div class="msgBox ok">'+
                '<div class="big ok">'+escapeHtml(res.zh||'完成')+'</div>'+
                '<div class="msgEn">'+escapeHtml(res.en||'Done')+'</div>'+
                '<div class="small" style="margin-top:8px;">Event: '+escapeHtml(res.eventKey||'')+'</div>'+
              '</div>';
          } else {
            showErrInto(b, res || {code:'E500', zh:'記錄失敗', en:'Log failed'});
          }
        }).catch(function(){
          var b = o.querySelector('#scBox');
          showErrInto(b, {code:'E500', zh:'系統錯誤', en:'System error'});
        });
      };

      // Auto-run once
      o.querySelector('#btnScRun').click();
    }

    function bindLogin(){
      $('btnStartLoginScan').onclick = function(){
        clear('msg');
        $('loginCam').classList.remove('hide');

        $('btnCancelLoginScan').onclick = function(){
          stopScan();
          $('loginCam').classList.add('hide');
        };

        camBindSwitchButton_('btnSwitchCamLogin', function(){
          clear('msg');
          startScan('videoLogin', onCapturedLogin, 'msg');
        });

        function onCapturedLogin(text){
          $('loginCam').classList.add('hide');
          callApi('api_login', text).then(function(res){
            if(!res || !res.ok){ showErr('msg', res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }
            App.token = res.token;
            App.staff = res.staff;
            try{ sessionStorage.setItem('ccf_token', App.token); }catch(e){}
            App.view='menu';
            render();
          }).catch(function(){
            showErr('msg', { code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.' });
          });
        }

        startScan('videoLogin', onCapturedLogin, 'msg');
      };

        clear('msg');

          App.token = res.token;
          App.staff = res.staff;
          try{ sessionStorage.setItem('ccf_token', App.token); }catch(e){}
          App.view='menu';
          render();
        }).catch(function(){

    function bindScanCheckin(){
      clear('scanMsg');

      function renderCheckinResult(res){
        var box = $('scanMsg');
        if(!res || !res.ok){ box.innerHTML=''; showErr('scanMsg', res || {code:'E500', zh:'系統錯誤', en:'Error'}); return; }

        var m = res.member || {};
        var nameLine = ((m.nameZh||'') + ' ' + (m.nameEn||'')).trim() || m.id || '';
        var pref = (m.preferredName||'').trim();
        var chips = '<div class="chipRow">'+
          '<span class="chip">'+escapeHtml(m.id||'')+'</span>'+
          '<span class="chip">'+escapeHtml(res.status||'')+'</span>'+
          (res.result==='OK' ? '<span class="chip good">✅ OK</span>' : '<span class="chip warn">⚠️ ALREADY</span>')+
          (pref ? '<span class="chip warn">⭐ '+escapeHtml(pref)+'</span>' : '')+
        '</div>';

        if(res.result === 'ALREADY'){
          var a = res.already || {};
          var emailUi = a.emailUi || emailUiFromStatus(a.emailStatus||'');
          box.innerHTML =
            '<div class="msgBox warn">'+
              '<div class="big warn">⚠️ 已簽到 / Already checked-in</div>'+
              '<div class="msgEn">'+escapeHtml(nameLine)+'</div>'+
              chips+
              kvHtml([
                {k:'時間 / Time', v:(a.timeUk||'')},
                {k:'方式 / Method', v:(a.method||'')},
                {k:'Receipt', v:(a.receiptId||'')},
                {k:'電郵 / Email', v:(emailUi.zh || '')}
              ])+
            '</div>' +
            isMinorNoticeHtml(!!m.isMinor);
          return;
        }

        var emailLine = (res.emailUi && (res.emailUi.zh || res.emailUi.en)) ? (res.emailUi.zh + ' ' + (res.emailToMasked ? ('('+res.emailToMasked+')') : '')) : '';
        box.innerHTML =
          '<div class="msgBox ok">'+
            '<div class="big ok">✅ 簽到成功 / Checked-in</div>'+
            '<div class="msgEn">'+escapeHtml(nameLine)+'</div>'+
            chips+
            kvHtml([
              {k:'時間 / Time', v:(res.timeUk||'')},
              {k:'Receipt', v:(res.receiptId||'')},
              {k:'電郵 / Email', v: emailLine }
            ])+
          '</div>' +
          newFriendWelcomeHtml(m) +
          isMinorNoticeHtml(!!m.isMinor);
      }

      function onCaptured(text){
        clear('scanMsg');
        $('scanMsg').innerHTML = '<div class="small">處理中… / Processing…</div>';
        callApi('api_checkin_scan', App.token, text, null, getDeviceId(), getUA()).then(renderCheckinResult).catch(function(){
          showErr('scanMsg', {code:'E500', zh:'系統錯誤，請聯絡影音同工', en:'System error. Please contact Media team.'});
        });

                openMemberDetailModal(mid);

        input.oninput = function(){
          App.liveNamesFilter = String(input.value || '');
          renderList();
        };

        renderList();
      }

    function bindAuth(){
      clear('authMsg');

      function setFlash(kind, zh, en, detailHtml){
        App.authFlash = { kind:kind, zh:zh, en:en, detailHtml:detailHtml||'' };
      }

      function clearFlash(){ App.authFlash = null; }

      function goMenu(){ stopScan(); App.view='menu'; render(); }
      function goBack(){ stopScan(); App.view='menu'; render(); }

      var step = !App.authApprover ? 1 : (!App.authTarget ? 2 : (!App.authRole ? 3 : 4));

      if(step===1){
        camBindSwitchButton_('btnSwitchCamAuth1', function(){
          startScan('videoAuth1', onApprover, 'authMsg');
        });

        $('btnAuthCancel').onclick = function(){ goBack(); };
        $('btnAuthBackMenu') && ($('btnAuthBackMenu').onclick = function(){ goMenu(); });
        $('btnAuthRescan1') && ($('btnAuthRescan1').onclick = function(){
          clear('authMsg'); clearFlash(); App.authApprover=null; App.authTarget=null; App.authRole=null;
          render();
        });

        function onApprover(text){
          clear('authMsg');
          $('authMsg').innerHTML = '<div class="small">驗證中… / Validating…</div>';
          callApi('api_auth_validate_approver', App.token, text).then(function(res){
            if(!res || !res.ok){
              setFlash('err', (res&&res.zh)||'驗證失敗', (res&&res.en)||'Validation failed', res && res.detail ? '<div class="small">'+escapeHtml(res.detail)+'</div>' : '');
              render();
              return;
            }
            App.authApprover = res.approver;
            clearFlash();
            App.view='auth';
            render();
          }).catch(function(){
            setFlash('err','系統錯誤','System error','');
            render();
          });
        }

        startScan('videoAuth1', onApprover, 'authMsg');
        return;
      }

      if(step===2){
        camBindSwitchButton_('btnSwitchCamAuth2', function(){
          startScan('videoAuth2', onTarget, 'authMsg');
        });

        $('btnAuthBack1').onclick = function(){
          App.authApprover=null; App.authTarget=null; App.authRole=null; clearFlash();
          render();
        };

        $('btnAuthBackMenu') && ($('btnAuthBackMenu').onclick = function(){ goMenu(); });
        $('btnAuthRescan2') && ($('btnAuthRescan2').onclick = function(){
          App.authTarget=null; App.authRole=null; clearFlash();
          render();
        });

        function onTarget(text){
          clear('authMsg');
          $('authMsg').innerHTML = '<div class="small">驗證中… / Validating…</div>';
          callApi('api_auth_validate_target', App.token, text).then(function(res){
            if(!res || !res.ok){
              setFlash('err', (res&&res.zh)||'驗證失敗', (res&&res.en)||'Validation failed', res && res.detail ? '<div class="small">'+escapeHtml(res.detail)+'</div>' : '');
              render();
              return;
            }
            App.authTarget = res.target;
            clearFlash();
            render();
          }).catch(function(){
            setFlash('err','系統錯誤','System error','');
            render();
          });
        }

        startScan('videoAuth2', onTarget, 'authMsg');
        return;
      }

      if(step===3){
        $('btnRoleTemp').onclick = function(){ App.authRole='TEMP'; clearFlash(); render(); };
        $('btnRoleHelper').onclick = function(){ App.authRole='HELPER'; clearFlash(); render(); };
        $('btnAuthRestartAll').onclick = function(){
          App.authApprover=null; App.authTarget=null; App.authRole=null; clearFlash();
          render();
        };
        return;
      }

      // step 4 commit
      $('btnAuthCommit').onclick = function(){
        clear('authMsg');
        $('authMsg').innerHTML = '<div class="small">更新中… / Updating…</div>';
        callApi('api_auth_commit', App.token, App.authApprover.id, App.authTarget.id, App.authRole).then(function(res){
          if(!res || !res.ok){
            showErr('authMsg', res || {code:'E500', zh:'更新失敗', en:'Update failed'});
            return;
          }
          var exp = res.target && res.target.roleExpires ? fmtIsoToUkYmdHm(res.target.roleExpires) : '';
          setFlash('ok','✅ 已完成授權','✅ Authorisation completed',
            '<div class="small">'+
              'Target: <b>'+escapeHtml(res.target.id||'')+'</b><br/>'+
              'New: <b>'+escapeHtml(res.target.newStatus||'')+'</b><br/>'+
              'Expiry: <b>'+escapeHtml(exp||'—')+'</b>'+
            '</div>'
          );
          // refresh target card with new status + expiry
          App.authTarget.status = res.target.newStatus;
          App.authTarget.roleExpires = res.target.roleExpires;
          render();
        }).catch(function(){
          showErr('authMsg', {code:'E500', zh:'系統錯誤', en:'System error'});
        });
      };

      $('btnAuthRestartAll').onclick = function(){
        App.authApprover=null; App.authTarget=null; App.authRole=null; clearFlash();
        render();
      };
    }

    // ===== Live member detail modal (read-only + quick actions entry points) =====
    function openMemberDetailModal(memberId){
      var o = openModal(
        '<div class="big">👤 詳情 / Detail</div>'+
        '<div id="mdBox" class="card" style="margin-top:10px;"></div>'+
        '<div class="miniBtnRow">'+
          '<button id="btnMdClose" class="danger">關閉 / Close</button>'+
        '</div>'
      );

      o.querySelector('#btnMdClose').onclick = function(){ closeModal(o); };

      function setHtml(html){ o.querySelector('#mdBox').innerHTML = html; }

      setHtml('<div class="small">載入中… / Loading…</div>');
      callApi('api_live_get_member_detail', App.token, memberId, null).then(function(res){
        if(!res || !res.ok){
          setHtml('');
          setHtml(
            '<div class="msgBox err">'+
              '<div class="big err">'+escapeHtml((res&&res.zh)||'發生錯誤')+'</div>'+
              '<div class="msgEn">'+escapeHtml((res&&res.en)||'Error')+'</div>'+
            '</div>'
          );
          return;
        }

        var m = res.member || {};
        var nameLine = ((m.nameZh||'')+' '+(m.nameEn||'')).trim() || m.id || '';
        var pref = (m.preferredName||'').trim();

        var today = res.today;
        var todayHtml = today
          ? '<div class="msgBox warn" style="margin-top:10px;">'+
              '<div class="big warn">今日簽到 / Today</div>'+
              kvHtml([
                {k:'時間 / Time', v: today.timeUk||''},
                {k:'方式 / Method', v: today.method||''},
                {k:'Receipt', v: today.receiptId||''},
                {k:'經手 / By', v: (today.handledBy ? ((today.handledBy.nameZh||'')+' '+(today.handledBy.nameEn||'')+' · '+(today.handledBy.id||'')).trim() : '')}
              ])+
            '</div>'
          : '<div class="msgBox warn" style="margin-top:10px;"><div class="big warn">今日未簽到 / Not today</div></div>';

        setHtml(
          '<div class="msgBox ok" style="margin-top:0;">'+
            '<div class="big ok">'+escapeHtml(nameLine)+'</div>'+
            '<div class="msgEn">'+escapeHtml(m.id||'')+'</div>'+
            '<div class="chipRow">'+
              '<span class="chip">'+escapeHtml(m.id||'')+'</span>'+
              '<span class="chip">'+escapeHtml(m.status||'')+'</span>'+
              (pref ? '<span class="chip warn">⭐ '+escapeHtml(pref)+'</span>' : '')+
              (m.isMinor ? '<span class="chip warn">🧒 Minor</span>' : '')+
            '</div>'+
            kvHtml([
              {k:'中文名', v: m.nameZh||''},
              {k:'English', v: m.nameEn||''},
              {k:'Preferred', v: pref||''},
              {k:'VRM', v: m.vrm||''},
              {k:'VRM2', v: m.vrm2||''}
            ])+
          '</div>'+
          todayHtml+
          isMinorNoticeHtml(!!m.isMinor)+
          '<div class="small" style="margin-top:10px;">提示：刪除/隱藏新朋友等操作仍可在舊流程內（如你已有）。此版本先保證顯示詳情不會失靈。</div>'
        );
      }).catch(function(){
        setHtml(
          '<div class="msgBox err">'+
            '<div class="big err">系統錯誤</div>'+
            '<div class="msgEn">System error</div>'+
          '</div>'
        );
      });
    }

    // Boot
    render();
  </script>
</body>
</html>
