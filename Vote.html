<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CCF 會員投票 / Member Polls</title>
  <style>
    :root{
      --bg:#f5f7fb;--card:#fff;--text:#172044;--muted:#64708f;--line:rgba(35,45,95,.15);
      --primary:#5143b7;--primary-soft:#efedff;--good:#157451;--good-soft:#eafff5;
      --warn:#956100;--warn-soft:#fff7df;--bad:#b52c50;--bad-soft:#fff0f4;
      --shadow:0 10px 28px rgba(35,42,90,.09);--radius:18px;--pad:clamp(13px,3.5vw,19px)
    }
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
    body.busy button,body.busy .fileButton{pointer-events:none;opacity:.6}.wrap{max-width:900px;margin:0 auto;padding:var(--pad)}
    .top{padding:7px 2px 3px}h1{font-size:clamp(23px,5vw,33px);line-height:1.15;margin:0;font-weight:950}
    h2{font-size:clamp(19px,4vw,25px);margin:0 0 8px;font-weight:900}h3{font-size:17px;margin:0 0 6px}
    .sub,.small{color:var(--muted);line-height:1.5}.sub{font-size:clamp(13px,3.2vw,16px);margin-top:5px}.small{font-size:13px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);margin:11px 0;box-shadow:var(--shadow)}
    .questionCard{padding:clamp(18px,5vw,30px)}.eyebrow{font-size:12px;font-weight:850;color:var(--primary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
    .question{font-size:clamp(21px,5vw,31px);line-height:1.28;font-weight:950;margin:0}
    .notice{border-radius:14px;padding:12px 13px;border:1px solid var(--line);line-height:1.5;margin:10px 0}.notice.good{background:var(--good-soft);border-color:rgba(21,116,81,.28)}.notice.warn{background:var(--warn-soft);border-color:rgba(149,97,0,.3)}.notice.bad{background:var(--bad-soft);border-color:rgba(181,44,80,.3)}.notice.info{background:#eef5ff;border-color:rgba(43,91,180,.24)}
    .strong{font-weight:900}.goodText{color:var(--good)}.badText{color:var(--bad)}
    button,input,select,textarea,.fileButton{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px;width:100%}
    button,.fileButton{font-weight:850;cursor:pointer;min-height:48px;box-shadow:0 5px 13px rgba(35,30,90,.06);display:flex;align-items:center;justify-content:center;text-align:center}
    button.primary,.fileButton.primary{background:var(--primary);color:#fff;border-color:var(--primary)}button.soft,.fileButton.soft{background:var(--primary-soft);border-color:rgba(81,67,183,.25)}button.good{background:var(--good-soft);border-color:rgba(21,116,81,.3)}button.danger{background:var(--bad-soft);border-color:rgba(181,44,80,.3)}
    button.mini{width:auto;min-height:34px;padding:7px 10px;border-radius:10px;font-size:13px;box-shadow:none}button.icon{width:38px;height:38px;min-height:38px;padding:0;border-radius:12px;font-size:21px}button:disabled{cursor:not-allowed;opacity:.5}
    input[type="checkbox"],input[type="radio"]{width:22px;height:22px;min-width:22px;padding:0;accent-color:var(--primary)}textarea{min-height:88px;resize:vertical}label.field{display:block;font-size:13px;color:var(--muted);margin:11px 0 5px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 190px}.row>.fit{flex:0 0 auto}.divider{height:1px;background:var(--line);margin:16px 0}.hide{display:none!important}
    .memberHead,.sectionHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.memberName{font-size:19px;font-weight:950}.sectionHead{align-items:center;margin-bottom:10px}.sectionHead h2{margin:0}
    .choiceGrid,.toolGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    .optionChoice{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0;background:#fff;cursor:pointer}.optionChoice:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 3px rgba(81,67,183,.12);background:#faf9ff}.optionNo{font-weight:950;color:var(--primary);min-width:28px}.optionText{line-height:1.4}.optionAlt{font-size:13px;color:var(--muted);margin-top:3px}
    .rankOption{justify-content:flex-start;text-align:left;background:#fff;margin:8px 0}.rankList{margin:10px 0}.rankRow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:9px;margin:7px 0}.rankNo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:950}
    .manageRow,.pollRow,.optionEditRow{border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}.optionEditRow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center}.optionEditRow input{padding:11px;border-radius:10px}.optionIndex{text-align:center;font-weight:900;color:var(--primary)}
    .checkLine{display:flex;align-items:center;gap:9px;margin:10px 0}.checkLine label{line-height:1.35}.inlineSetting{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:9px 0}
    .resultRow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.resultRow:last-child{border-bottom:0}.count{text-align:right;font-size:21px;font-weight:950}.bar{height:8px;background:#eceaf7;border-radius:99px;overflow:hidden;margin-top:7px}.bar>span{display:block;height:100%;background:var(--primary)}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;background:#f7f7fb;border-radius:9px;padding:8px;margin-top:5px}.overlay{position:fixed;inset:0;background:rgba(18,18,45,.52);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:0 28px 70px rgba(0,0,0,.3);padding:18px;width:min(620px,100%);max-height:88vh;overflow:auto}
    .footer{font-size:12px;color:var(--muted);padding:10px 3px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    @media(max-width:650px){.choiceGrid,.toolGrid{grid-template-columns:1fr}.resultRow{grid-template-columns:minmax(0,1fr) 54px}.questionCard{padding:18px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top"><h1>CCF 會員投票</h1><div class="sub">Member Polls</div></header>
    <main id="app"><section class="card"><div class="strong">正在載入… / Loading…</div></section></main>
    <footer class="footer"><span>Poll <?= VOTE_VERSION ?></span><span>請使用你自己的會員 QR / Use your own member QR</span></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    'use strict';
    var State={token:'',dashboard:null,publicConfig:null,selections:[],adminPollId:'',busy:0};
    var EXTERNAL_SCANNER_URL=String(<?!= JSON.stringify(EXTERNAL_SCANNER_URL || '') ?>||'').trim();
    var EXTERNAL_SCANNER_ORIGIN=String(<?!= JSON.stringify(EXTERNAL_SCANNER_ORIGIN || '') ?>||'').trim();
    var EXTERNAL_SCANNER_TIMEOUT_MS=Number(<?!= JSON.stringify(EXTERNAL_SCANNER_TIMEOUT_MS || 120000) ?>)||120000;
    var pendingExternalScanner_=null;

    function $(id){return document.getElementById(id)}
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
    function setBusy_(on){State.busy+=on?1:-1;if(State.busy<0)State.busy=0;document.body.classList.toggle('busy',State.busy>0)}
    function errHtml_(r){return '<div class="notice bad"><div class="strong">'+esc((r&&r.zh)||'系統錯誤')+'</div><div>'+esc((r&&r.en)||'System error')+'</div>'+(r&&r.code?'<div class="small">Code: '+esc(r.code)+'</div>':'')+'</div>'}
    function gas_(name){var args=Array.prototype.slice.call(arguments,1);setBusy_(true);return new Promise(function(resolve,reject){try{var run=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);run[name].apply(run,args)}catch(e){reject(e)}}).finally(function(){setBusy_(false)})}
    function call_(name){var args=Array.prototype.slice.call(arguments,1);return gas_.apply(null,[name].concat(args)).then(function(r){if(!r||!r.ok)throw(r||{code:'E500',zh:'沒有收到系統回應',en:'No response from server.'});return r})}
    function stateLabel_(s){return({NO_CURRENT_POLL:'暫時沒有投票 / No current poll',DRAFT:'草稿 / Draft',SCHEDULED:'已排程 / Scheduled',OPEN:'投票開放 / Poll open',CLOSED:'投票結束 / Poll closed',UNAVAILABLE:'暫時未能使用 / Unavailable'})[s]||String(s||'')}
    function answerLabel_(s){return({SINGLE:'單選 / One choice',MULTIPLE:'多選 / Multiple choice',RANKED:'排序 / Ordered choice'})[s]||String(s||'')}
    function fmtDate_(iso){if(!iso)return '—';try{return new Intl.DateTimeFormat('zh-HK',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'}).format(new Date(iso))+' (UK)'}catch(e){return String(iso)}}
    function toLocalInput_(iso){if(!iso)return '';var d=new Date(iso),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
    function inputToIso_(v){if(!v)return '';var d=new Date(v);return isNaN(d.getTime())?'':d.toISOString()}
    function currentPollId_(){return State.dashboard&&State.dashboard.election?String(State.dashboard.election.electionId||''):''}
    function optionText_(o){var a=String((o&&(o.label||o.labelZh))||''),b=String((o&&(o.labelAlt||o.labelEn))||'');return a&&b&&a!==b?a+' / '+b:(a||b)}
    function pollQuestion_(e){if(!e)return '';var a=String(e.question||e.titleZh||''),b=String(e.questionAlt||e.titleEn||'');return a&&b&&a!==b?a+' / '+b:(a||b)}
    function optionHtml_(o){return '<span class="optionNo">'+esc(o.optionNo)+'</span><span class="optionText"><span class="strong">'+esc(o.label||o.labelZh||o.labelEn)+'</span>'+((o.labelAlt||o.labelEn)&&(o.label||o.labelZh)?'<div class="optionAlt">'+esc(o.labelAlt||o.labelEn)+'</div>':'')+'</span>'}

    function scannerConfigOk_(){try{return !!EXTERNAL_SCANNER_URL&&!!EXTERNAL_SCANNER_ORIGIN&&new URL(EXTERNAL_SCANNER_URL).origin===new URL(EXTERNAL_SCANNER_ORIGIN).origin}catch(e){return false}}
    function randomState_(){var a=new Uint8Array(16);if(window.crypto&&window.crypto.getRandomValues)window.crypto.getRandomValues(a);else for(var i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);return Array.prototype.map.call(a,function(x){return x.toString(16).padStart(2,'0')}).join('')}
    function openExternalScanner_(){
      if(!scannerConfigOk_()){showLoginMessage_({code:'E_SCANNER_CONFIG',zh:'外置掃描器暫時未能使用，請改用 QR 圖片。',en:'The external scanner is unavailable; please use a QR image.'});return}
      var state=randomState_(),target=new URL(EXTERNAL_SCANNER_URL),origin=window.location.origin||'';target.searchParams.set('origin',origin);target.searchParams.set('state',state);target.searchParams.set('flow','vote_login');
      var popup=null;try{popup=window.open(target.toString(),'_blank','width=460,height=760')}catch(e){}if(!popup){showLoginMessage_({code:'E_POPUP',zh:'彈出視窗被封鎖，請允許後再試。',en:'The scanner popup was blocked.'});return}
      pendingExternalScanner_={state:state,popup:popup,timer:setTimeout(function(){clearExternalScanner_();showLoginMessage_({code:'E_TIMEOUT',zh:'掃描逾時，請重試。',en:'Scanner timed out. Please retry.'})},EXTERNAL_SCANNER_TIMEOUT_MS)}
    }
    function clearExternalScanner_(){if(!pendingExternalScanner_)return;try{clearTimeout(pendingExternalScanner_.timer);if(pendingExternalScanner_.popup&&!pendingExternalScanner_.popup.closed)pendingExternalScanner_.popup.close()}catch(e){}pendingExternalScanner_=null}
    window.addEventListener('message',function(event){if(!pendingExternalScanner_||event.origin!==EXTERNAL_SCANNER_ORIGIN||event.source!==pendingExternalScanner_.popup)return;var d=event.data||{};if(String(d.state||'')!==pendingExternalScanner_.state||['CCF_QR_RESULT','CCF_QR_CANCEL','CCF_QR_ERROR'].indexOf(String(d.type||''))<0)return;clearExternalScanner_();if(d.type==='CCF_QR_RESULT')loginWithQr_(String(d.payload||''));else if(d.type==='CCF_QR_ERROR')showLoginMessage_({code:'E_SCANNER',zh:'掃描器未能讀取 QR。',en:'The scanner could not read the QR.'})})
    function decodeImage_(file){return new Promise(function(resolve,reject){if(!file){reject({code:'E_QR_IMAGE_REQUIRED',zh:'請選擇 QR 圖片。',en:'Choose a QR image.'});return}var fr=new FileReader();fr.onerror=function(){reject({code:'E_QR_IMAGE_READ',zh:'未能讀取圖片。',en:'Could not read the image.'})};fr.onload=function(){var img=new Image();img.onerror=function(){reject({code:'E_QR_IMAGE_FORMAT',zh:'圖片格式不支援。',en:'Unsupported image format.'})};img.onload=function(){try{var c=document.createElement('canvas'),max=1800,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);var data=x.getImageData(0,0,c.width,c.height),qr=window.jsQR?window.jsQR(data.data,c.width,c.height):null;if(qr&&qr.data)resolve(String(qr.data));else reject({code:'E_QR_NOT_FOUND',zh:'圖片中找不到 QR code。',en:'No QR code was found in the image.'})}catch(e){reject({code:'E_QR_DECODE',zh:'圖片解碼失敗。',en:'Image decoding failed.'})}};img.src=fr.result};fr.readAsDataURL(file)})}

    function renderLogin_(cfg){
      var question=String((cfg&&cfg.question)||'').trim();
      $('app').innerHTML='<section class="card questionCard"><div class="eyebrow">目前投票 / Current poll</div><div class="question">'+esc(question||'暫時沒有投票 / No current poll')+'</div></section><section class="card"><div class="notice info"><div class="strong">使用你自己的 CCF QR 登入 / Sign in with your own CCF QR</div></div><div class="choiceGrid"><button id="btnExternal" class="primary" type="button">📷 外置掃描器 / External scanner</button><label class="fileButton soft" for="qrFile">🖼️ 上載 QR 圖片 / Upload QR image</label><input id="qrFile" class="hide" type="file" accept="image/*"></div><div id="loginMsg"></div></section>';
      $('btnExternal').onclick=openExternalScanner_;$('qrFile').onchange=function(){var input=this,file=input.files&&input.files[0];setBusy_(true);decodeImage_(file).then(loginWithQr_).catch(showLoginMessage_).finally(function(){setBusy_(false);input.value=''})}
    }
    function showLoginMessage_(r){if($('loginMsg'))$('loginMsg').innerHTML=errHtml_(r)}
    function loginWithQr_(payload){var raw=String(payload||'');call_('api_vote_login',raw).then(function(r){raw='';State.token=r.token;State.dashboard=r;renderDashboard_()}).catch(function(e){raw='';showLoginMessage_(e)})}
    function logout_(){State.token='';State.dashboard=null;State.selections=[];State.adminPollId='';renderLogin_(State.publicConfig||{})}
    function memberCard_(){var d=State.dashboard,m=d.member||{},name=m.nameZh||m.nameEn||m.id;return '<section class="card"><div class="memberHead"><div><div class="memberName">'+esc(name)+'</div><div class="small">'+esc(m.id)+' · '+esc(m.status)+(m.isMinor?' · 兒童會員 / Child':'')+'</div></div><button id="btnLogout" class="mini" type="button">登出 / Sign out</button></div></section>'}
    function bindMemberCard_(){if($('btnLogout'))$('btnLogout').onclick=logout_}

    function renderDashboard_(){
      var d=State.dashboard,p=d.privileges||{};
      if(d.setupRequired){renderSetup_();return}
      if(p.isAdmin){renderAdminChoice_();return}
      renderVoterPage_(false)
    }
    function renderSetup_(){var d=State.dashboard,p=d.privileges||{};$('app').innerHTML=memberCard_()+'<section class="card"><h2>準備投票資料 / Prepare poll data</h2>'+(p.isAdmin?'<div class="small">系統會把現有投票資料整理到一個 Vote 工作表。<br>Existing poll data will be consolidated into one Vote sheet.</div><button id="btnInit" class="primary" type="button" style="margin-top:12px">開始 / Continue</button>':'<div class="notice info">暫時未有可用投票。 / No poll is currently available.</div>')+'<div id="setupMsg"></div></section>';bindMemberCard_();if($('btnInit'))$('btnInit').onclick=initialise_}
    function initialise_(){if(!window.confirm('準備投票資料？\nPrepare the poll data?'))return;call_('api_vote_admin_initialize',State.token).then(function(r){State.dashboard=r;renderAdminChoice_()}).catch(function(e){$('setupMsg').innerHTML=errHtml_(e)})}
    function renderAdminChoice_(){var d=State.dashboard,e=d.election;$('app').innerHTML=memberCard_()+'<section class="card"><h2>'+(e?esc(e.question):'暫時沒有投票 / No current poll')+'</h2><div class="choiceGrid"><button id="btnCastView" class="primary" type="button">投票 / Cast vote</button><button id="btnManageView" class="soft" type="button">管理投票 / Manage polls</button></div></section>';bindMemberCard_();$('btnCastView').onclick=function(){renderVoterPage_(true)};$('btnManageView').onclick=openManager_}

    function eligibilityHtml_(d){var e=d.eligibility||{};return '<div class="notice '+(e.eligible?'good':'bad')+'"><div class="strong '+(e.eligible?'goodText':'badText')+'">'+esc(e.zh||'')+' / '+esc(e.en||'')+'</div>'+(e.reason?'<div class="small">'+esc(e.reason)+'</div>':'')+'</div>'}
    function votePanelHtml_(d){
      var state=d.effectiveState,e=d.eligibility||{},poll=d.election||{},type=poll.answerType||'SINGLE';
      var html='<section class="card"><div class="sectionHead"><h2>'+esc(poll.question||'會員投票 / Member poll')+'</h2><span class="small">'+esc(answerLabel_(type))+'</span></div>'+eligibilityHtml_(d);
      if(d.ballotStatus&&d.ballotStatus.hasVoted){html+='<div class="notice good"><span class="strong">你已提交此投票。 / Your response has been submitted.</span><br>系統不會接受第二次提交。<br>A second submission will not be accepted.</div><label class="field">收據編號 / Receipt ID</label><div class="code">'+esc(d.ballotStatus.receiptId)+'</div><div class="small">提交時間 / Submitted: '+esc(fmtDate_(d.ballotStatus.castAt))+'</div>'}
      else if(state==='OPEN'&&e.eligible){
        if(type==='SINGLE')html+='<div class="small">選擇一項，或使用下方棄權按鈕。 / Choose one option, or use the Abstain button below.</div><div id="optionList">'+(d.options||[]).map(function(o){return '<label class="optionChoice"><input type="radio" name="voteOption" value="'+esc(o.optionNo)+'">'+optionHtml_(o)+'</label>'}).join('')+'</div>';
        if(type==='MULTIPLE')html+='<div class="small">最多選擇 '+esc(poll.maxSelections)+' 項，或使用下方棄權按鈕。 / Choose up to '+esc(poll.maxSelections)+', or use the Abstain button below.</div><div id="optionList">'+(d.options||[]).map(function(o){return '<label class="optionChoice"><input type="checkbox" class="multiOption" value="'+esc(o.optionNo)+'">'+optionHtml_(o)+'</label>'}).join('')+'</div>';
        if(type==='RANKED')html+='<div class="small">依次點選以記錄次序。點已選項旁的 × 可移除。<br>Tap in order. Use × beside a selected item to remove it.</div><div id="rankChoices">'+(d.options||[]).map(function(o){return '<button class="rankOption" data-option="'+esc(o.optionNo)+'" type="button">'+esc(optionText_(o))+'</button>'}).join('')+'</div><div id="rankOrder" class="rankList"></div>';
        html+='<div id="voteMsg"></div><div class="choiceGrid"><button id="btnReviewVote" class="primary" type="button" disabled>檢查及提交 / Review and submit</button><button id="btnAbstain" class="danger" type="button">棄權 / Abstain</button></div>';
      }else if(state==='OPEN'){html+='<div class="small">如資格資料有誤，請聯絡 STAFF／DEACON／ADMIN。<br>If this is incorrect, contact STAFF/DEACON/ADMIN.</div>'}
      else{html+='<div class="notice info"><span class="strong">'+esc(stateLabel_(state))+'</span>'+(poll.closesAt?'<div class="small">截止 / Closes: '+esc(fmtDate_(poll.closesAt))+'</div>':'')+'</div>'}
      var p=d.privileges||{},canResults=d.hasCurrentPoll&&(state==='CLOSED'||p.canViewEarlyResults);if(canResults)html+='<button id="btnVoterResults" class="good" type="button" style="margin-top:12px">查看結果 / View results</button>';
      return html+'</section>'
    }
    function renderVoterPage_(adminBack){var d=State.dashboard,p=d.privileges||{};State.selections=[];$('app').innerHTML=memberCard_()+(adminBack?'<button id="btnBackRole" class="mini soft" type="button">← 返回 / Back</button>':'')+(d.hasCurrentPoll?votePanelHtml_(d):'<section class="card"><div class="notice info">暫時沒有投票。 / No current poll.</div></section>')+(p.canManageEligibility&&d.hasCurrentPoll?'<section class="card"><button id="btnEligibility" class="soft" type="button">投票資格 / Eligibility</button></section>':'');bindMemberCard_();if($('btnBackRole'))$('btnBackRole').onclick=renderAdminChoice_;bindVoterControls_();if($('btnEligibility'))$('btnEligibility').onclick=function(){openEligibility_(currentPollId_(),adminBack?'admin':'voter')};if($('btnVoterResults'))$('btnVoterResults').onclick=function(){openResults_(currentPollId_(),adminBack?'admin':'voter')}}
    function bindVoterControls_(){
      var d=State.dashboard,poll=d.election||{},type=poll.answerType||'SINGLE';
      Array.prototype.forEach.call(document.querySelectorAll('input[name="voteOption"]'),function(input){input.onchange=function(){State.selections=[this.value];updateSubmit_()}});
