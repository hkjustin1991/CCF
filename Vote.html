<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CCF 會員投票 / Member Polls</title>
  <style>
    :root{
      --bg:#f4f1ff;--card:#fff;--text:#172044;--muted:#617096;--line:rgba(35,45,95,.15);
      --primary:#5b42c4;--primary-soft:#eeeaff;--good:#157a51;--good-soft:#eafff5;
      --warn:#9a6500;--warn-soft:#fff7df;--bad:#bc2f55;--bad-soft:#fff0f4;
      --shadow:0 12px 30px rgba(35,30,90,.1);--radius:18px;--pad:clamp(12px,3.5vw,18px)
    }
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
    body.busy button{pointer-events:none;opacity:.62}.wrap{max-width:960px;margin:0 auto;padding:var(--pad)}
    .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 2px}
    h1{font-size:clamp(23px,5vw,34px);line-height:1.15;margin:0;font-weight:950}h2{font-size:clamp(19px,4vw,24px);margin:0 0 8px;font-weight:900}h3{font-size:17px;margin:0 0 6px}
    .sub,.small{color:var(--muted);line-height:1.5}.sub{font-size:clamp(13px,3.2vw,16px);margin-top:5px}.small{font-size:13px}
    .pill{font-size:12px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;white-space:nowrap}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);margin:11px 0;box-shadow:var(--shadow)}
    .notice{border-radius:14px;padding:12px 13px;border:1px solid var(--line);line-height:1.5;margin:10px 0}.notice.good{background:var(--good-soft);border-color:rgba(21,122,81,.28)}.notice.warn{background:var(--warn-soft);border-color:rgba(154,101,0,.3)}.notice.bad{background:var(--bad-soft);border-color:rgba(188,47,85,.3)}.notice.info{background:#eef5ff;border-color:rgba(43,91,180,.24)}
    .strong{font-weight:900}.goodText{color:var(--good)}.badText{color:var(--bad)}.warnText{color:var(--warn)}
    button,input,select,textarea{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px;width:100%}button{font-weight:850;cursor:pointer;min-height:48px;box-shadow:0 5px 13px rgba(35,30,90,.06)}
    button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}button.soft{background:var(--primary-soft);border-color:rgba(91,66,196,.25)}button.good{background:var(--good-soft);border-color:rgba(21,122,81,.3)}button.danger{background:var(--bad-soft);border-color:rgba(188,47,85,.3)}button.mini{width:auto;min-height:36px;padding:8px 11px;border-radius:10px;font-size:13px;box-shadow:none}button:disabled{cursor:not-allowed;opacity:.5}
    input[type="checkbox"],input[type="radio"]{width:22px;height:22px;min-width:22px;padding:0;accent-color:var(--primary)}textarea{min-height:82px;resize:vertical}label.field{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 180px}.row>.fit{flex:0 0 auto}.divider{height:1px;background:var(--line);margin:15px 0}.hide{display:none!important}
    .option{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0;cursor:pointer;background:#fff}.option:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,66,196,.12);background:#faf9ff}.optionNo{font-weight:950;color:var(--primary);min-width:30px}.optionText{line-height:1.4}.optionEn{font-size:13px;color:var(--muted);margin-top:3px}
    .memberHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.memberName{font-size:20px;font-weight:950}.toolGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
    .manageRow,.pollRow,.optionEditRow{border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}.checkLine{display:flex;align-items:center;gap:9px;margin:9px 0}.checkLine label{line-height:1.35}
    .optionEditRow{display:grid;grid-template-columns:82px minmax(150px,1fr) minmax(150px,1fr) auto;gap:8px;align-items:center}.optionEditRow input{padding:10px;border-radius:10px}.optionEditRow button{min-width:42px}
    .resultRow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.resultRow:last-child{border-bottom:0}.count{text-align:right;font-size:21px;font-weight:950}.bar{height:8px;background:#eceaf7;border-radius:99px;overflow:hidden;margin-top:7px}.bar>span{display:block;height:100%;background:var(--primary)}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;background:#f7f7fb;border-radius:9px;padding:8px;margin-top:5px}.overlay{position:fixed;inset:0;background:rgba(18,18,45,.52);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:0 28px 70px rgba(0,0,0,.3);padding:18px;width:min(620px,100%);max-height:88vh;overflow:auto}
    .footer{font-size:12px;color:var(--muted);padding:10px 3px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    @media(max-width:680px){.toolGrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.pill{white-space:normal}.resultRow{grid-template-columns:minmax(0,1fr) 55px}.optionEditRow{grid-template-columns:70px 1fr auto}.optionEditRow .optionEnInput{grid-column:2/4}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div><h1>CCF 會員投票</h1><div class="sub">Member Polls · 每個投票只可提交一次</div></div>
      <div id="statePill" class="pill">載入中 / Loading…</div>
    </header>
    <main id="app"><div class="card"><div class="strong">正在載入… / Loading…</div></div></main>
    <footer class="footer"><span>投票系統版本 / Poll system <?= VOTE_VERSION ?></span><span>請使用你自己的會員 QR / Use your own member QR</span></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    'use strict';
    var State={token:'',dashboard:null,publicConfig:null,selectedOption:'',adminPollId:'',busy:0};
    var EXTERNAL_SCANNER_URL=String(<?!= JSON.stringify(EXTERNAL_SCANNER_URL || '') ?>||'').trim();
    var EXTERNAL_SCANNER_ORIGIN=String(<?!= JSON.stringify(EXTERNAL_SCANNER_ORIGIN || '') ?>||'').trim();
    var EXTERNAL_SCANNER_TIMEOUT_MS=Number(<?!= JSON.stringify(EXTERNAL_SCANNER_TIMEOUT_MS || 120000) ?>)||120000;
    var pendingExternalScanner_=null;
    var NAME_POLL_TEMPLATE=[
      {optionNo:'1',labelZh:'恩典合一華人教會',labelEn:'Grace United Chinese Church'},
      {optionNo:'3',labelZh:'蘭開夏郡華人恩典堂（亦可考慮「教會」）／蘭開夏郡恩典華人堂／教會',labelEn:'Lancashire Grace Chinese Church'},
      {optionNo:'4',labelZh:'以馬內利教會／以馬內利恩典教會',labelEn:''},{optionNo:'5',labelZh:'恩典之家',labelEn:''},
      {optionNo:'6',labelZh:'救恩教會',labelEn:'Saving Grace Church'},{optionNo:'9',labelZh:'普恩基督教會',labelEn:'Preston Grace / GCC Preston'},
      {optionNo:'12',labelZh:'牧愛／牧靈',labelEn:''},{optionNo:'17',labelZh:'應許之地教會',labelEn:'Promised Land Chinese Church Preston'},
      {optionNo:'18',labelZh:'基督永約教會',labelEn:'Covenant of Christ Chinese Church Preston'},{optionNo:'20',labelZh:'信望愛',labelEn:'Faith Hope Love'},
      {optionNo:'21',labelZh:'恩基教會',labelEn:''},{optionNo:'25',labelZh:'恩主堂',labelEn:''},{optionNo:'26',labelZh:'恩典教會',labelEn:''}
    ];

    function $(id){return document.getElementById(id)}
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
    function setBusy_(on){State.busy+=on?1:-1;if(State.busy<0)State.busy=0;document.body.classList.toggle('busy',State.busy>0)}
    function errHtml_(r){return '<div class="notice bad"><div class="strong">'+esc((r&&r.zh)||'系統錯誤')+'</div><div>'+esc((r&&r.en)||'System error')+'</div>'+(r&&r.code?'<div class="small">Code: '+esc(r.code)+'</div>':'')+'</div>'}
    function gas_(name){var args=Array.prototype.slice.call(arguments,1);setBusy_(true);return new Promise(function(resolve,reject){try{var run=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);run[name].apply(run,args)}catch(e){reject(e)}}).finally(function(){setBusy_(false)})}
    function call_(name){var args=Array.prototype.slice.call(arguments,1);return gas_.apply(null,[name].concat(args)).then(function(r){if(!r||!r.ok)throw(r||{code:'E500',zh:'沒有收到系統回應',en:'No response from server.'});return r})}
    function stateLabel_(s){return({NO_CURRENT_POLL:'暫時沒有投票 / No current poll',DRAFT:'草稿 / Draft',SCHEDULED:'已排程 / Scheduled',OPEN:'投票開放 / Poll open',CLOSED:'投票結束 / Poll closed',UNAVAILABLE:'暫時未能使用 / Unavailable'})[s]||String(s||'')}
    function updatePill_(cfg){if($('statePill'))$('statePill').textContent=stateLabel_((cfg&&cfg.effectiveState)||'NO_CURRENT_POLL')}
    function fmtDate_(iso){if(!iso)return '—';try{return new Intl.DateTimeFormat('zh-HK',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'}).format(new Date(iso))+' (UK)'}catch(e){return String(iso)}}
    function toLocalInput_(iso){if(!iso)return '';var d=new Date(iso),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
    function inputToIso_(v){if(!v)return '';var d=new Date(v);return isNaN(d.getTime())?'':d.toISOString()}
    function optionLabel_(o){return '<span class="optionNo">#'+esc(o.optionNo)+'</span><span class="optionText"><span class="strong">'+esc(o.labelZh||o.labelEn)+'</span>'+(o.labelEn&&o.labelZh?'<div class="optionEn">'+esc(o.labelEn)+'</div>':'')+'</span>'}
    function currentPollId_(){return State.dashboard&&State.dashboard.election?String(State.dashboard.election.electionId||''):''}

    function scannerConfigOk_(){try{return !!EXTERNAL_SCANNER_URL&&!!EXTERNAL_SCANNER_ORIGIN&&new URL(EXTERNAL_SCANNER_URL).origin===new URL(EXTERNAL_SCANNER_ORIGIN).origin}catch(e){return false}}
    function randomState_(){var a=new Uint8Array(16);if(window.crypto&&window.crypto.getRandomValues)window.crypto.getRandomValues(a);else for(var i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);return Array.prototype.map.call(a,function(x){return x.toString(16).padStart(2,'0')}).join('')}
    function openExternalScanner_(){
      if(!scannerConfigOk_()){showLoginMessage_({code:'E_SCANNER_CONFIG',zh:'外置掃描器暫時未能使用，請改用 QR 圖片。',en:'The external scanner is unavailable; please use a QR image.'});return}
      var state=randomState_(),target=new URL(EXTERNAL_SCANNER_URL),origin=window.location.origin||'';target.searchParams.set('origin',origin);target.searchParams.set('state',state);target.searchParams.set('flow','vote_login');
      var popup=null;try{popup=window.open(target.toString(),'_blank','width=460,height=760')}catch(e){}if(!popup){showLoginMessage_({code:'E_POPUP',zh:'彈出視窗被封鎖，請允許後再試。',en:'The scanner popup was blocked.'});return}
      pendingExternalScanner_={state:state,popup:popup,timer:setTimeout(function(){clearExternalScanner_();showLoginMessage_({code:'E_TIMEOUT',zh:'掃描逾時，請重試。',en:'Scanner timed out. Please retry.'})},EXTERNAL_SCANNER_TIMEOUT_MS)}
    }
    function clearExternalScanner_(){if(!pendingExternalScanner_)return;try{clearTimeout(pendingExternalScanner_.timer);if(pendingExternalScanner_.popup&&!pendingExternalScanner_.popup.closed)pendingExternalScanner_.popup.close()}catch(e){}pendingExternalScanner_=null}
    window.addEventListener('message',function(event){if(!pendingExternalScanner_||event.origin!==EXTERNAL_SCANNER_ORIGIN||event.source!==pendingExternalScanner_.popup)return;var d=event.data||{};if(String(d.state||'')!==pendingExternalScanner_.state||['CCF_QR_RESULT','CCF_QR_CANCEL','CCF_QR_ERROR'].indexOf(String(d.type||''))<0)return;clearExternalScanner_();if(d.type==='CCF_QR_RESULT')loginWithQr_(String(d.payload||''));else if(d.type==='CCF_QR_ERROR')showLoginMessage_({code:'E_SCANNER',zh:'掃描器未能讀取 QR。',en:'The scanner could not read the QR.'})})
    function decodeImage_(file){return new Promise(function(resolve,reject){if(!file){reject({code:'E415',zh:'請先選擇 QR 圖片。',en:'Please choose a QR image.'});return}var fr=new FileReader();fr.onerror=function(){reject({code:'E415',zh:'未能讀取圖片。',en:'Could not read the image.'})};fr.onload=function(){var img=new Image();img.onerror=function(){reject({code:'E415',zh:'圖片格式不支援。',en:'Unsupported image format.'})};img.onload=function(){try{var c=document.createElement('canvas'),max=1800,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);var data=x.getImageData(0,0,c.width,c.height),qr=window.jsQR?window.jsQR(data.data,c.width,c.height):null;if(qr&&qr.data)resolve(String(qr.data));else reject({code:'E416',zh:'圖片中找不到 QR code。',en:'No QR code was found in the image.'})}catch(e){reject({code:'E500',zh:'圖片解碼失敗。',en:'Image decoding failed.'})}};img.src=fr.result};fr.readAsDataURL(file)})}

    function renderLogin_(cfg){
      updatePill_(cfg);var e=cfg&&cfg.election;
      $('app').innerHTML='<section class="card"><h2>'+(e?esc(e.titleZh||e.titleEn):'暫時沒有投票')+'</h2>'+(e&&e.titleZh&&e.titleEn?'<div class="sub">'+esc(e.titleEn)+'</div>':'')+(e?'<div class="small" style="margin-top:10px">開始 / Opens: '+esc(fmtDate_(e.opensAt))+'<br>截止 / Closes: '+esc(fmtDate_(e.closesAt))+'</div>':'<div class="sub">No current poll</div>')+'<div class="notice info"><div class="strong">使用你自己的 CCF QR 登入 / Sign in with your own CCF QR</div></div><div class="row"><button id="btnExternal" class="primary" type="button">📷 外置掃描器 / External scanner</button><label><span class="hide">QR image</span><input id="qrFile" type="file" accept="image/*"></label><button id="btnImage" class="soft" type="button">🖼️ 上載 QR 圖片 / Upload QR image</button></div><div id="loginMsg"></div></section>';
      $('btnExternal').onclick=openExternalScanner_;$('btnImage').onclick=function(){var f=$('qrFile').files&&$('qrFile').files[0];setBusy_(true);decodeImage_(f).then(loginWithQr_).catch(showLoginMessage_).finally(function(){setBusy_(false);if($('qrFile'))$('qrFile').value=''})}
    }
    function showLoginMessage_(r){if($('loginMsg'))$('loginMsg').innerHTML=errHtml_(r)}
    function loginWithQr_(payload){var raw=String(payload||'');call_('api_vote_login',raw).then(function(r){raw='';State.token=r.token;State.dashboard=r;renderDashboard_()}).catch(function(e){raw='';showLoginMessage_(e)})}
    function logout_(){State.token='';State.dashboard=null;State.selectedOption='';State.adminPollId='';renderLogin_(State.publicConfig||{})}

    function eligibilityHtml_(d){var e=d.eligibility||{};return '<div class="notice '+(e.eligible?'good':'bad')+'"><div class="strong '+(e.eligible?'goodText':'badText')+'">'+esc(e.zh||'')+' / '+esc(e.en||'')+'</div>'+(e.reason?'<div class="small">'+esc(e.reason)+'</div>':'')+'</div>'}
    function votePanelHtml_(d){
      var state=d.effectiveState,e=d.eligibility||{},poll=d.election||{},html='<section class="card"><h2>'+esc(poll.titleZh||poll.titleEn||'會員投票')+'</h2>'+(poll.titleZh&&poll.titleEn?'<div class="sub">'+esc(poll.titleEn)+'</div>':'')+eligibilityHtml_(d);
      if(d.ballotStatus&&d.ballotStatus.hasVoted){html+='<div class="notice good"><span class="strong">你已提交此投票。 / Your vote has been submitted.</span><br>系統不會接受第二次提交。<br>A second submission will not be accepted.</div><label class="field">收據編號 / Receipt ID</label><div class="code">'+esc(d.ballotStatus.receiptId)+'</div><div class="small">提交時間 / Submitted: '+esc(fmtDate_(d.ballotStatus.castAt))+'</div>'}
      else if(state==='OPEN'&&e.eligible){html+='<div class="notice warn"><span class="strong">只可選一項，提交後不能更改。</span><br>Choose one option. It cannot be changed after submission.</div><div id="optionList">';(d.options||[]).forEach(function(o){html+='<label class="option"><input type="radio" name="voteOption" value="'+esc(o.optionNo)+'">'+optionLabel_(o)+'</label>'});html+='</div><button id="btnReviewVote" class="primary" type="button" disabled>檢查及確認 / Review and confirm</button><div id="voteMsg"></div>'}
      else if(state==='OPEN'){html+='<div class="small">如資格資料有誤，請聯絡 STAFF／DEACON／ADMIN。<br>If this is incorrect, contact STAFF/DEACON/ADMIN.</div>'}
      else{html+='<div class="notice info"><span class="strong">'+esc(stateLabel_(state))+'</span>'+(poll.closesAt?'<div class="small">截止 / Closes: '+esc(fmtDate_(poll.closesAt))+'</div>':'')+'</div>'}
      return html+'</section>'
    }

    function renderDashboard_(){
      var d=State.dashboard,p=d.privileges||{},name=d.member.nameZh||d.member.nameEn||d.member.id;updatePill_(d);
      var html='<section class="card"><div class="memberHead"><div><div class="memberName">'+esc(name)+'</div><div class="small">'+esc(d.member.id)+' · '+esc(d.member.status)+(d.member.isMinor?' · 兒童會員 / Child':'')+'</div></div><button id="btnLogout" class="mini" type="button">登出 / Sign out</button></div></section>';
      if(d.setupRequired){html+='<section class="card"><h2>投票系統尚未初始化 / Polling system not initialised</h2>'+(p.isAdmin?'<button id="btnInit" class="primary" type="button">初始化投票系統 / Initialise polling system</button>':'<div class="notice info">暫時未有可用投票。 / No poll is currently available.</div>')+'<div id="setupMsg"></div></section>'}
      else{
        if(d.hasCurrentPoll)html+=votePanelHtml_(d);else html+='<section class="card"><div class="notice info"><span class="strong">暫時沒有投票。 / No current poll.</span></div></section>';
        var canResults=d.hasCurrentPoll&&(d.effectiveState==='CLOSED'||p.canViewEarlyResults);
        if((p.canManageEligibility&&d.hasCurrentPoll)||p.canManageElection||canResults){html+='<section class="card"><h2>授權工具 / Authorised tools</h2><div class="toolGrid">'+(p.canManageEligibility&&d.hasCurrentPoll?'<button id="btnEligibility" class="soft" type="button">✅ 投票資格 / Eligibility</button>':'')+(p.canManageElection?'<button id="btnCreatePoll" class="primary" type="button">➕ 建立新投票 / Create poll</button><button id="btnPollManager" class="soft" type="button">🗂️ 投票管理 / Poll manager</button>':'')+(p.canManageElection&&d.hasCurrentPoll?'<button id="btnCurrentSettings" class="soft" type="button">⚙️ 目前投票設定 / Current settings</button><button id="btnScrutineers" class="soft" type="button">👥 監票員 / Scrutineers</button>':'')+(canResults?'<button id="btnResults" class="good" type="button">📊 投票結果 / Results</button>':'')+'</div></section><section id="toolArea"></section>'}
      }
      $('app').innerHTML=html;$('btnLogout').onclick=logout_;
      if($('btnInit'))$('btnInit').onclick=initialise_;
      Array.prototype.forEach.call(document.querySelectorAll('input[name="voteOption"]'),function(r){r.onchange=function(){State.selectedOption=r.value;$('btnReviewVote').disabled=false}});
      if($('btnReviewVote'))$('btnReviewVote').onclick=reviewVote_;
      if($('btnEligibility'))$('btnEligibility').onclick=function(){renderEligibilityTool_(currentPollId_());loadRoster_(currentPollId_(),'')};
      if($('btnCreatePoll'))$('btnCreatePoll').onclick=function(){renderPollContentForm_('create',null)};
      if($('btnPollManager'))$('btnPollManager').onclick=loadPollManager_;
      if($('btnCurrentSettings'))$('btnCurrentSettings').onclick=function(){loadPollDetail_(currentPollId_())};
      if($('btnScrutineers'))$('btnScrutineers').onclick=function(){renderScrutineerTool_(currentPollId_());loadScrutineers_(currentPollId_())};
      if($('btnResults'))$('btnResults').onclick=function(){loadResults_(currentPollId_())}
    }
    function refresh_(){return call_('api_vote_dashboard',State.token).then(function(r){State.dashboard=r;renderDashboard_();return r})}
    function initialise_(){if(!window.confirm('初始化可重用投票系統？\nInitialise the reusable polling system?'))return;call_('api_vote_admin_initialize',State.token).then(function(r){State.dashboard=r;renderDashboard_();renderPollContentForm_('create',null)}).catch(function(e){$('setupMsg').innerHTML=errHtml_(e)})}

    function reviewVote_(){
      var o=(State.dashboard.options||[]).filter(function(x){return x.optionNo===State.selectedOption})[0];if(!o)return;
      var overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<div class="modal"><h2>確認選擇 / Confirm choice</h2><div class="option">'+optionLabel_(o)+'</div><div class="notice warn"><span class="strong">提交後不能更改或再次提交。</span><br>This cannot be changed or submitted again.</div><div class="checkLine"><input id="finalAck" type="checkbox"><label for="finalAck">我確認這是我的最終選擇。<br>I confirm this is my final choice.</label></div><div class="row"><button id="btnCancelFinal" type="button">返回 / Back</button><button id="btnCastFinal" class="primary" type="button" disabled>提交 / Submit</button></div><div id="finalMsg"></div></div>';document.body.appendChild(overlay);
      $('finalAck').onchange=function(){$('btnCastFinal').disabled=!this.checked};$('btnCancelFinal').onclick=function(){document.body.removeChild(overlay)};$('btnCastFinal').onclick=function(){var b=this;b.disabled=true;call_('api_vote_cast',State.token,currentPollId_(),o.optionNo).then(function(r){document.body.removeChild(overlay);showReceipt_(r)}).catch(function(e){$('finalMsg').innerHTML=errHtml_(e);b.disabled=false})}
    }
    function showReceipt_(r){State.selectedOption='';var already=r.result==='ALREADY_VOTED';$('app').innerHTML='<section class="card"><h2 class="goodText">'+(already?'你已提交此投票 / Already submitted':'提交成功 / Submitted')+'</h2><div class="notice good">'+(already?'系統沒有加入第二次提交。<br>No second submission was added.':'你的選擇已記錄。<br>Your choice has been recorded.')+'</div><label class="field">收據編號 / Receipt ID</label><div class="code">'+esc(r.receiptId)+'</div><div class="small">提交時間 / Submitted: '+esc(fmtDate_(r.castAt))+'</div><button id="btnReceiptDone" class="soft" type="button" style="margin-top:14px">完成並登出 / Finish and sign out</button></section>';$('btnReceiptDone').onclick=logout_}

    function optionRowsHtml_(options){var html='';(options||[]).forEach(function(o,i){html+='<div class="optionEditRow"><input class="optionNoInput" value="'+esc(o.optionNo||String(i+1))+'" placeholder="#"><input class="optionZhInput" value="'+esc(o.labelZh||'')+'" placeholder="中文選項"><input class="optionEnInput" value="'+esc(o.labelEn||'')+'" placeholder="English option"><button class="removeOption mini danger" type="button">×</button></div>'});return html}
    function bindOptionRows_(){Array.prototype.forEach.call(document.querySelectorAll('.removeOption'),function(b){b.onclick=function(){var rows=document.querySelectorAll('.optionEditRow');if(rows.length<=2)return;b.closest('.optionEditRow').remove()}})}
    function setOptionRows_(options){$('pollOptionRows').innerHTML=optionRowsHtml_(options);bindOptionRows_()}
    function addOptionRow_(){var rows=Array.prototype.slice.call(document.querySelectorAll('.optionEditRow')),next=rows.length+1,holder=document.createElement('div');holder.innerHTML=optionRowsHtml_([{optionNo:String(next),labelZh:'',labelEn:''}]);$('pollOptionRows').appendChild(holder.firstChild);bindOptionRows_()}
    function collectPollContent_(){var options=Array.prototype.map.call(document.querySelectorAll('.optionEditRow'),function(row){return{optionNo:row.querySelector('.optionNoInput').value,labelZh:row.querySelector('.optionZhInput').value,labelEn:row.querySelector('.optionEnInput').value}});return{titleZh:$('pollTitleZh').value,titleEn:$('pollTitleEn').value,options:options}}
    function renderPollContentForm_(mode,detail){
      var editing=mode==='edit',e=editing?detail.election:{},opts=editing?detail.options:[{optionNo:'1',labelZh:'',labelEn:''},{optionNo:'2',labelZh:'',labelEn:''}];
      $('toolArea').innerHTML='<section class="card"><h2>'+(editing?'修改草稿 / Edit draft':'建立新投票 / Create new poll')+'</h2><div class="small">每個投票只可選一項。選項在投票開放後會鎖定。<br>Each poll allows one choice. Options lock once the poll opens.</div><label class="field">中文標題 / Chinese title</label><input id="pollTitleZh" value="'+esc(e.titleZh||'')+'"><label class="field">English title</label><input id="pollTitleEn" value="'+esc(e.titleEn||'')+'"><div class="row" style="margin-top:12px"><span class="strong">選項 / Options</span><button id="btnAddOption" class="mini soft fit" type="button">＋ 加一項 / Add</button>'+(!editing?'<button id="btnNameTemplate" class="mini soft fit" type="button">載入教會名稱選項 / Load church-name choices</button>':'')+'</div><div id="pollOptionRows"></div><button id="btnSavePollContent" class="primary" type="button" style="margin-top:12px">'+(editing?'儲存草稿 / Save draft':'建立投票 / Create poll')+'</button><div id="pollContentMsg"></div></section>';
      setOptionRows_(opts);$('btnAddOption').onclick=addOptionRow_;if($('btnNameTemplate'))$('btnNameTemplate').onclick=function(){$('pollTitleZh').value='CCF 教會名稱最終投票';$('pollTitleEn').value='CCF Final Church Name Poll';setOptionRows_(NAME_POLL_TEMPLATE)};
      $('btnSavePollContent').onclick=function(){var payload=collectPollContent_(),fn=editing?'api_vote_admin_save_poll_content':'api_vote_admin_create_poll',args=editing?[State.token,e.electionId,payload]:[State.token,payload];call_.apply(null,[fn].concat(args)).then(function(r){var pollId=editing?e.electionId:r.poll.electionId,notice=r.warning||{zh:editing?'草稿已儲存。':'投票草稿已建立。',en:editing?'Draft saved.':'Poll draft created.'};return refresh_().then(function(){loadPollDetail_(pollId,notice)})}).catch(function(x){$('pollContentMsg').innerHTML=errHtml_(x)})}
    }

    function loadPollManager_(){$('toolArea').innerHTML='<section class="card"><h2>投票管理 / Poll manager</h2><div id="pollList"><div class="small">載入中… / Loading…</div></div></section>';call_('api_vote_admin_polls',State.token).then(renderPollManager_).catch(function(e){$('pollList').innerHTML=errHtml_(e)})}
    function renderPollManager_(r){var html='<button id="btnManagerCreate" class="primary" type="button">➕ 建立新投票 / Create new poll</button>';if(!(r.rows||[]).length)html+='<div class="notice info">尚未建立投票。 / No polls created yet.</div>';(r.rows||[]).forEach(function(p){html+='<div class="pollRow" data-poll="'+esc(p.electionId)+'"><h3>'+esc(p.titleZh||p.titleEn||p.electionId)+'</h3>'+(p.titleZh&&p.titleEn?'<div class="small">'+esc(p.titleEn)+'</div>':'')+'<div class="small">'+esc(stateLabel_(p.effectiveState))+' · 選項 '+esc(p.optionCount)+' · 選票 '+esc(p.ballotCount)+(p.isCurrent?' · <span class="strong goodText">目前 / Current</span>':'')+'</div><div class="row" style="margin-top:9px"><button class="managePoll mini soft" type="button">管理 / Manage</button><button class="pollResults mini good" type="button">結果 / Results</button>'+(!p.isCurrent?'<button class="makeCurrent mini" type="button">設為目前 / Set current</button>':'')+'</div><div class="pollRowMsg"></div></div>'});$('pollList').innerHTML=html;$('btnManagerCreate').onclick=function(){renderPollContentForm_('create',null)};Array.prototype.forEach.call(document.querySelectorAll('.pollRow'),function(row){var id=row.getAttribute('data-poll');row.querySelector('.managePoll').onclick=function(){loadPollDetail_(id)};row.querySelector('.pollResults').onclick=function(){loadResults_(id)};var set=row.querySelector('.makeCurrent');if(set)set.onclick=function(){call_('api_vote_admin_set_current_poll',State.token,id).then(function(d){State.dashboard=d;renderDashboard_();loadPollManager_()}).catch(function(e){row.querySelector('.pollRowMsg').innerHTML=errHtml_(e)})}})}

    function loadPollDetail_(pollId,notice){State.adminPollId=pollId;$('toolArea').innerHTML='<section class="card"><div class="small">載入中… / Loading…</div></section>';call_('api_vote_admin_poll_detail',State.token,pollId).then(function(d){renderPollDetail_(d);if(notice&&$('pollDetailMsg'))$('pollDetailMsg').innerHTML='<div class="notice '+(notice.code?'warn':'good')+'">'+esc(notice.zh||'')+'<br>'+esc(notice.en||'')+'</div>'}).catch(function(e){$('toolArea').innerHTML='<section class="card">'+errHtml_(e)+'</section>'})}
    function renderPollDetail_(d){
      var e=d.election,canEdit=e.state==='DRAFT'&&Number(d.ballotCount||0)===0;
      $('toolArea').innerHTML='<section class="card"><h2>'+esc(e.titleZh||e.titleEn)+'</h2>'+(e.titleZh&&e.titleEn?'<div class="sub">'+esc(e.titleEn)+'</div>':'')+'<div class="small">'+esc(e.electionId)+' · '+esc(stateLabel_(d.effectiveState))+(d.isCurrent?' · <span class="strong goodText">目前 / Current</span>':'')+' · 選票 / Ballots: '+esc(d.ballotCount)+'</div>'+(!d.optionsIntegrityOk?'<div class="notice bad">選項完整性檢查失敗。草稿可重新儲存修復；已開放投票請停止操作並交由系統負責人處理。<br>Option integrity failed. A draft can be resaved; for an opened poll stop and contact the system owner.</div>':'')+'<div class="toolGrid" style="margin-top:12px">'+(canEdit?'<button id="btnEditContent" class="soft" type="button">✏️ 修改標題及選項 / Edit content</button>':'')+(!d.isCurrent?'<button id="btnSetThisCurrent" class="soft" type="button">設為目前 / Set current</button>':'')+'<button id="btnDetailEligibility" class="soft" type="button">✅ 投票資格 / Eligibility</button><button id="btnDetailScrut" class="soft" type="button">👥 監票員 / Scrutineers</button><button id="btnDetailResults" class="good" type="button">📊 結果 / Results</button><button id="btnBackPolls" type="button">返回列表 / Back to list</button></div><div class="divider"></div><h3>開放及截止 / Opening and closing</h3><div class="notice warn">系統以每個 CCF ID 限制一次提交。開放前請確認沒有同一人持有多個有效會員記錄，並預先議定同票處理方法。<br>One submission is enforced per CCF ID. Check duplicate member records and agree the tie procedure before opening.</div><label class="field">開始時間 / Opens (this device time zone)</label><input id="eOpens" type="datetime-local" value="'+esc(toLocalInput_(e.opensAt))+'"><label class="field">截止時間 / Closes (required for OPEN)</label><input id="eCloses" type="datetime-local" value="'+esc(toLocalInput_(e.closesAt))+'"><label class="field">狀態 / State</label><select id="eState"><option value="DRAFT">DRAFT — 草稿</option><option value="OPEN">OPEN — 開放／排程</option><option value="CLOSED">CLOSED — 正式結束（不可逆）</option></select><button id="btnSaveElection" class="primary" type="button" style="margin-top:12px">儲存設定 / Save settings</button><div id="pollDetailMsg"></div></section>';
      $('eState').value=e.state||'DRAFT';if($('btnEditContent'))$('btnEditContent').onclick=function(){renderPollContentForm_('edit',d)};if($('btnSetThisCurrent'))$('btnSetThisCurrent').onclick=function(){call_('api_vote_admin_set_current_poll',State.token,e.electionId).then(function(x){State.dashboard=x;renderDashboard_();loadPollDetail_(e.electionId)}).catch(function(x){$('pollDetailMsg').innerHTML=errHtml_(x)})};$('btnDetailEligibility').onclick=function(){renderEligibilityTool_(e.electionId);loadRoster_(e.electionId,'')};$('btnDetailScrut').onclick=function(){renderScrutineerTool_(e.electionId);loadScrutineers_(e.electionId)};$('btnDetailResults').onclick=function(){loadResults_(e.electionId)};$('btnBackPolls').onclick=loadPollManager_;$('btnSaveElection').onclick=function(){saveElection_(e.electionId)}
    }
    function saveElection_(pollId){var state=$('eState').value;if(state==='CLOSED'&&!window.confirm('這會正式結束此投票，而且不能重新開啟。確定？\nThis permanently closes the poll. Continue?'))return;var p={opensAt:inputToIso_($('eOpens').value),closesAt:inputToIso_($('eCloses').value),state:state};call_('api_vote_admin_save_election',State.token,pollId,p).then(function(r){return refresh_().then(function(){renderPollDetail_(r);if(r.warning)$('pollDetailMsg').innerHTML='<div class="notice warn">'+esc(r.warning.zh)+'<br>'+esc(r.warning.en)+'</div>';else $('pollDetailMsg').innerHTML='<div class="notice good">已儲存 / Saved</div>'})}).catch(function(e){$('pollDetailMsg').innerHTML=errHtml_(e)})}

    function renderEligibilityTool_(pollId){State.adminPollId=pollId;$('toolArea').innerHTML='<section class="card"><h2>投票資格 / Eligibility</h2><div class="small">兒童會員必須由 STAFF／DEACON／ADMIN 確認；DISABLED、PROVISIONAL、PENDING 仍會被系統阻止。STAFF／DEACON／ADMIN 亦可設定此投票不合資格。<br>Children require STAFF/DEACON/ADMIN confirmation. DISABLED, PROVISIONAL and PENDING remain blocked. STAFF/DEACON/ADMIN may also exclude a member from this poll.</div><div class="row" style="margin-top:10px"><input id="rosterQuery" placeholder="CCF ID 或姓名 / ID or name"><button id="btnRosterSearch" class="soft fit" type="button">搜尋 / Search</button></div><div id="rosterMsg"></div><div id="rosterRows"></div></section>';$('btnRosterSearch').onclick=function(){loadRoster_(pollId,$('rosterQuery').value)};$('rosterQuery').onkeydown=function(e){if(e.key==='Enter')loadRoster_(pollId,this.value)}}
    function loadRoster_(pollId,q){$('rosterMsg').innerHTML='<div class="small">載入中… / Loading…</div>';call_('api_vote_staff_roster',State.token,pollId,q).then(function(r){$('rosterMsg').innerHTML=r.truncated?'<div class="notice warn">只顯示首 100 項。 / Showing the first 100.</div>':'';renderRosterRows_(pollId,r.rows||[])}).catch(function(e){$('rosterMsg').innerHTML=errHtml_(e)})}
    function renderRosterRows_(pollId,rows){if(!rows.length){$('rosterRows').innerHTML='<div class="notice info">沒有相符會員。 / No matching members.</div>';return}var html='';rows.forEach(function(r){var m=r.member,f=r.flags||{},e=r.eligibility||{},id=esc(m.id);html+='<div class="manageRow" data-member="'+id+'"><h3>'+esc(m.nameZh||m.nameEn||m.id)+'</h3><div class="small">'+id+' · '+esc(m.status)+(m.isMinor?' · 兒童 / Child':'')+'</div><div class="small '+(e.eligible?'goodText':'badText')+'">'+esc(e.zh)+' / '+esc(e.en)+'</div><div class="checkLine"><input id="child_'+id+'" class="childTick" type="checkbox" '+(f.childEligible?'checked ':'')+(m.isMinor?'':'disabled ')+'><label for="child_'+id+'">兒童合資格 / Child eligible</label></div><div class="checkLine"><input id="exclude_'+id+'" class="excludeTick" type="checkbox" '+(f.explicitIneligible?'checked':'')+'><label for="exclude_'+id+'">此投票不合資格 / Exclude from this poll</label></div><input class="excludeReason" value="'+esc(f.reason||'')+'" placeholder="原因 / Reason"><button class="saveEligibility good" type="button" style="margin-top:9px">儲存 / Save</button><div class="rowMsg"></div></div>'});$('rosterRows').innerHTML=html;Array.prototype.forEach.call(document.querySelectorAll('.saveEligibility'),function(btn){btn.onclick=function(){var row=btn.closest('.manageRow'),id=row.getAttribute('data-member'),child=row.querySelector('.childTick').checked,excluded=row.querySelector('.excludeTick').checked,reason=row.querySelector('.excludeReason').value,msg=row.querySelector('.rowMsg');call_('api_vote_staff_set_eligibility',State.token,pollId,id,child,excluded,reason).then(function(r){msg.innerHTML='<div class="notice good">已儲存：'+esc(r.eligibility.zh)+' / '+esc(r.eligibility.en)+'</div>'}).catch(function(e){msg.innerHTML=errHtml_(e)})}})}

    function renderScrutineerTool_(pollId){State.adminPollId=pollId;$('toolArea').innerHTML='<section class="card"><h2>指定監票員 / Appointed scrutineers</h2><div class="small">每人必須以準確 CCF ID 明確指定。指定監票員可在截止前查看結果。<br>Each person must be explicitly appointed by exact CCF ID. Appointed scrutineers may view results before closing.</div><div class="row" style="margin-top:10px"><input id="scrutId" placeholder="CCF####"><button id="btnAddScrut" class="soft fit" type="button">加入 / Add</button></div><div id="scrutMsg"></div><div id="scrutRows"></div></section>';$('btnAddScrut').onclick=function(){call_('api_vote_admin_scrutineer_update',State.token,pollId,$('scrutId').value,true).then(function(r){$('scrutId').value='';renderScrutineerRows_(pollId,r.rows||[])}).catch(function(e){$('scrutMsg').innerHTML=errHtml_(e)})}}
    function loadScrutineers_(pollId){call_('api_vote_admin_scrutineers',State.token,pollId).then(function(r){renderScrutineerRows_(pollId,r.rows||[])}).catch(function(e){$('scrutMsg').innerHTML=errHtml_(e)})}
    function renderScrutineerRows_(pollId,rows){if(!rows.length){$('scrutRows').innerHTML='<div class="notice warn">尚未指定監票員。 / No scrutineers appointed.</div>';return}var html='';rows.forEach(function(r){html+='<div class="manageRow" data-scrut="'+esc(r.memberId)+'"><span class="strong">'+esc(r.nameZh||r.nameEn||r.memberId)+'</span><div class="small">'+esc(r.memberId)+'</div><button class="removeScrut danger mini" type="button" style="margin-top:8px">移除 / Remove</button></div>'});$('scrutRows').innerHTML=html;Array.prototype.forEach.call(document.querySelectorAll('.removeScrut'),function(b){b.onclick=function(){var id=b.closest('[data-scrut]').getAttribute('data-scrut');call_('api_vote_admin_scrutineer_update',State.token,pollId,id,false).then(function(r){renderScrutineerRows_(pollId,r.rows||[])}).catch(function(e){$('scrutMsg').innerHTML=errHtml_(e)})}})}

    function loadResults_(pollId){State.adminPollId=pollId;$('toolArea').innerHTML='<section class="card"><h2>投票結果 / Results</h2><div id="resultsBody"><div class="small">載入中… / Loading…</div></div></section>';call_('api_vote_results',State.token,pollId).then(function(r){renderResults_(pollId,r)}).catch(function(e){$('resultsBody').innerHTML=errHtml_(e)})}
    function renderResults_(pollId,r){var max=0;(r.rows||[]).forEach(function(x){if(x.votes>max)max=x.votes});var html='<h3>'+esc(r.election.titleZh||r.election.titleEn)+'</h3>'+(r.election.titleZh&&r.election.titleEn?'<div class="small">'+esc(r.election.titleEn)+'</div>':'')+'<div class="notice info"><span class="strong">總有效選票 / Valid submissions: '+esc(r.totalBallots)+'</span></div>';(r.rows||[]).forEach(function(x){var pct=max?Math.round(x.votes/max*100):0;html+='<div class="resultRow"><div><span class="strong">#'+esc(x.optionNo)+' '+esc(x.labelZh||x.labelEn)+'</span>'+(x.labelEn&&x.labelZh?'<div class="small">'+esc(x.labelEn)+'</div>':'')+'<div class="bar"><span style="width:'+pct+'%"></span></div></div><div class="count">'+esc(x.votes)+'</div></div>'});$('resultsBody').innerHTML=html}

    function boot_(){gas_('api_vote_public_config').then(function(r){if(!r||!r.ok)throw r;State.publicConfig=r;renderLogin_(r)}).catch(function(e){$('app').innerHTML='<section class="card">'+errHtml_(e)+'</section>';updatePill_({effectiveState:'NO_CURRENT_POLL'})})}
    window.addEventListener('error',function(e){try{console.error('Poll UI error',e.error||e.message||e)}catch(_e){}});boot_();
  </script>
