<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Preston Grace · Live</title>
<style>
:root{--navy:#083d63;--teal:#087f8c;--paper:#f3f6f8;--line:#dce5e9;--muted:#516574;--danger:#a52934;--gold:#b98523}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#16364c;font:17px/1.5 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{min-height:50px;border:1px solid var(--line);border-radius:15px;padding:12px 16px;background:white;color:var(--navy);font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--navy);color:white;border-color:var(--navy)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b98523;outline-offset:2px}.shell{max-width:560px;margin:auto;padding:0 18px calc(28px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;padding:14px 0;margin-bottom:14px;border-bottom:1px solid var(--line)}header img{width:54px;height:54px;object-fit:contain;background:white;border-radius:12px}header strong{display:block;font-size:19px}header small{color:var(--muted)}header button{margin-left:auto;min-width:50px;padding:10px}.eyebrow{font-size:13px;color:var(--teal);font-weight:700;letter-spacing:.08em}h1{font-size:30px;line-height:1.2;margin:10px 0}h2{font-size:22px;margin:0 0 8px}p{margin:8px 0 18px}.muted{color:var(--muted);font-size:15px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:20px;text-align:left;border-radius:24px;box-shadow:0 5px 18px #083d6307}.tile:first-child{background:var(--navy);color:white}.tile:nth-child(2){background:#def1ee}.tile:nth-child(3){background:#fff4d8}.tile:nth-child(4){background:#e6edf6}.tile svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.7}.tile strong{font-size:23px;display:block}.tile small{font-size:14px;display:block}.card{background:white;border:1px solid var(--line);border-radius:21px;padding:18px;margin:12px 0;overflow-wrap:anywhere}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row small{flex:none}.person{font-size:22px;font-weight:700}.status{border-left:5px solid var(--teal)}.status.error{border-color:var(--danger);color:var(--danger)}.status.pending{border-color:var(--gold)}input,select,textarea{width:100%;min-height:54px;border:1px solid #b6c8d2;border-radius:13px;padding:12px;background:white;color:#16364c}label{display:block;font-size:15px;font-weight:600;margin:10px 0 6px}.full{width:100%}.hero{text-align:center;padding:20px 0}.hero img{width:180px;height:180px;object-fit:contain;border-radius:24px}.number{font-size:48px;font-weight:750;line-height:1.1}.tag{display:inline-block;border-radius:20px;padding:3px 10px;background:#e4f1ee;font-size:13px}.back{margin-bottom:15px}.searchbar{position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:1}a{color:var(--teal)}[hidden]{display:none!important}#notice:empty{display:none}.result-actions{position:sticky;bottom:0;padding:12px 0;background:var(--paper)}@media(min-width:700px){.shell{max-width:600px}.tile{aspect-ratio:1.15}}@media(max-height:720px) and (min-width:360px){.tile{padding:14px}.tiles{margin-top:14px;gap:10px}header{padding:8px 0;margin-bottom:8px}h1{font-size:27px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div class="shell"><header><img id="headerLogo" alt="普恩基督教會 PGCC"><div><strong>普恩基督教會</strong><small>Preston Grace · 同工專頁 / Live Portal</small></div><button id="more" aria-label="更多 More">•••</button></header><main id="app"></main><div id="notice" role="status" aria-live="polite"></div><p class="muted" id="version"></p></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const BOOT=<?!= BOOT ?>;
const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const displayId=id=>String(id||'').replace(/^CCF/,'PGCC');
const name=m=>[m.displayNameZh||m.nameZh,m.preferredName||m.nameEn].filter(Boolean).join(' · ')||displayId(m.id);
function get(key){try{return sessionStorage.getItem(key)||'';}catch(e){return '';}}
function set(key,value){try{sessionStorage.setItem(key,value);}catch(e){}}
let token=get('ccf_token'), staff=null, eventKey='', view='login', busy=false, epoch=0, attendance=null;
$('headerLogo').src=BOOT.config.logo; $('version').textContent=BOOT.config.version;
function notice(text,error){$('notice').innerHTML=text?'<div class="card status '+(error?'error':'pending')+'">'+esc(text)+'</div>':'';}
function errorText(e){return [e.zh,e.en,e.code].filter(Boolean).join(' / ')||e.message||'暫時未能完成，請重試。 / Unable to complete. Please retry.';}
function api(fn,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r):reject(r||{})).withFailureHandler(reject).api_rpc(fn,args);});}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button,input').forEach(b=>b.disabled=true);notice('處理中… / Working…');try{await fn();}catch(e){if(e.code==='E401'){token='';set('ccf_token','');screen('login');}notice(errorText(e),true);}finally{busy=false;document.querySelectorAll('button,input').forEach(b=>b.disabled=false);}}
function button(id,zh,en,primary){return '<button id="'+id+'" class="full '+(primary?'primary':'')+'">'+zh+'<br><small>'+en+'</small></button>';}
function route(mode){const url=new URL(BOOT.config.url);if(mode)url.searchParams.set('mode',mode);return url.toString();}
function navigate(url){notice('請繼續 / Please continue');const a=document.createElement('a');a.href=url;a.target='_top';a.textContent='繼續 / Continue';a.style.cssText='display:block;padding:16px;background:white;border-radius:12px;text-align:center';$('notice').append(a);try{a.click();}catch(e){/* The visible link retains a fresh user gesture. */}}
function classic(){action(async()=>{try{localStorage.setItem('pgcc_ui','classic');}catch(e){}const r=await api('api_pgcc_live_switch',token,'classic');navigate(r.url);});}
function back(){return '<button class="back" id="back">‹ 返回 / Back</button>';}
function person(m){return '<div class="person">'+esc(name(m))+'</div><div class="muted">'+esc(displayId(m.id))+'</div>';}
const icons=['<path d="M3 9V3h6m6 0h6v6m0 6v6h-6M9 21H3v-6M7 7h3v3H7zm7 0h3v3h-3zM7 14h3v3H7zm7 0h3v3h-3z"/>','<circle cx="10" cy="9" r="4"/><path d="M2 21v-3c0-5 16-5 16 0v3m-1-10 5 5m-1-7v6"/>','<path d="M4 20V10m8 10V4m8 16v-7M2 22h20"/>','<path d="m4 10 2-6h12l2 6M3 17v-7h18v7zm2 0v3m14-3v3M6 13h2m8 0h2"/>'];
function screen(next){view=next;epoch++;notice('');const root=$('app');
 if(next==='login'){root.innerHTML='<div class="hero"><img src="'+esc(BOOT.config.logo)+'" alt="Preston Grace Christian Church"><h1>歡迎回來</h1><p class="muted">Sign in with your personal QR</p></div><div class="stack">'+button('scan','掃描我的 QR','Scan my QR',true)+button('upload','上載 QR 圖片','Upload QR image')+'<input hidden id="file" type="file" accept="image/*"><button id="classic">桌面版 / Classic interface</button></div>';bindQr('login');$('classic').onclick=classic;
 }else if(next==='home'){root.innerHTML='<div class="eyebrow">WELCOME · 歡迎</div><h1>'+esc(name(staff||{}))+'</h1><div class="muted">'+esc(eventKey.replace('SundayService_',''))+'</div><div class="tiles">'+[['scan','掃描簽到','Scan check-in'],['manual','尋找會眾','Find person'],['live','即時出席','Live attendance'],['car','尋找車輛','Find car']].map((a,i)=>'<button class="tile" data-view="'+a[0]+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+icons[i]+'</svg><span><strong>'+a[1]+'</strong><small>'+a[2]+'</small></span></button>').join('')+'</div>';root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>screen(b.dataset.view));
 }else if(next==='scan'){root.innerHTML=back()+'<h1>掃描簽到</h1><p class="muted">Scan a member’s QR to check in.</p><div class="stack">'+button('scan','開啟掃描器','Open scanner',true)+button('upload','上載 QR 圖片','Upload QR image')+'<input hidden id="file" type="file" accept="image/*"></div>';bindQr('checkin');
 }else if(next==='manual'||next==='car'){root.innerHTML=back()+'<h1>'+(next==='manual'?'尋找會眾':'尋找車輛')+'</h1><form id="searchForm" class="searchbar"><label for="query">'+(next==='manual'?'姓名或 PGCC 號碼 / Name or member number':'車牌號碼 / Registration')+'</label><input id="query" type="search" autocomplete="off" enterkeyhint="search"><button class="primary full" style="margin-top:10px">搜尋 / Search</button></form><div id="results"></div>';$('searchForm').onsubmit=e=>{e.preventDefault();search(next);};
 }else if(next==='live'){root.innerHTML=back()+'<h1>即時出席</h1><button id="refresh" class="full">重新整理 / Refresh</button><div id="liveData"></div>';$('refresh').onclick=()=>loadLive(true);loadLive(false);
 }else if(next==='more'){root.innerHTML=back()+'<h1>更多 / More</h1><div class="stack">'+button('plan','崇拜資料','Service information')+(['STAFF','DEACON','ADMIN'].includes((staff||{}).status)?button('editPlan','編輯崇拜安排','Edit service planning'):'')+button('classic','切換至桌面版','Classic interface')+button('auto','自動選擇介面','Use device default')+button('logout','登出','Sign out')+'</div>';$('classic').onclick=classic;$('plan').onclick=()=>openPlan(false);if($('editPlan'))$('editPlan').onclick=()=>openPlan(true);$('auto').onclick=()=>{try{localStorage.removeItem('pgcc_ui');}catch(e){}notice('已清除介面偏好，下次開啟時生效。 / Preference cleared for your next visit.');};$('logout').onclick=()=>action(async()=>{await api('api_logout',token);token='';staff=null;set('ccf_token','');screen('login');});
 }if($('back'))$('back').onclick=()=>screen('home');window.scrollTo(0,0);
}
$('more').onclick=()=>screen(token?'more':'login');
async function openPlan(edit){await action(async()=>{const r=await api('api_pgcc_open_plan',token,edit?'live-edit':'live');navigate(r.url);});}
function bindQr(flow){$('scan').onclick=()=>action(async()=>{const r=await api('api_mobile_scanner',token,flow,eventKey);const u=new URL(BOOT.scanner.url);u.searchParams.set('state',r.state);u.searchParams.set('flow',flow);u.searchParams.set('returnMode','post');u.searchParams.set('returnView','mobileScan');u.searchParams.set('returnUrl',route('live-mobile'));navigate(u.toString());});$('upload').onclick=()=>$('file').click();$('file').onchange=()=>{const f=$('file').files[0];if(f)action(async()=>{await processQr(await decode(f),flow);});};}
function decode(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const scale=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);const p=ctx.getImageData(0,0,c.width,c.height),qr=window.jsQR&&jsQR(p.data,p.width,p.height);if(!qr)throw new Error('找不到 QR，請使用清晰圖片。 / No QR found. Try a clearer image.');resolve(qr.data);}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Cannot open image / 無法開啟圖片'));};img.src=url;});}
async function processQr(payload,flow){if(flow==='login'){const r=await api('api_login',payload);token=r.token;staff=r.staff;eventKey=r.eventKey;set('ccf_token',token);screen('home');}else{const r=await api('api_checkin_scan',token,payload,eventKey,'PGCC_MOBILE',navigator.userAgent);result(r);}}
function result(r){attendance=null;screen('result');const already=r.result==='ALREADY',time=(already?r.already:r)||{};$('app').innerHTML='<div class="card status"><div class="eyebrow">'+(already?'ALREADY CHECKED IN':'CHECK-IN COMPLETE')+'</div><h1>'+(already?'已經簽到':'簽到成功')+'</h1>'+person(r.member||{})+'<p>'+esc(time.timeUk||'')+'</p><p class="muted">'+esc(((r.emailUi||time.emailUi)||{}).zh||'')+'</p></div><div class="result-actions stack">'+button('next','掃描下一位','Scan next person',true)+button('find','尋找下一位','Find another person')+button('home','返回主頁','Home')+'</div>';$('next').onclick=()=>screen('scan');$('find').onclick=()=>screen('manual');$('home').onclick=()=>screen('home');}
async function search(kind){const q=$('query').value.trim();if(!q)return;const mine=epoch;await action(async()=>{const r=await api(kind==='car'?'api_search_vrm':'api_search_members',token,q,eventKey);if(mine!==epoch)return;notice('');const results=r.results||[];$('results').innerHTML=results.length?results.map((m,i)=>'<div class="card">'+person(m)+(kind==='manual'?'<button class="full" data-pick="'+i+'">選擇 / Select</button>':'<p>'+esc([m.vrm,m.vrm2].filter(Boolean).join(' / '))+'</p><div class="muted">'+esc(m.checkedInToday?'已簽到 / Checked in':'未簽到 / Not checked in')+'</div>')+'</div>').join(''):'<div class="card">沒有結果 / No matches</div>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>confirmPerson(results[Number(b.dataset.pick)]));});}
function confirmPerson(m){screen('confirm');$('app').innerHTML=back()+'<h1>確認簽到</h1><p class="muted">Confirm this is the correct person.</p><div class="card">'+person(m)+'</div>'+button('confirm','確認簽到','Confirm check-in',true);$('back').onclick=()=>screen('manual');$('confirm').onclick=()=>action(async()=>result(await api('api_checkin_manual',token,m.id,eventKey,'PGCC_MOBILE',navigator.userAgent)));}
async function loadLive(force){const mine=epoch;await action(async()=>{if(force||!attendance||Date.now()-attendance.at>15000){attendance={data:await api('api_get_live_page',token,eventKey),at:Date.now()};}if(mine!==epoch)return;notice('');const d=attendance.data;$('liveData').innerHTML='<div class="card row"><div><div class="number">'+Number(d.totalAttendance||0)+'</div><div>出席 / Present</div></div><div><div class="number">'+Number(d.newFriendCount||0)+'</div><div>新朋友 / New</div></div></div><p class="muted">最近 / Latest: '+esc(d.lastSignIn?name(d.lastSignIn)+' · '+d.lastSignIn.timeUk:'—')+'</p><label for="filter">尋找已簽到會眾 / Find attendee</label><input id="filter" type="search"><div id="people"></div><details class="card"><summary>今日事奉 / Serving today</summary>'+((d.servingToday||[]).map(x=>'<p>'+esc(x.position||'')+'<br>'+esc(name(x))+'</p>').join('')||'—')+'</details>';function filter(){const q=$('filter').value.toLowerCase();$('people').innerHTML=(d.names||[]).filter(m=>(name(m)+' '+displayId(m.id)).toLowerCase().includes(q)).map(m=>'<div class="card">'+person(m)+(m.isNew?'<span class="tag">新朋友 / New</span>':'')+'</div>').join('');} $('filter').oninput=filter;filter();});}
async function boot(){try{localStorage.setItem('pgcc_ui','mobile');}catch(e){}const r=BOOT.resume;if(r&&r.token){token=r.token;set('ccf_token',token);eventKey=r.eventKey;}screen('login');if(token){busy=true;document.querySelectorAll('button,input').forEach(b=>b.disabled=true);try{const p=await api('api_ping',token);staff=p.staff;eventKey=(r&&r.eventKey)||p.eventKey;screen('home');}catch(e){token='';set('ccf_token','');}finally{busy=false;document.querySelectorAll('button,input').forEach(b=>b.disabled=false);}}if(r){if(r.error){notice(r.error,true);return;}if(r.type==='CCF_QR_RESULT'){await action(()=>processQr(r.payload,r.flow));}else if(r.type){if(token)screen('scan');notice(r.type==='CCF_QR_ERROR'?'掃描未完成，請重試或上載 QR 圖片。 / Scan failed. Retry or upload a QR image.':'已取消掃描，可重新開始。 / Scan cancelled. You can try again.',r.type==='CCF_QR_ERROR');}}}
boot();
</script></body></html>
