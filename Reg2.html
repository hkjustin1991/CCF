  <style>

    .hint{font-size:var(--fs-body);color:var(--muted);margin-top:8px;line-height:1.45}
    .pill{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:4px 10px;border-radius:999px;background:#fff}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:calc(var(--pad) + 2px);margin:10px 0;box-shadow:var(--shadow)}

    input,textarea,button{width:100%;border-radius:var(--radius);border:1px solid var(--border);background:#fff;color:var(--text);padding:calc(var(--pad) + 2px);font-size:var(--fs-input)}

    button.alt{background:#eef4ff;border-color:rgba(40,90,200,0.18)}

    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.45);

    .btnSelGood{

    /* list (admin-like) */

    @media (pointer: coarse){

    @media (max-width: 420px){
      .kv{ grid-template-columns: 120px 1fr; }
      .videoWrap{aspect-ratio:1/1}

  <div class="wrap">
    <header class="topbar">
      <div>
        <div class="title">CCF會員登記及自助服務平台 / CCF registration and self service portal</div>

      </div>
      <div><span class="pill">v<?= APP_VERSION ?> · reg <?= REG_VERSION ?> · ui reg2-ui-2026-02-15.reg95</span></div>
    </header>

    <main id="app"></main>

    <footer class="small" style="padding:8px 4px;">
      如問題持續，請聯絡影音同工 / Contact Media team if issue persists

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <script>
    function $(id){ return document.getElementById(id); }

    function showBootError_(details){
      var root = $('app') || document.body;
      var msg = '';
      try{
        msg = (details && details.message) ? String(details.message) : String(details || 'Unknown boot error');
      }catch(e){
        msg = 'Unknown boot error';
      }
      var token = 'BOOT-' + Date.now() + '-' + (msg.slice(0, 24).replace(/[^A-Za-z0-9]+/g, '_') || 'error');
      var diag = '';
      try{
        diag = (details && details.stack) ? String(details.stack) : msg;
      }catch(e){ diag = msg; }
      root.innerHTML =
        '<div class="wrap">'+
          '<div class="card msgBox err" style="display:block">'+
            '<div class="big err">⚠️ 暫時未能開啟頁面 / We cannot open this page right now</div>'+
            '<div class="small" style="margin-top:8px">請稍後再試，或重新整理頁面。<br/>Please refresh and try again in a moment.</div>'+
            '<div class="small" style="margin-top:8px">如問題持續，請把以下編號提供給同工：<br/>If this keeps happening, share this token with staff: <b>'+escapeHtml(token)+'</b></div>'+
            '<details style="margin-top:10px">'+
              '<summary style="cursor:pointer;font-weight:700">同工診斷資料 / Staff diagnostics</summary>'+
              '<pre style="white-space:pre-wrap;margin-top:8px;font-size:12px">'+escapeHtml(diag)+'</pre>'+
            '</details>'+
          '</div>'+
        '</div>';
      try{ console.error('[boot-fail]', token, details); }catch(e){}
    }

    window.addEventListener('error', function(evt){
      showBootError_(evt && (evt.error || evt.message || evt));
    });
    window.addEventListener('unhandledrejection', function(evt){
      showBootError_(evt && evt.reason ? evt.reason : evt);
    });

    function getApiEndpoint(){
      try{
        if (window.CCF_API_ENDPOINT) return String(window.CCF_API_ENDPOINT);
        var qp = new URLSearchParams(window.location.search || '');
        if (qp.get('api')) return String(qp.get('api'));
      }catch(e){}
      return '';
    }

    function callApiViaRpc(endpoint, fn, args){
      return fetch(endpoint, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ fn: fn, args: args || [] }),
        credentials:'omit'
      }).then(function(resp){
        return resp.text().then(function(txt){
          var data;
          try{ data = JSON.parse(txt); }catch(e){ throw new Error('Invalid API response'); }
          if(!resp.ok || !data || !data.ok){
            var err = (data && data.error) ? data.error : { message:'API call failed' };
            throw err;
          }
          return data.result;
        });
      });
    }

    function callApiViaGas(fn, args){
      return new Promise(function(resolve, reject){
        try{
          var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
          runner[fn].apply(runner, args || []);
        }catch(err){
          reject(err);
        }
      });
    }

    function callApi(fn){
      var args = Array.prototype.slice.call(arguments, 1);
      var endpoint = getApiEndpoint();
      var forceRpcOnce = !!window.CCF_FORCE_RPC_ONCE;

      if(forceRpcOnce){
        window.CCF_FORCE_RPC_ONCE = false;
        if(endpoint) return callApiViaRpc(endpoint, fn, args);
      }

      return callApiViaGas(fn, args).catch(function(err){
        if(endpoint){
          var msg = String((err && err.message) || err || 'GAS call failed');
          throw {
            code:'E530',
            zh:'GAS 連線失敗，請改用 Git 再試',
            en:'GAS failed. Please retry with Git API.',
            detail: msg,
            gasFailed:true
          };
        }
        throw err;
      });
    }

    function escapeHtml(s){
      s = String(s || '');
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function toDmy(ymd){
      var s = String(ymd || '').trim();
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m) return '';
      var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
      if(y < 1000 || y > 9999 || mo < 1 || mo > 12) return '';
      var dt = new Date(y, mo - 1, d);
      if (dt.getFullYear() !== y || dt.getMonth() !== (mo - 1) || dt.getDate() !== d) return '';
      return m[3] + '/' + m[2] + '/' + m[1];
    }

    function getDeviceId(){
      try{
        var id = localStorage.getItem('ccf_reg_deviceId');
        if(!id){
          id = 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
          localStorage.setItem('ccf_reg_deviceId', id);
        }
        return id;
      }catch(e){
        return 'R' + Date.now().toString(36);
      }
    }
    function getUA(){ try{ return navigator.userAgent || ''; }catch(e){ return ''; } }

    const EXTERNAL_SCANNER_TIMEOUT_MS = Number(<?!= JSON.stringify(EXTERNAL_SCANNER_TIMEOUT_MS || 120000) ?>) || 120000;

    function makeExternalScannerState_(){
      try{
        if(window.crypto && window.crypto.getRandomValues){
          var arr = new Uint32Array(4);
          window.crypto.getRandomValues(arr);
          return Array.prototype.map.call(arr, function(n){ return n.toString(16); }).join('');
        }
      }catch(e){}
      return String(Date.now()) + '_' + String(Math.random()).slice(2);
    }

    function openExternalScanner_(onPayload, onStatus){
      var state = makeExternalScannerState_();
      var done = false;
      var timer = null;
      var poll = null;
      var popup = null;

      function clear(reason){
        if(done) return;
        done = true;
        if(timer){ clearTimeout(timer); timer = null; }
        if(poll){ clearInterval(poll); poll = null; }
        window.removeEventListener('message', onMessage);
        if(popup && !popup.closed){ try{ popup.close(); }catch(e){} }
        if(typeof onStatus === 'function') onStatus(reason || 'closed');
      }

      function onMessage(ev){
        if(!ev || ev.origin !== EXTERNAL_SCANNER_ORIGIN) return;
        var data = ev.data || {};
        if(!data || data.state !== state) return;
        if(data.type === 'scanner:cancel'){ clear('cancel'); return; }
        if(data.type !== 'scanner:result' || !data.payload) return;
        clear('success');
        onPayload(String(data.payload), 'EXT_SCANNER');
      }

      window.addEventListener('message', onMessage);
      if(!EXTERNAL_SCANNER_CONFIG.ok){ clear('config_invalid'); return; }
      var url = EXTERNAL_SCANNER_URL + '?state=' + encodeURIComponent(state);
      popup = window.open(url, 'ccf_ext_scanner', 'popup,width=460,height=760');
      if(!popup){ clear('blocked'); return; }

      timer = setTimeout(function(){ clear('timeout'); }, EXTERNAL_SCANNER_TIMEOUT_MS);
      poll = setInterval(function(){
        if(popup && popup.closed){ clear('popup_closed'); }
      }, 400);
    }

    function showBox(kind, zh, en, detail){
      detail = detail || '';
      var cls = (kind==='ok')?'ok':(kind==='err'?'err':'warn');
      return ''+
        '<div class="msgBox '+(kind==='ok'?'ok':(kind==='err'?'err':'warn'))+'">'+
          '<div class="big '+cls+'">'+zh+'</div>'+
          '<div style="margin-top:4px;font-size:16px;">'+en+'</div>'+
          (detail ? ('<div style="margin-top:10px;">'+detail+'</div>') : '')+
        '</div>';
    }

    function showServerErr(res){
      var zh = (res && res.zh) ? res.zh : '系統錯誤';
      var en = (res && res.en) ? res.en : 'System error';
      var code = (res && res.code) ? ('<div class="small">Code: '+escapeHtml(res.code)+'</div>') : '';
      var detail = (res && res.detail) ? ('<div class="small">'+escapeHtml(res.detail)+'</div>') : '';
      return showBox('err', escapeHtml(zh), escapeHtml(en), code + detail);
    }

    function navigateToLivePortal(){
      var target = window.location.origin + window.location.pathname;
      window.location.href = target;
    }



    var EXTERNAL_SCANNER_URL = String(<?!= JSON.stringify(EXTERNAL_SCANNER_URL || '') ?> || '').trim();
    var EXTERNAL_SCANNER_ORIGIN = String(<?!= JSON.stringify(EXTERNAL_SCANNER_ORIGIN || '') ?> || '').trim();
    var pendingExternalScanner_ = null;
    var EXTERNAL_SCANNER_CONFIG_ERROR = '';

    function validateExternalScannerConfig_(){
      var issues = [];
      var parsedUrl = null;
      var parsedOrigin = null;
      if(!EXTERNAL_SCANNER_URL){
        issues.push('Missing EXTERNAL_SCANNER_URL');
      }else{
        try{ parsedUrl = new URL(EXTERNAL_SCANNER_URL); }catch(e){ issues.push('Invalid EXTERNAL_SCANNER_URL'); }
      }
      if(!EXTERNAL_SCANNER_ORIGIN){
        issues.push('Missing EXTERNAL_SCANNER_ORIGIN');
      }else{
        try{ parsedOrigin = new URL(EXTERNAL_SCANNER_ORIGIN); }catch(e){ issues.push('Invalid EXTERNAL_SCANNER_ORIGIN'); }
      }
      if(parsedOrigin && parsedOrigin.pathname !== '/') issues.push('EXTERNAL_SCANNER_ORIGIN must be origin only');
      if(parsedUrl && parsedOrigin && parsedUrl.origin !== parsedOrigin.origin) issues.push('URL origin and scanner origin mismatch');
      EXTERNAL_SCANNER_CONFIG_ERROR = issues.join('; ');
      return { ok: !issues.length, message: EXTERNAL_SCANNER_CONFIG_ERROR };
    }

    function scannerConfigWarningHtml_(){
      var detail = escapeHtml(EXTERNAL_SCANNER_CONFIG_ERROR || 'External scanner settings are missing or invalid.');
      return showBox('warn','⚠️ 外置掃描器設定錯誤，已停用外置掃描按鈕','⚠️ External scanner config is invalid. External scanner has been disabled.','<div class="small">'+detail+'</div>');
    }

    var EXTERNAL_SCANNER_CONFIG = validateExternalScannerConfig_();


    function applyExternalScannerGuard_(msgId, buttonIds){
      if(EXTERNAL_SCANNER_CONFIG.ok) return true;
      (buttonIds || []).forEach(function(id){
        var btn = $(id);
        if(btn){
          btn.disabled = false;
          btn.title = 'External scanner config issue: ' + (EXTERNAL_SCANNER_CONFIG.message || 'invalid config');
        }
      });
      var msgEl = $(msgId || 'msg');
      if(msgEl && !String(msgEl.innerHTML || '').trim()) msgEl.innerHTML = scannerConfigWarningHtml_();
      return false;
    }

    function cameraPolicyAllowed_(){
      try{
        if(document.featurePolicy && typeof document.featurePolicy.allowsFeature === 'function') return !!document.featurePolicy.allowsFeature('camera');
        if(document.permissionsPolicy && typeof document.permissionsPolicy.allowsFeature === 'function') return !!document.permissionsPolicy.allowsFeature('camera');
      }catch(e){}
      return true;
    }
    function shouldPreferExternalScanner_(){
      var topSelf = true;
      try{ topSelf = (window.top === window.self); }catch(e){ topSelf = false; }
      return !cameraPolicyAllowed_() || !topSelf;
    }
    function randomStateToken_(){
      var arr = new Uint8Array(16);
      if(window.crypto && window.crypto.getRandomValues){ window.crypto.getRandomValues(arr); }
      else { for(var i=0;i<arr.length;i++) arr[i]=Math.floor(Math.random()*256); }
      var out='';
      for(var j=0;j<arr.length;j++) out += arr[j].toString(16).padStart(2,'0');
      return out;
    }
    function openExternalScanner_(opts){
      opts = opts || {};
      if(!EXTERNAL_SCANNER_CONFIG.ok){
        if(typeof opts.onError === 'function') opts.onError(EXTERNAL_SCANNER_CONFIG.message || 'External scanner configuration is invalid.');
        return null;
      }
      var state = randomStateToken_();
      pendingExternalScanner_ = {
        state: state,
        flow: String(opts.flow || 'reg'),
        onPayload: opts.onPayload,
        onCancel: opts.onCancel,
        onError: opts.onError
      };

      var target = new URL(EXTERNAL_SCANNER_URL);
      var origin = '';
      try{ origin = String(window.location.origin || ''); }catch(e){}
      if(!origin && window.location){ origin = window.location.protocol + '//' + window.location.host; }
      target.searchParams.set('origin', origin);
      target.searchParams.set('state', state);
      target.searchParams.set('flow', pendingExternalScanner_.flow);

      var w = null;
      try{ w = window.open(target.toString(), '_blank', 'width=460,height=760'); }catch(e){}
      if(!w){
        pendingExternalScanner_ = null;
        if(typeof opts.onPopupBlocked === 'function') opts.onPopupBlocked();
        return null;
      }
      return state;
    }

    window.addEventListener('message', function(event){
      if(!pendingExternalScanner_) return;
      if(!EXTERNAL_SCANNER_ORIGIN || event.origin !== EXTERNAL_SCANNER_ORIGIN) return;
      var data = event.data || {};
      if(!data || String(data.state || '') !== String(pendingExternalScanner_.state || '')) return;
      var type = String(data.type || '');
      if(type !== 'CCF_QR_RESULT' && type !== 'CCF_QR_CANCEL' && type !== 'CCF_QR_ERROR') return;
      var cbPayload = pendingExternalScanner_.onPayload;
      var cbCancel = pendingExternalScanner_.onCancel;
      var cbError = pendingExternalScanner_.onError;
      pendingExternalScanner_ = null;
      if(type === 'CCF_QR_RESULT' && typeof cbPayload === 'function') cbPayload(data.payload);
      if(type === 'CCF_QR_CANCEL' && typeof cbCancel === 'function') cbCancel(data.detail);
      if(type === 'CCF_QR_ERROR' && typeof cbError === 'function') cbError(data.detail);
    });

    function normalizeVrm(s){
      return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    }

    function normalizeServingGroupKey(g){
      var up = String(g||'').trim().toUpperCase();
      if (!up) return '';
      if (up === 'WORSHIP' || up === 'WORSHIP ALLIANCE' || up === '敬拜聯盟') return 'WORSHIP';
      if (up === 'MEDIA' || up === 'MEDIA MASTER' || up === '影像大師') return 'MEDIA';
      if (up === 'LOGISTIC' || up === 'LOGISTICS' || up === 'LOGISTIC SPECIALIST' || up === '後勤特工') return 'LOGISTIC';
      if (up === 'SUPPORT' || up === 'DIVINE SUPPORTER' || up === '聖工支援隊') return 'SUPPORT';
      if (up === 'FINANCE' || up === 'FINANCE DEPT' || up === '財務公司') return 'FINANCE';
      return up;
    }

    function servingGroupCss(k){
      var x = normalizeServingGroupKey(k).toLowerCase();
      return (x==='worship'||x==='media'||x==='logistic'||x==='support'||x==='finance') ? x : '';

    function camListVideoInputs_(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve([]);
      return navigator.mediaDevices.enumerateDevices().then(function(devs){
        var cams = (devs||[]).filter(function(d){ return d && d.kind === 'videoinput'; });
        cams.sort(function(a,b){ return String(a.deviceId||'').localeCompare(String(b.deviceId||'')); });
        return cams;
      }).catch(function(){ return []; });

    function camBuildPreferredConstraints_(){

    function camBindSwitchButton_(btnEl, restartFn){
      if(!btnEl) return;
      camListVideoInputs_().then(function(cams){
        if(!cams || cams.length < 2){
          btnEl.classList.add('hide');

        btnEl.classList.remove('hide');
        btnEl.onclick = function(){
          camListVideoInputs_().then(function(cams2){

            var cur = camGetSelectedId_();
            var idx = cams2.findIndex(function(x){ return x.deviceId === cur; });
            var next = cams2[(idx >= 0 ? idx+1 : 0) % cams2.length];
            camSetSelectedId_(next.deviceId || '');
            if(typeof restartFn === 'function') restartFn();
          });
        };
      });

    function bindImageQrFallback_(msgTarget, onDecoded){
      var inputId = msgTarget + '_qrFile';
      var btnId = msgTarget + '_qrFileBtn';
      var statusId = msgTarget + '_qrFileStatus';
      setTimeout(function(){
        var input = $(inputId);
        var btn = $(btnId);
        var status = $(statusId);
        if(!input || !btn) return;
        btn.onclick = function(){
          var f = input.files && input.files[0];
          if(!f){ if(status) status.innerHTML = '請先選擇圖片 / Please choose an image first.'; return; }
          var fr = new FileReader();
          fr.onload = function(){
            var img = new Image();
            img.onload = function(){
              try{
                var c = document.createElement('canvas');
                c.width = img.naturalWidth || img.width;
                c.height = img.naturalHeight || img.height;
                var x = c.getContext('2d', { willReadFrequently:true });
                x.drawImage(img,0,0,c.width,c.height);
                var d = x.getImageData(0,0,c.width,c.height);
                var qr = window.jsQR ? window.jsQR(d.data, c.width, c.height) : null;
                if(qr && qr.data){
                  if(status) status.innerHTML = '已讀取 QR，處理中… / QR decoded, processing…';
                  if(typeof onDecoded === 'function') onDecoded(String(qr.data||''));
                }else{
                  if(status) status.innerHTML = '無法從此圖片辨識 QR。請嘗試更清晰圖片。 / Cannot decode QR from this image. Try a clearer image.';
                }
              }catch(e){
                if(status) status.innerHTML = '讀取圖片失敗 / Failed to read image';
              }
            };
            img.onerror = function(){ if(status) status.innerHTML = '圖片格式不支援 / Unsupported image format'; };
            img.src = fr.result;
          };
          fr.onerror = function(){ if(status) status.innerHTML = '檔案讀取失敗 / Failed to read file'; };
          fr.readAsDataURL(f);
        };
      }, 0);
      return ''+
        '<div style="margin-top:10px;border-top:1px dashed #d6dcef;padding-top:10px;">'+
          '<div class="small">相機被封鎖時可改用圖片解碼 / If camera is blocked, decode from image</div>'+
          '<input id="'+inputId+'" type="file" accept="image/*" style="margin-top:6px;" />'+
          '<div style="margin-top:6px;"><button id="'+btnId+'" class="alt" type="button">🖼️ 上傳 QR 圖片 / Decode QR image</button></div>'+
          '<div id="'+statusId+'" class="small" style="margin-top:6px;"></div>'+
        '</div>';
    }

    function startScan(videoEl, onCaptured, onError){
      stopScan();
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        var d0 = collectCameraDiagnostics_({ name:'MediaDevicesUnsupported', message:'navigator.mediaDevices.getUserMedia is unavailable' });
        var detail0 = buildCameraStartDetail_({ name:'MediaDevicesUnsupported', message:'navigator.mediaDevices.getUserMedia is unavailable' });
        console.error('E420 camera unsupported', detail0.diagnostics);
        reportScannerE420_('unsupported', d0);
        onError({
          zh:'此裝置不支援相機', en:'Camera not supported', err: { name: detail0.detail },
          detailHtml: '<div class="small">'+escapeHtml(detail0.detail||'')+'</div>' +
            bindCameraRetryButton_('scanMsg', function(){
              openExternalScanner_(onCaptured, function(status){
                if(status === 'success') return;
                if(status === 'blocked') $('scanMsg').innerHTML = showBox('warn','彈出視窗被封鎖','Popup blocked');
                else if(status === 'config_invalid') $('scanMsg').innerHTML = showBox('err','掃描器出現問題','Scanner error','<div class="small">'+escapeHtml(EXTERNAL_SCANNER_CONFIG.message || '')+'</div>');
                else $('scanMsg').innerHTML = showBox('warn','外置掃描未完成','External scanner did not complete');
              });
            }) +
            bindImageQrFallback_('scanMsg', function(decoded){ stopScan(); onCaptured(decoded); })
        });
        return;
      }

      var constraintsPreferred = camBuildPreferredConstraints_();
      var constraintsFacingFallback = { video: { facingMode: { ideal:'environment' } }, audio:false };
      var constraintsFallback = { video: true, audio:false };

      function tryStart(constraints, allowFallback){
        navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
          scan.stream = stream;
          videoEl.srcObject = stream;
          videoEl.setAttribute('playsinline','');
          videoEl.setAttribute('muted','');
          videoEl.muted = true;
          videoEl.autoplay = true;
          return videoEl.play().then(function(){
            scan.scanning = true;
            loop(videoEl, onCaptured);
          });
        }).catch(function(err){
          var sel = camGetSelectedId_();
          var usingExact = !!(sel && constraints && constraints.video && constraints.video.deviceId && constraints.video.deviceId.exact);
          if(usingExact){
            camSetSelectedId_('');
            return tryStart(constraintsFacingFallback, true);
          }
          if(allowFallback) return tryStart(constraintsFallback, false);
          var detail = buildCameraStartDetail_(err);
          if(err && err.name === 'NotAllowedError'){
            onError({
              zh:'相機無法啟動',
              en:'Camera cannot start',
              err: { name: detail },
              detailHtml: '<div class="small">'+escapeHtml(detail)+'</div>' +
                bindCameraRetryButton_('scanMsg', function(){
                  openExternalScanner_(onCaptured, function(status){
                    if(status === 'success') return;
                    if(status === 'blocked') $('scanMsg').innerHTML = showBox('warn','彈出視窗被封鎖','Popup blocked');
                    else if(status === 'config_invalid') $('scanMsg').innerHTML = showBox('err','掃描器出現問題','Scanner error','<div class="small">'+escapeHtml(EXTERNAL_SCANNER_CONFIG.message || '')+'</div>');
                    else $('scanMsg').innerHTML = showBox('warn','外置掃描未完成','External scanner did not complete');
                  });
                }) + bindImageQrFallback_('scanMsg', function(decoded){ stopScan(); onCaptured(decoded); })
            });
            return;
          }
          onError({
            zh:'相機無法啟動', en:'Camera cannot start', err: { name: detail },
            detailHtml: '<div class="small">'+escapeHtml(detail||'')+'</div>' +
              bindCameraRetryButton_('scanMsg', function(){
                openExternalScanner_(onCaptured, function(status){
                  if(status === 'success') return;
                  if(status === 'blocked') $('scanMsg').innerHTML = showBox('warn','彈出視窗被封鎖','Popup blocked');
                  else if(status === 'config_invalid') $('scanMsg').innerHTML = showBox('err','掃描器出現問題','Scanner error','<div class="small">'+escapeHtml(EXTERNAL_SCANNER_CONFIG.message || '')+'</div>');
                  else $('scanMsg').innerHTML = showBox('warn','外置掃描未完成','External scanner did not complete');
                });
              }) + bindImageQrFallback_('scanMsg', function(decoded){ stopScan(); onCaptured(decoded); })
          });
        });
      }

      tryStart(constraintsPreferred, true);
    }

    function loop(videoEl, onCaptured){
      if(!scan.scanning) return;

      if(!videoEl || videoEl.readyState < 2){
        scan.raf = requestAnimationFrame(function(){ loop(videoEl, onCaptured); });
        return;
      }

      try{
        if('BarcodeDetector' in window){
          scan.detector = scan.detector || new BarcodeDetector({ formats:['qr_code'] });
          scan.detector.detect(videoEl).then(function(codes){
            var v = (codes && codes.length && codes[0].rawValue) ? codes[0].rawValue : null;
            if(v){
              stopScan();
              onCaptured(v);
              return;
            }
            scan.raf = requestAnimationFrame(function(){ loop(videoEl, onCaptured); });
          }).catch(function(){
            scan.raf = requestAnimationFrame(function(){ loop(videoEl, onCaptured); });
          });
          return;
        }
      }catch(e){}

      try{
        var canvas = scan._c || (scan._c = document.createElement('canvas'));
        var ctx = scan._x || (scan._x = canvas.getContext('2d', { willReadFrequently:true }));
        canvas.width = videoEl.videoWidth;
        canvas.height = videoEl.videoHeight;
        ctx.drawImage(videoEl,0,0,canvas.width,canvas.height);
        var img = ctx.getImageData(0,0,canvas.width,canvas.height);
        var qr = window.jsQR(img.data, canvas.width, canvas.height);
        if(qr && qr.data){
          stopScan();
          onCaptured(qr.data);
          return;
        }
      }catch(e){}

      scan.raf = requestAnimationFrame(function(){ loop(videoEl, onCaptured); });
    }

    function viewSelfLive(res){
      res = res || {};

      var last = res.lastAttendance || {};
      var groups = {};
      function normalizedGroupKey(g){
        return String(g||'').trim().toLowerCase();
      }
      (res.servingThisWeek||[]).forEach(function(r){
        var g = normalizedGroupKey(r.group) || 'other';
        if (!groups[g]) groups[g] = [];
        groups[g].push(r);
      });
      function badgeCls(g){
        var k = normalizedGroupKey(g);
        return (k==='worship'||k==='media'||k==='logistic'||k==='support'||k==='finance') ? k : '';
      }
      function livePosLabel_(r){
        var zh = String(r.positionZh||'').trim();
        var en = String(r.positionEn||'').trim();
        if (!en) return zh;
        if (!zh) return en;
        if (en.toUpperCase().indexOf(zh.toUpperCase()) >= 0) return en;
        return zh + ' / ' + en;
      }
      var blocks = Object.keys(groups).map(function(g){
        var rows = groups[g].map(function(r){
          return '<li>'+escapeHtml(livePosLabel_(r))+' · '+escapeHtml(r.displayName||'')+'</li>';

        var title = ((groups[g][0]&&groups[g][0].groupZh)||g)+' / '+((groups[g][0]&&groups[g][0].groupEn)||g);

    function render(){
      stopScan();

      if(State.view === 'home'){
        $('app').innerHTML = viewHome();
        applyExternalScannerGuard_('msg', []);
        if ($('btnSwitchToLive')) $('btnSwitchToLive').onclick = function(){
          navigateToLivePortal();
        };
        $('btnNew').onclick = function(){
          State.view = 'form';
          State.flow = 'create';
          State.prefill = null;
          State.authQrPayload = null;
          State.keepExistingQr = false;
          render();
        };
        $('btnScan').onclick = function(){
          $('msg').innerHTML = showBox('warn','正在打開掃描器…','Opening scanner…');
          var opened = openExternalScanner_({
            flow:'reg',
            onPayload:function(payload){
              State.view = 'scan';
              render();
              handleScanPayload_(payload);
            },
            onCancel:function(){
              $('msg').innerHTML = showBox('warn','已取消掃描','Scan cancelled.');
            },
            onError:function(detail){
              State.view = 'scan';
              render();
              $('scanMsg').innerHTML = showBox('err','掃描器出現問題','Scanner error', '<div class="small">'+escapeHtml(String(detail||''))+'</div>');
            },
            onPopupBlocked:function(){
              State.view = 'scan';
              render();
              $('scanMsg').innerHTML = showBox('warn','未能打開彈出視窗，已切換內置掃描器','Popup blocked; switched to built-in scanner.','<div class="small">If camera does not open, tap again.</div>');
            }
          });
          if(opened){ $('msg').innerHTML = showBox('warn','請在彈出視窗完成掃描','Complete scanning in the popup.'); }
        };
        return;
      }

      if(State.view === 'scan'){
        $('app').innerHTML = viewScan();
        bindScan();
        return;
      }

      if(State.view === 'selfHome'){
        $('app').innerHTML = viewSelfHome(State.prefill || {});
        bindSelfHome();
        return;
      }

      if(State.view === 'selfAttendance'){
        $('app').innerHTML = viewAttendance(State.lastResult || {});
        bindAttendance();
        return;
      }

      if(State.view === 'selfServing'){
        $('app').innerHTML = viewSelfServing(State.lastResult || {});
        bindServing();
        return;
      }

      if(State.view === 'selfLive'){
        $('app').innerHTML = viewSelfLive(State.lastResult || {});
        bindLive();
        return;
      }

      if(State.view === 'selfHoliday'){
        $('app').innerHTML = viewSelfHoliday((State.snapshot && State.snapshot.member) ? State.snapshot.member : {});
        bindHoliday();
        return;
      }

      if(State.view === 'form'){
        $('app').innerHTML = viewForm(State.prefill || {});
        bindForm();
        return;
      }

      if(State.view === 'success'){
        $('app').innerHTML = viewSuccess(State.lastResult || {});
        try{ drawQr('qrTarget', (State.lastResult||{}).qrPayload ); }catch(e){}
        $('btnHome').onclick = function(){
          State.view='home';
          State.lastResult=null;
          State.lastSubmit=null;
          State.prefill=null;
          State.authQrPayload=null;
          State.keepExistingQr=false;
          render();
        };
        return;
      }
    }

    /******** Bindings ********/
    function handleScanPayload_(text){
      $('scanMsg').innerHTML = showBox('warn','讀取中…','Loading…');

      callApi('api_reg_self_lookup_public', text).then(function(res){
        if(!res || !res.ok){
          $('scanMsg').innerHTML = showServerErr(res);
          return;
        }

        stopScan();
        State.view = 'selfHome';
        State.flow = 'self_update';
        State.authQrPayload = text;
        State.prefill = res.member;
        State.lastResult = null;
        callApi('api_reg_self_portal_snapshot_public', text).then(function(snap){
          State.snapshot = (snap && snap.ok) ? snap : null;
          render();
        }).catch(function(){
          State.snapshot = null;
          render();
        });

      }).catch(function(err){
        var msg = (err && err.message) ? err.message : String(err||'');
        $('scanMsg').innerHTML = showBox('err','系統錯誤','System error', msg ? ('<div class="small">'+escapeHtml(msg)+'</div>') : '');
      });
    }

    function bindScan(){
      var v = $('video');

      function restartScan(){
        $('scanMsg').innerHTML = '';
        startScan(v, onCaptured, function(e){
          var detail = (e && e.detailHtml) ? e.detailHtml : '';
          if(!detail && e && e.err && e.err.name) detail = '<div class="small">'+escapeHtml(e.err.name)+'</div>';
          $('scanMsg').innerHTML = showBox('err','相機無法啟動','Camera cannot start', detail);
        });
      }

      $('btnCancelScan').onclick = function(){
        stopScan();
        State.view='home';
        render();
      };

      if($('btnStartScanCam')) $('btnStartScanCam').onclick = function(){
        restartScan();
      };

      camBindSwitchButton_($('btnSwitchCam'), function(){
        stopScan();
        restartScan();
      });

      function onCaptured(text, source){
        $('scanMsg').innerHTML = showBox('warn','讀取中…','Loading…');

        callApi('api_reg_self_lookup_public', text).then(function(res){
          if(!res || !res.ok){
            $('scanMsg').innerHTML = showServerErr(res);
            return;
          }

          stopScan();
          State.view = 'selfHome';
          State.flow = 'self_update';
          State.authQrPayload = text;
          State.prefill = res.member;
          State.lastResult = null;
          callApi('api_reg_self_portal_snapshot_public', text).then(function(snap){

        var res = State.lastResult || {};
        var selectedGroup = normalizeServingGroupKey(State.servingGroup);
        var selectedMonth = String(State.servingMonth||'').trim();
        if (!res.ok) return true;
        if (!selectedGroup) return false;

        var positions = Array.isArray(res.positions) ? res.positions : [];
        var hasGroupPositions = positions.some(function(p){
          return normalizeServingGroupKey((p && p.group) || '') === selectedGroup;
        });
        if (!hasGroupPositions) return true;

        if (!selectedMonth) return false;
        var events = Array.isArray(res.events) ? res.events : [];
        var hasMonthEvents = events.some(function(ev){
          var mKey = String((ev && ev.eventKey) || '').replace(/^SundayService_(\d{4}-\d{2})-\d{2}$/, '$1');

    function readFormData_(){
      var ccRaw = $('phoneCc').value.trim();
      var natRaw = $('phoneNat').value.trim();
      var ccDig = ccRaw.replace(/\D/g,'');
      var natDig = natRaw.replace(/\D/g,'');

      if (ccDig === '44' && !natDig) ccDig = '';

      return {
        nameZh: $('nameZh').value.trim(),
        nameEn: $('nameEn').value.trim(),
        preferredName: $('preferredName').value.trim(),
        referredBy: $('referredBy') ? $('referredBy').value.trim() : '',

        email: $('email').value.trim(),
        optInEmail: $('optInEmail').checked,

        notes: $('notes').value.trim(),

        phoneCc: ccDig,
        phoneNat: natDig,

        isMinor: $('isMinor').checked,
        parentEmail: $('parentEmail') ? $('parentEmail').value.trim() : '',

        hasCar: window._hasCar,
        vrm: normalizeVrm($('vrm') ? $('vrm').value : ''),
        vrm2: normalizeVrm($('vrm2') ? $('vrm2').value : ''),

        deviceId: getDeviceId(),
        ua: getUA()
      };
    }

    function validateLocal(d){
      if (d.email && d.parentEmail && d.email.trim().toLowerCase() === d.parentEmail.trim().toLowerCase()){
        return { ok:false, zh:'家長電郵與本人電郵相同，請刪除其中一個或改用不同電郵。', en:'Parent email equals member email. Remove one or use a different email.' };
      }

      if (d.optInEmail && !d.email){
        return { ok:false, zh:'如選擇接收電郵，請填寫電郵；或取消勾選後再繼續', en:'Email is required if email opt-in is checked.' };
      }

      var hasPhone = (d.phoneCc && d.phoneNat);
      if (!d.email && !hasPhone){
        return { ok:false, zh:'請填寫手機或電郵（至少一項）', en:'Please provide phone or email (at least one).' };
      }

      if(hasPhone){
        if (d.phoneCc === '852' && d.phoneNat.length !== 8){
          return { ok:false, zh:'香港號碼必須為 8 位數。', en:'Hong Kong number must be 8 digits.' };
        }
        if (d.phoneCc === '44'){
          var okUk = (d.phoneNat.length === 10) || (d.phoneNat.length === 11 && d.phoneNat[0] === '0');
          if(!okUk) return { ok:false, zh:'英國號碼格式不正確（10 位數，或 11 位並以 0 開頭）。', en:'UK number invalid.' };
        }
      }

      if(!d.nameZh && !d.nameEn) return { ok:false, zh:'請填寫中文名或英文名（至少一項）', en:'Please provide Chinese or English name (at least one).' };
      if(!d.nameZh && d.nameEn){
        var parts = d.nameEn.split(/\s+/).filter(Boolean);
        if(parts.length < 2) return { ok:false, zh:'只填英文名時，請同時填寫名及姓', en:'If only English name, include first and last name.' };
      }

      if(d.hasCar !== 'YES' && d.hasCar !== 'NO') return { ok:false, zh:'請選擇是否有車', en:'Please choose whether you have a car.' };
      if(d.hasCar === 'YES' && !d.vrm && !d.vrm2) return { ok:false, zh:'如有車，請填寫至少一個車牌', en:'If you have a car, provide at least one VRM.' };

      return { ok:true };
    }

        closeModal(modal);
        State.submitting = false;
        try{ var b=$('btnSubmit'); if(b) b.disabled=false; }catch(e){}
      };
      modal.querySelector('#btnGo').onclick = function(){
        var keep = !!modal.querySelector('#optKeepQr').checked;
        closeModal(modal);
        State.keepExistingQr = keep;
        onConfirm(keep);
      };
    }
    /* ============================================================
     * PATCH_BOUNDARY: REG2_KEEPQR_CONFIRM_END
     * ============================================================ */

    function showCandidatesModal(list, data){
      var rows = list.map(function(c){
        var nm = ((c.nameZh||'')+' '+(c.nameEn||'')).trim() || c.id;
        var vrmLine = c.vrmMasked ? ('<div><b>車牌</b>: '+escapeHtml(c.vrmMasked)+'</div>') : '';
        return ''+
          '<div class="msgBox warn" style="margin-top:10px;">'+
            '<div class="big warn" style="font-size:18px;">'+escapeHtml(nm)+'</div>'+
            '<div class="small" style="margin-top:6px;">'+
              '<div><b>CCF ID</b>: '+escapeHtml(c.id)+'</div>'+
              (c.emailMasked ? ('<div><b>Email</b>: '+escapeHtml(c.emailMasked)+'</div>') : '')+
              (c.mobileMasked ? ('<div><b>Mobile</b>: '+escapeHtml(c.mobileMasked)+'</div>') : '')+
              vrmLine+
            '</div>'+
            (c.isStaff
              ? showBox('err','此為同工記錄，請聯絡影音同工','Staff record — contact Media team')
              : '<div class="miniBtnRow">'+
                  '<button class="primary" data-use="'+escapeHtml(c.id)+'">✅ 同一人 / Same person</button>'+
                '</div>'
            )+
          '</div>';
      }).join('');

      var modal = openModal(
        '<div class="big">可能已有記錄 / Possible match</div>'+
        '<div class="small">如是同一人，請選擇「Same person」以覆寫資料並（如需要）重新發出新 QR。</div>'+
        rows+
        '<div class="divider"></div>'+
        '<div class="miniBtnRow">'+
          '<button id="btnNone" class="alt" type="button">都不是，建立新會員 / Create new</button>'+
          '<button id="btnBack" class="danger" type="button">返回修改 / Back</button>'+
        '</div>'
      );

      modal.querySelector('#btnBack').onclick = function(){
        closeModal(modal);
        $('formMsg').innerHTML='';
        State.submitting = false;
        try{ var b=$('btnSubmit'); if(b) b.disabled=false; }catch(e){}
      };
      modal.querySelector('#btnNone').onclick = function(){
        closeModal(modal);
        doCreate(data);
      };

      Array.prototype.slice.call(modal.querySelectorAll('button[data-use]')).forEach(function(btn){
        btn.onclick = function(){
          var id = btn.getAttribute('data-use');
          closeModal(modal);

          confirmUpdateThen(function(keep){
            data.keepExistingQr = !!keep;
            $('formMsg').innerHTML = showBox('warn','更新中…','Updating…');

            callApi('api_reg_update_by_id_public', id, data).then(handleResult).catch(function(err){
              var msg = (err && err.message) ? err.message : String(err||'');
              $('formMsg').innerHTML = showBox('err','系統錯誤','System error', msg ? ('<div class="small">'+escapeHtml(msg)+'</div>') : '');
              State.submitting = false;
              try{ var b=$('btnSubmit'); if(b) b.disabled=false; }catch(e){}
            });
          });
        };
      });
    }

    function doCreate(data){
      $('formMsg').innerHTML = showBox('warn','建立中…','Creating…');
      callApi('api_reg_create_member_public', data).then(handleResult).catch(function(err){
        var msg = (err && err.message) ? err.message : String(err||'');
        $('formMsg').innerHTML = showBox('err','系統錯誤','System error', msg ? ('<div class="small">'+escapeHtml(msg)+'</div>') : '');
        State.submitting = false;
        try{ var b=$('btnSubmit'); if(b) b.disabled=false; }catch(e){}
      });
    }

    function handleResult(res){
      if(!res || !res.ok){
        $('formMsg').innerHTML = showServerErr(res);
        State.submitting = false;
        try{ var b=$('btnSubmit'); if(b) b.disabled=false; }catch(e){}
        return;
      }
      State.lastResult = res;
      State.view = 'success';
      State.submitting = false;
      try{ var b=$('btnSubmit'); if(b) b.disabled=false; }catch(e){}
      render();
    }

    
    function updateGlobalClock_(){
      var el = $('globalClock');
      if(!el) return;
      try{
        var now = new Date();
        var localTz = (Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local');
        var localText = now.toLocaleString();
        var ukText = now.toLocaleString('en-GB', { timeZone:'Europe/London', hour12:false });
        var mismatch = (localTz !== 'Europe/London');
        el.innerHTML = '本地時間 / Local: '+escapeHtml(localText)+' ('+escapeHtml(localTz)+')'+(mismatch ? ('<br/><span class="timeFallback">英國時間 / UK: '+escapeHtml(ukText)+' (Europe/London)</span>') : '');
      }catch(e){
        el.innerHTML = '<span class="timeFallback">英國時間 / UK: '+escapeHtml(new Date().toLocaleString('en-GB', { timeZone:'Europe/London', hour12:false }))+'</span>';
      }
    }
    function startGlobalClock_(){
      updateGlobalClock_();
      if(window._clockTimer) clearInterval(window._clockTimer);
      window._clockTimer = setInterval(updateGlobalClock_, 1000);
    }

// init
    startGlobalClock_();
    try { render(); } catch (e) { showBootError_(e); }
  </script>
</body>
